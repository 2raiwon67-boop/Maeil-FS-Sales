<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - FS MISO</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <img src="assets/images/logo.png" alt="Maeil Logo" class="mx-auto mb-4 w-32">
            <h1 id="formTitle" class="text-2xl font-bold text-gray-800">FS MISO</h1>
            <p class="text-blue-600 font-medium mt-1 mb-2">FS 영업사원을 위한 All-In-One 대시보드</p>
            <p class="text-gray-500 text-sm">안전한 서비스 이용을 위해 로그인해주세요.</p>
        </div>

        <!-- novalidate: 브라우저 기본 유효성 검사 비활성화, JS에서 직접 처리 -->
        <form id="loginForm" class="space-y-6" novalidate>

            <!-- 이메일 -->
            <div id="emailField">
                <label for="email" class="block text-sm font-medium text-gray-700">이메일</label>
                <input type="email" id="email"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                    placeholder="admin@maeil.com">
            </div>

            <!-- 비밀번호 -->
            <div id="passwordField">
                <label for="password" class="block text-sm font-medium text-gray-700">비밀번호</label>
                <input type="password" id="password"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                    placeholder="••••••••">
            </div>

            <!-- 회원가입 추가 정보 -->
            <div id="signupFields" class="hidden space-y-4">
                <div>
                    <label for="fullName" class="block text-sm font-medium text-gray-700">이름</label>
                    <input type="text" id="fullName"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        placeholder="홍길동">
                </div>
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700">연락처</label>
                    <input type="tel" id="phone"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        placeholder="010-1234-5678">
                </div>
                <div>
                    <label for="businessUnit" class="block text-sm font-medium text-gray-700">소속</label>
                    <select id="businessUnit"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white">
                        <option value="">소속 선택</option>
                    </select>
                    <p class="mt-1 text-xs text-gray-400">관리자 승인 시 최종 확정됩니다.</p>
                </div>
            </div>

            <!-- 개인정보 수집 동의 (회원가입 시에만 표시) -->
            <div id="privacyField" class="hidden">
                <div class="bg-gray-50 border border-gray-200 rounded-md p-3 text-xs text-gray-600 leading-relaxed">
                    <p class="font-semibold text-gray-700 mb-1">수집하는 개인정보 항목</p>
                    <p>이름, 이메일, 연락처</p>
                    <p class="font-semibold text-gray-700 mt-2 mb-1">수집 및 이용 목적</p>
                    <p>FS MISO 서비스 로그인 및 담당자 식별, 방문일지 연동</p>
                    <p class="font-semibold text-gray-700 mt-2 mb-1">보유 및 이용 기간</p>
                    <p>서비스 탈퇴 시 즉시 삭제</p>
                </div>
                <label class="flex items-center gap-2 mt-2 cursor-pointer">
                    <input type="checkbox" id="privacyConsent"
                        class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <span class="text-sm text-gray-700">개인정보 수집 및 이용에 동의합니다 <span class="text-red-500">*</span></span>
                </label>
            </div>

            <!-- 로그인 저장 (로그인 모드 전용) -->
            <div id="rememberField" class="hidden">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" id="rememberMe"
                        class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <span class="text-sm text-gray-600">로그인 저장
                        <span class="text-xs text-gray-400">(이 기기에서 자동 입력 · PC/모바일 각 1대)</span>
                    </span>
                </label>
            </div>

            <!-- 관리자 코드 -->
            <div id="adminField" class="hidden">
                <label for="adminCode" class="block text-sm font-medium text-gray-700">관리자 인증 코드</label>
                <input type="password" id="adminCode"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500"
                    placeholder="인증 코드 6자리">
            </div>

            <div id="errorMessage" class="text-red-500 text-sm text-center hidden"></div>

            <button type="submit" id="loginBtn"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                로그인
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500 space-y-2">
            <p id="signupRow">계정이 없으신가요? <a href="#" id="signupToggle" class="text-blue-600 hover:text-blue-500">회원가입</a></p>
            <p><a href="#" id="adminToggle" class="text-gray-400 hover:text-gray-600 text-xs">관리자 로그인</a></p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        const loginForm    = document.getElementById('loginForm');
        const errorMsg     = document.getElementById('errorMessage');
        const loginBtn     = document.getElementById('loginBtn');
        const signupToggle = document.getElementById('signupToggle');
        const adminToggle  = document.getElementById('adminToggle');
        const signupRow    = document.getElementById('signupRow');
        const signupFields = document.getElementById('signupFields');
        const privacyField = document.getElementById('privacyField');
        const adminField   = document.getElementById('adminField');
        const rememberField= document.getElementById('rememberField');
        const emailField   = document.getElementById('emailField');
        const passwordField= document.getElementById('passwordField');
        const formTitle    = document.getElementById('formTitle');

        // 저장된 이메일 자동 입력
        const savedEmail = localStorage.getItem('fs_saved_email');
        if (savedEmail) {
            document.getElementById('email').value = savedEmail;
            document.getElementById('rememberMe').checked = true;
        }

        // 소속 드롭다운 옵션 동적 생성 (BUSINESS_UNITS는 auth.js에서 로드)
        if (typeof BUSINESS_UNITS !== 'undefined') {
            const buSelect = document.getElementById('businessUnit');
            BUSINESS_UNITS.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u;
                opt.textContent = u;
                buSelect.appendChild(opt);
            });
        }

        let mode = 'login'; // 'login' | 'signup' | 'admin'

        function updateUI() {
            errorMsg.classList.add('hidden');

            if (mode === 'admin') {
                formTitle.innerText = '관리자 접속';
                emailField.classList.add('hidden');
                passwordField.classList.add('hidden');
                signupFields.classList.add('hidden');
                privacyField.classList.add('hidden');
                adminField.classList.remove('hidden');
                rememberField.classList.add('hidden');
                signupRow.classList.add('hidden');

                loginBtn.innerText = '관리자 접속';
                loginBtn.className = loginBtn.className
                    .replace('bg-blue-600', 'bg-gray-800')
                    .replace('hover:bg-blue-700', 'hover:bg-gray-900');

                adminToggle.innerText = '일반 로그인으로 돌아가기';

            } else if (mode === 'signup') {
                formTitle.innerText = '계정 생성';
                emailField.classList.remove('hidden');
                passwordField.classList.remove('hidden');
                signupFields.classList.remove('hidden');
                privacyField.classList.remove('hidden');
                adminField.classList.add('hidden');
                rememberField.classList.add('hidden');
                signupRow.classList.remove('hidden');

                loginBtn.innerText = '회원가입 신청';
                loginBtn.className = loginBtn.className
                    .replace('bg-gray-800', 'bg-blue-600')
                    .replace('hover:bg-gray-900', 'hover:bg-blue-700');

                signupToggle.innerText = '로그인으로 돌아가기';
                adminToggle.innerText = '관리자 로그인';

            } else { // login
                formTitle.innerText = 'FS MISO';
                emailField.classList.remove('hidden');
                passwordField.classList.remove('hidden');
                signupFields.classList.add('hidden');
                privacyField.classList.add('hidden');
                adminField.classList.add('hidden');
                rememberField.classList.remove('hidden');
                signupRow.classList.remove('hidden');

                loginBtn.innerText = '로그인';
                loginBtn.className = loginBtn.className
                    .replace('bg-gray-800', 'bg-blue-600')
                    .replace('hover:bg-gray-900', 'hover:bg-blue-700');

                signupToggle.innerText = '회원가입';
                adminToggle.innerText = '관리자 로그인';
            }
        }

        signupToggle.addEventListener('click', (e) => {
            e.preventDefault();
            mode = (mode === 'signup') ? 'login' : 'signup';
            updateUI();
        });

        adminToggle.addEventListener('click', (e) => {
            e.preventDefault();
            mode = (mode === 'admin') ? 'login' : 'admin';
            updateUI();
        });

        updateUI();

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');

            // ── 관리자 모드 ──
            if (mode === 'admin') {
                const code = document.getElementById('adminCode').value.trim();
                if (code === '532753') {
                    try {
                        sessionStorage.setItem('fs_admin_access', 'true');
                        window.location.href = 'index.html';
                    } catch {
                        showError('브라우저 설정 오류로 로그인이 차단되었습니다. 쿠키/사이트 데이터 설정을 확인해주세요.');
                    }
                } else {
                    showError('인증 코드가 올바르지 않습니다.');
                }
                return;
            }

            // ── 일반 / 회원가입 모드 ──
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) { showError('이메일과 비밀번호를 입력해주세요.'); return; }

            loginBtn.disabled = true;
            loginBtn.innerText = '처리 중...';

            try {
                if (mode === 'signup') {
                    const fullName     = document.getElementById('fullName').value.trim();
                    const phone        = document.getElementById('phone').value.trim();
                    const businessUnit = document.getElementById('businessUnit').value;
                    if (!fullName || !phone) throw new Error('이름과 연락처를 모두 입력해주세요.');
                    if (!businessUnit) throw new Error('소속을 선택해주세요.');
                    if (!document.getElementById('privacyConsent').checked) throw new Error('개인정보 수집 및 이용에 동의해주세요.');

                    const result = await signUp(email, password, { full_name: fullName, phone, business_unit: businessUnit });
                    if (result.error) throw result.error;

                    if (typeof matchManagerEmail === 'function') {
                        matchManagerEmail(fullName, email).catch(() => {});
                    }
                    window.location.href = 'index.html';

                } else {
                    const result = await signIn(email, password);
                    if (result.error) {
                        if (result.error.message.includes('Email not confirmed')) {
                            throw new Error('가입 신청이 아직 처리 중입니다.\n관리자 승인 대기 중이거나, 이메일 인증이 필요한 경우 수신함을 확인해주세요.');
                        }
                        throw result.error;
                    }

                    const loggedName = result.data?.user?.user_metadata?.full_name || '';
                    if (typeof matchManagerEmail === 'function' && loggedName) {
                        matchManagerEmail(loggedName, email).catch(() => {});
                    }

                    // 로그인 저장 처리
                    const remember = document.getElementById('rememberMe').checked;
                    if (remember) {
                        localStorage.setItem('fs_saved_email', email);
                        const reg = await registerDevice();
                        if (!reg.ok && reg.conflictDevice) {
                            const typeLabel = reg.deviceType === 'pc' ? 'PC' : '모바일';
                            const conflict  = reg.conflictDevice;
                            const replace = confirm(
                                `이미 다른 ${typeLabel} 기기(${conflict.name})에서 로그인이 저장되어 있습니다.\n\n기존 기기를 해제하고 이 기기로 교체하시겠습니까?`
                            );
                            if (replace) {
                                await replaceDevice();
                            }
                            // 교체하지 않아도 로그인은 정상 진행
                        }
                    } else {
                        // 체크 해제 시 저장 이메일 및 기기 등록 제거
                        localStorage.removeItem('fs_saved_email');
                        if (typeof unregisterDevice === 'function') {
                            await unregisterDevice();
                        }
                    }

                    window.location.href = 'index.html';
                }
            } catch (error) {
                let msg = error.message;
                if (msg === 'Invalid login credentials') msg = '이메일 또는 비밀번호가 일치하지 않습니다.';
                showError(msg || '알 수 없는 오류가 발생했습니다.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = (mode === 'signup') ? '회원가입 신청' : '로그인';
            }
        });

        function showError(msg) {
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
        }
    </script>
</body>

</html>
