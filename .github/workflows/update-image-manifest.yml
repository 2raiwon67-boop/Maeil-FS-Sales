name: Update Image Manifest
on:
  push:
    paths:
      - 'assets/images/**'
jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate image manifest
        run: |
          python3 -c "
          import os, json
          path = 'assets/images'
          exts = ('.jpg', '.jpeg', '.png', '.gif', '.webp')
          files = sorted([
              f for f in os.listdir(path)
              if f.lower().endswith(exts) and f != 'logo.png'
          ])
          with open(os.path.join(path, 'manifest.json'), 'w', encoding='utf-8') as fp:
              json.dump(files, fp, ensure_ascii=False, indent=2)
          print(f'manifest.json generated — {len(files)} images')
          "
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images/manifest.json
          git diff --staged --quiet || git commit -m "chore: auto-update image manifest [skip ci]"
          git push
