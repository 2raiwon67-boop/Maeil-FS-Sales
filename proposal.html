        async function loadQuote(id) {
            const user = await getUser();
            const businessUnit = user?.user_metadata?.business_unit;
            if (!businessUnit) { showToast('사업부 정보가 없습니다.', 'error'); return; }

            const { data, error } = await client.from('quotes')
                .select('*')
                .eq('id', id)
                .eq('business_unit', businessUnit)   // ← ID를 알아도 다른 지점 견적서 접근 불가
                .single();

            document.getElementById('edit-customerName').value = data.customer_name || '';
            document.getElementById('edit-managerName').value = data.manager_name || '';
            document.getElementById('edit-managerPhone').value = data.manager_phone || '';

            const modeInput = document.querySelector(`input[name="quoteMode"][value="${data.quote_mode}"]`);

            (data.items || []).forEach(item => {
                addRow({ name: item.name, spec: item.spec, price: item.factoryPrice || 0, salesPrice: item.salesPrice || 0, taxFree: false, maxDc: 0 });

            } else {
                const keywords = PICKER_CAT_KEYWORDS[cat] || [cat];
                products = productDB.filter(p => keywords.some(kw => p.name.includes(kw)));
            }

            if (products.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;color:#aaa;font-size:13px;">해당 카테고리 상품 없음</div>`;
                return;
            }

            const selectedNames = Object.values(_pickerSelectedMap);
            grid.innerHTML = products.map(p => {
                const imgUrl = findProductImage(p.name);
                const count = selectedNames.filter(n => n === p.name).length;
                return `
                    <div class="picker-card${count > 0 ? ' selected' : ''}"
                         onclick="pickerCardTapEl(this)"
                         data-pname="${esc(p.name)}"
                         data-spec="${esc(p.spec || '')}"
                         data-expiry="${esc(p.expiryDate || '')}"
                         data-price="${p.price || 0}"
                         data-taxfree="${p.taxFree || false}"
                         data-maxdc="${p.maxDc || 0}">
                        ${count > 0 ? `<div class="picker-card-badge">${count}</div>` : ''}
                        <div class="picker-card-img">
                            ${imgUrl
                        ? `<img src="${imgUrl}" loading="lazy" onerror="this.parentNode.innerHTML='<span style=\\'font-size:22px;\\'>📦</span>'">`
                        : '<span style="font-size:22px;">📦</span>'}
                        </div>
                        <div class="picker-card-name">${p.name}</div>
                        ${p.spec ? `<div class="picker-card-spec">${p.spec}</div>` : ''}
                    </div>`;
            }).join('');
        }

        function filterPickerCat(btn, cat) {
            document.querySelectorAll('.picker-cat').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPickerCards(cat);
        }

        let _pendingPickerCard = null;

        function pickerCardTapEl(el) {
            const card = el.closest('.picker-card');
            _pendingPickerCard = {
                name: card.dataset.pname,
                spec: card.dataset.spec,
                expiryDate: card.dataset.expiry,
                price: parseFloat(card.dataset.price) || 0,
                taxFree: card.dataset.taxfree === 'true',
                maxDc: parseFloat(card.dataset.maxdc) || 0
            };
            showPriceSheet(_pendingPickerCard);
        }

        function showPriceSheet(product) {
            document.getElementById('pps-name').textContent = product.name;
            document.getElementById('pps-spec').textContent = product.spec || '';
            const imgUrl = findProductImage(product.name);
            const imgEl = document.getElementById('pps-img');
            imgEl.innerHTML = imgUrl
                ? `<img src="${imgUrl}" onerror="this.parentNode.innerHTML='📦'">`
                : '📦';
            const input = document.getElementById('pps-price-input');
            input.value = product.price > 0 ? product.price : '';
            document.getElementById('picker-price-sheet').classList.add('visible');
            requestAnimationFrame(() => input.focus());
        }

        function closePriceSheet() {
            document.getElementById('picker-price-sheet').classList.remove('visible');
            _pendingPickerCard = null;
        }

        function confirmPriceSheet() {
            if (!_pendingPickerCard) return;
            const price = parseFloat(document.getElementById('pps-price-input').value) || 0;
            pickerCardTap(
                _pendingPickerCard.name,
                _pendingPickerCard.spec,
                _pendingPickerCard.expiryDate,
                price,
                _pendingPickerCard.taxFree,
                _pendingPickerCard.maxDc
            );
            closePriceSheet();
        }

        function pickerCardTap(name, spec, expiryDate, price, taxFree, maxDc) {
            addRow({ name, spec, expiryDate, price, taxFree, maxDc });
            const lastRow = document.querySelector('#editor-items-container > div:last-child');
            const rowId = lastRow ? lastRow.querySelector('.row-id')?.value : null;
            if (rowId) _pickerSelectedMap[rowId] = name;
            _refreshPickerUI();
        }

        function pickerRemoveItem(rowId) {
            removeRow(rowId);
            delete _pickerSelectedMap[rowId];
            _refreshPickerUI();
        }

        function _refreshPickerUI() {
            // 카드 배지 업데이트
            const selectedNames = Object.values(_pickerSelectedMap);
            document.querySelectorAll('.picker-card').forEach(card => {
                const pname = card.dataset.pname;
                const count = selectedNames.filter(n => n === pname).length;
                card.classList.toggle('selected', count > 0);
                const existing = card.querySelector('.picker-card-badge');
                if (existing) existing.remove();
                if (count > 0) {
                    const badge = document.createElement('div');
                    badge.className = 'picker-card-badge';
                    badge.textContent = count;
                    card.prepend(badge);
                }
            });
            // 선택 항목 바 업데이트
            const bar = document.getElementById('picker-selected-bar');
            const list = document.getElementById('picker-selected-list');
            const countEl = document.getElementById('picker-count');
            const entries = Object.entries(_pickerSelectedMap);
            if (!bar || !list) return;
            if (entries.length === 0) { bar.style.display = 'none'; return; }
            bar.style.display = 'block';
            if (countEl) countEl.textContent = entries.length;
            list.innerHTML = entries.map(([rowId, name]) => `
                <div class="picker-sel-item">
                    <span class="picker-sel-name">${name}</span>
                    <button class="picker-sel-remove" onclick="pickerRemoveItem('${rowId}')">✕</button>
                </div>`).join('');
            updatePickerTotal();
        }

        function updatePickerTotal() {
            const el = document.getElementById('picker-total-amount');
            if (!el) return;
            const editorRows = document.querySelectorAll('#editor-items-container > div');
            let total = 0;
            editorRows.forEach(row => { total += parseFloat(row.querySelector('.sales-price').value) || 0; });
            el.textContent = Math.floor(total).toLocaleString() + '원';
        }

        function togglePickerInfo() {
            const panel = document.getElementById('picker-info-panel');
            if (!panel) return;
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }

        function pickerGenerate() {
            if (Object.keys(_pickerSelectedMap).length === 0) {
                showToast('상품을 한 개 이상 선택해주세요.', 'warning');
                return;
            }

            // 데스크탑 모달 모드: 모달만 닫고 선택 항목 유지
            if (document.getElementById('mobile-picker').classList.contains('desktop-open')) {
                closeDesktopPicker();
                rebuildPreview();
                return;
            }

            // 모바일: 피커에서 선택되지 않은 행 제거 후 미리보기
            Array.from(document.querySelectorAll('#editor-items-container > div')).forEach(row => {
                const rowId = row.querySelector('.row-id')?.value;
                if (!rowId || !_pickerSelectedMap[rowId]) row.remove();
            });
            const custInput = document.getElementById('picker-customer-input');
            const mgrInput = document.getElementById('picker-manager-input');
            if (custInput) document.getElementById('edit-customerName').value = custInput.value;
            if (mgrInput) document.getElementById('edit-managerName').value = mgrInput.value;
            syncInfo();
            rebuildPreview();
            showMobilePreview();
        }

        // 모바일 AI분석 오버레이
        function showMobileAnalysis() {
            document.querySelector('.container').classList.add('mobile-analysis-open');
            document.body.style.overflow = 'hidden';
        }

        function closeMobileAnalysis() {
            document.querySelector('.container').classList.remove('mobile-analysis-open');
            document.body.style.overflow = '';
        }

        // 모바일 저장 (피커 선택 행만 유지 후 저장)
        function pickerSave() {
            if (Object.keys(_pickerSelectedMap).length === 0) {
                showToast('상품을 한 개 이상 선택해주세요.', 'warning');
                return;
            }
            Array.from(document.querySelectorAll('#editor-items-container > div')).forEach(row => {
                const rowId = row.querySelector('.row-id')?.value;
                if (!rowId || !_pickerSelectedMap[rowId]) row.remove();
            });
            const custInput = document.getElementById('picker-customer-input');
            const mgrInput = document.getElementById('picker-manager-input');
            if (custInput) document.getElementById('edit-customerName').value = custInput.value;
            if (mgrInput) document.getElementById('edit-managerName').value = mgrInput.value;
            syncInfo();
            saveQuote();
        }

        function showMobilePreview() {
            const overlay = document.getElementById('mobile-preview-overlay');
            const scroll = document.getElementById('mpo-scroll');
            const papersContainer = document.getElementById('papers-container');
            if (!overlay || !scroll || !papersContainer) return;

            // papers-container 내용을 오버레이에 복제 (스케일 리셋)
            scroll.innerHTML = '';
            Array.from(papersContainer.children).forEach(paper => {
                const wrap = document.createElement('div');
                wrap.className = 'mpo-paper-wrap';
                wrap.appendChild(paper.cloneNode(true));
                scroll.appendChild(wrap);
            });

            // 모바일 너비에 맞게 zoom 스케일 계산 (레이아웃까지 반영)
            requestAnimationFrame(() => {
                const availW = window.innerWidth - 16;
                const PAPER_W = 794; // 210mm @ 96dpi
                const scale = Math.min(availW / PAPER_W, 1.0);
                scroll.querySelectorAll('.paper').forEach(paper => {
                    paper.style.zoom = scale;
                    paper.style.boxShadow = '0 4px 24px rgba(0,0,0,0.5)';
                    paper.style.borderRadius = '4px';
                });
                scroll.scrollTop = 0;
            });

            overlay.classList.add('visible');
            document.body.style.overflow = 'hidden';
        }

        function closeMobilePreview() {
            const overlay = document.getElementById('mobile-preview-overlay');
            if (overlay) overlay.classList.remove('visible');
            document.body.style.overflow = '';
        }
    </script>
    <script src="config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof setupLogoutButton === 'function') setupLogoutButton();

            // 로그인된 사용자 이름으로 담당자 자동 채우기
            if (typeof getUser === 'function') {
                const user = await getUser();
                if (user && user.user_metadata) {
                    const name = user.user_metadata.full_name || '';
                    if (name) {
                        document.getElementById('edit-managerName').value = name;
                        syncInfo();
                    }
                }
            }

        });
    </script>

    <!-- 리사이저 드래그 기능 -->
    <script>
        (function () {
            const resizer = document.getElementById('workspaceResizer');
            const previewSide = resizer.previousElementSibling;
            const editorSide = resizer.nextElementSibling;
            const workspace = resizer.parentElement;

            // 210mm = 약 794px (96dpi 기준)
            const PAPER_NATURAL_PX = 794;
            const PREVIEW_PADDING = 60; // 좌우 padding 30px * 2

            // 초기 스케일 적용 (레이아웃 완료 후)
            requestAnimationFrame(scalePapers);

            let startX, startWidth;

            resizer.addEventListener('mousedown', function (e) {
                startX = e.clientX;
                startWidth = previewSide.getBoundingClientRect().width;
                resizer.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';

                function onMouseMove(e) {
                    const dx = e.clientX - startX;
                    const workspaceWidth = workspace.getBoundingClientRect().width;
                    const newWidth = Math.min(
                        Math.max(startWidth + dx, 300),
                        workspaceWidth - 260 - 6
                    );
                    previewSide.style.width = newWidth + 'px';
                    scalePapers();
                }

                function onMouseUp() {
                    resizer.classList.remove('dragging');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            // 창 크기 변경 시에도 재조정
            window.addEventListener('resize', scalePapers);
        })();
    </script>

    <!-- PDF 레시피 뷰어 모달 -->
    <div id="recipePdfModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;">
        <div style="background:white;border-radius:16px;width:90vw;max-width:960px;height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.3);">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #e0e0e5;flex-shrink:0;">
                <span id="recipePdfTitle" style="font-weight:700;font-size:15px;color:#1d1d1f;"></span>
                <div style="display:flex;align-items:center;gap:10px;">
                    <button onclick="printCurrentRecipe()" style="padding:6px 14px;background:#ff9500;color:white;border:none;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;">🖨️ 가로 출력</button>
                    <button onclick="closeRecipePdf()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#666;line-height:1;">&times;</button>
                </div>
            </div>
            <iframe id="recipePdfFrame" src="" style="flex:1;border:none;width:100%;"></iframe>
        </div>
    </div>

    <script>
        function openRecipePdf(encodedUrl, name) {
            const url = decodeURIComponent(encodedUrl);
            document.getElementById('recipePdfTitle').textContent = '🍽️ ' + name;
            document.getElementById('recipePdfFrame').src = url;
            const modal = document.getElementById('recipePdfModal');
            modal.style.display = 'flex';
        }
        function closeRecipePdf() {
            document.getElementById('recipePdfModal').style.display = 'none';
            document.getElementById('recipePdfFrame').src = '';
        }
        function printCurrentRecipe() {
            const url = document.getElementById('recipePdfFrame').src;
            if (!url) return;
            window.open(url, '_blank');
        }
        document.getElementById('recipePdfModal').addEventListener('click', function(e) {
            if (e.target === this) closeRecipePdf();
        });

        // ── 토스트 ───────────────────────────────────────────
        let _toastTimer;
        function showToast(msg, type = 'success', duration = 3500) {
            const el = document.getElementById('proposal-toast');
            el.textContent = msg;
            el.style.background = type === 'error' ? '#ff3b30' : type === 'warning' ? '#ff9500' : '#1d1d1f';
            el.classList.add('show');
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => el.classList.remove('show'), duration);
        }
    </script>

    <div id="proposal-toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:white;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:99999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;"></div>
    <style>#proposal-toast.show{opacity:1;}</style>
