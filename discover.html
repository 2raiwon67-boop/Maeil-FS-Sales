<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FS MISO — 상권 인텔리전스</title>
    <link rel="icon" href="icons/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ═══════════════════════════════════════
           PALANTIR DARK DESIGN SYSTEM
        ═══════════════════════════════════════ */
        :root {
            --bg:         #06090f;
            --surface:    #0d1426;
            --surface-2:  #111c34;
            --surface-3:  #1a2545;
            --border:     rgba(0,212,255,.12);
            --border-dim: rgba(0,212,255,.05);
            --accent:     #00d4ff;
            --accent-dim: rgba(0,212,255,.15);
            --success:    #22c55e;
            --danger:     #ef4444;
            --warning:    #f59e0b;
            --purple:     #a78bfa;
            --text:       #e2e8f0;
            --text-dim:   #94a3b8;
            --text-muted: #475569;
            --mono:       'JetBrains Mono','Courier New',monospace;
        }

        * { box-sizing:border-box; margin:0; padding:0; }

        body {
            font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
            background:var(--bg);
            color:var(--text);
            height:100vh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }

        #nav-placeholder { flex-shrink:0; }

        .intel-wrap {
            flex:1;
            display:flex;
            flex-direction:column;
            overflow:hidden;
            min-height:0;
        }

        /* ─── HEADER ─── */
        .intel-header {
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:9px 18px;
            background:var(--surface);
            border-bottom:1px solid var(--border);
            flex-shrink:0;
            gap:12px;
            flex-wrap:wrap;
        }

        .header-left { display:flex; align-items:center; gap:10px; }

        .status-dot {
            width:7px; height:7px; border-radius:50%;
            background:var(--success);
            box-shadow:0 0 6px var(--success);
            animation:blink 2.5s ease-in-out infinite;
            flex-shrink:0;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

        .header-title {
            font-size:13px; font-weight:700;
            letter-spacing:.1em; text-transform:uppercase; color:var(--accent);
        }
        .header-sub {
            font-size:10px; color:var(--text-muted);
            font-family:var(--mono); letter-spacing:.04em;
        }

        /* 시도 칩 */
        .sido-chips { display:flex; gap:5px; align-items:center; }

        .sido-chip {
            padding:3px 12px; border-radius:2px; font-size:11px; font-weight:600;
            cursor:pointer; border:1px solid var(--border);
            background:transparent; color:var(--text-muted); font-family:inherit;
            transition:all .15s;
        }
        .sido-chip:hover { border-color:var(--accent); color:var(--accent); }
        .sido-chip.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }

        .header-right {
            font-size:10px; font-family:var(--mono); color:var(--text-muted);
            display:flex; align-items:center; gap:12px;
        }

        .btn-refresh {
            padding:4px 10px; font-size:10px; font-weight:700;
            font-family:var(--mono); letter-spacing:.08em; text-transform:uppercase;
            border-radius:2px; cursor:pointer;
            border:1px solid var(--border); background:transparent; color:var(--text-dim);
            transition:all .15s;
        }
        .btn-refresh:hover { border-color:var(--accent); color:var(--accent); }
        .btn-refresh:disabled { opacity:.4; cursor:not-allowed; }

        /* ─── KPI STRIP ─── */
        .kpi-strip {
            display:grid; grid-template-columns:repeat(4,1fr);
            background:var(--border); gap:1px;
            border-bottom:1px solid var(--border); flex-shrink:0;
        }

        .kpi-card {
            background:var(--surface); padding:11px 16px;
            position:relative; overflow:hidden;
        }
        .kpi-card::after {
            content:''; position:absolute;
            top:0; left:0; right:0; height:2px;
        }
        .kpi-card.c-blue::after   { background:var(--accent); }
        .kpi-card.c-green::after  { background:var(--success); }
        .kpi-card.c-red::after    { background:var(--danger); }
        .kpi-card.c-yellow::after { background:var(--warning); }

        .kpi-label {
            font-size:9px; font-family:var(--mono); color:var(--text-muted);
            text-transform:uppercase; letter-spacing:.12em; margin-bottom:4px;
        }
        .kpi-val { font-size:24px; font-weight:700; font-family:var(--mono); line-height:1; }
        .kpi-card.c-blue   .kpi-val { color:var(--accent); }
        .kpi-card.c-green  .kpi-val { color:var(--success); }
        .kpi-card.c-red    .kpi-val { color:var(--danger); }
        .kpi-card.c-yellow .kpi-val { color:var(--warning); }

        .kpi-sub { font-size:10px; color:var(--text-muted); font-family:var(--mono); margin-top:3px; }

        /* ─── BODY ─── */
        .intel-body {
            flex:1; display:flex; overflow:hidden; min-height:0;
        }

        /* ─── MAP (center) ─── */
        .map-area { flex:1; position:relative; background:#080d18; }
        #intel-map { width:100%; height:100%; }

        .map-legend {
            position:absolute; bottom:14px; left:14px;
            background:rgba(10,16,35,.92); backdrop-filter:blur(6px);
            border:1px solid var(--border); border-radius:3px;
            padding:7px 12px; z-index:500;
            display:flex; gap:14px;
            font-size:10px; font-family:var(--mono); color:var(--text-dim);
        }
        .leg-item { display:flex; align-items:center; gap:5px; }
        .leg-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

        /* ─── RIGHT PANEL ─── */
        .side-right {
            width:290px; flex-shrink:0;
            background:var(--surface); border-left:1px solid var(--border);
            display:flex; flex-direction:column; overflow:hidden;
        }

        .panel-title {
            padding:9px 13px; border-bottom:1px solid var(--border);
            font-size:9px; font-family:var(--mono); color:var(--text-muted);
            text-transform:uppercase; letter-spacing:.12em; flex-shrink:0;
        }

        .panel-body { flex:1; overflow-y:auto; }

        /* 시군구 랭킹 행 */
        .region-row {
            padding:8px 13px; border-bottom:1px solid var(--border-dim);
        }
        .region-row:hover { background:var(--surface-2); }

        .region-name-row {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:5px;
        }
        .region-name { font-size:12px; font-weight:600; color:var(--text); }
        .region-net {
            font-size:11px; font-weight:700; font-family:var(--mono);
        }
        .net-pos { color:var(--success); }
        .net-neg { color:var(--danger); }
        .net-zero { color:var(--text-muted); }

        .region-bar-bg {
            height:3px; background:var(--surface-3); border-radius:2px;
            margin-bottom:5px; overflow:hidden;
        }
        .region-bar-fill { height:100%; border-radius:2px; }

        .region-nums {
            display:flex; gap:12px; font-size:10px; font-family:var(--mono);
        }
        .rnum { display:flex; flex-direction:column; gap:1px; }
        .rnum-label { color:var(--text-muted); font-size:9px; }
        .rnum-val   { font-weight:600; }

        /* ─── BOTTOM ─── */
        .intel-bottom {
            flex-shrink:0; height:230px;
            border-top:1px solid var(--border);
            display:flex; background:var(--surface); overflow:hidden;
        }

        .chart-panel {
            flex:1; min-width:0; display:flex; flex-direction:column;
            padding:10px 16px 8px;
        }
        .chart-panel-title {
            font-size:9px; font-family:var(--mono); color:var(--text-muted);
            text-transform:uppercase; letter-spacing:.12em;
            margin-bottom:8px; flex-shrink:0;
        }
        .chart-wrap { flex:1; position:relative; min-height:0; }

        /* ─── LOADING OVERLAY ─── */
        .loading-overlay {
            position:absolute; inset:0;
            background:rgba(6,9,15,.85);
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            z-index:600; gap:12px;
        }
        .loading-overlay.hidden { display:none; }

        .loader-ring {
            width:36px; height:36px; border-radius:50%;
            border:2px solid var(--surface-3);
            border-top-color:var(--accent);
            animation:spin .8s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }

        .loader-text {
            font-size:11px; font-family:var(--mono); color:var(--text-muted);
        }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--surface-3); border-radius:2px; }

        /* ─── LEAFLET DARK POPUP ─── */
        .dark-popup .leaflet-popup-content-wrapper {
            background:#0d1426;
            border:1px solid rgba(0,212,255,.2);
            border-radius:4px;
            box-shadow:0 6px 24px rgba(0,0,0,.6);
            color:#e2e8f0;
        }
        .dark-popup .leaflet-popup-tip { background:#0d1426; }
        .dark-popup .leaflet-popup-content { margin:10px 13px; font-size:12px; line-height:1.7; min-width:140px; }
        .dark-popup .leaflet-popup-content strong { font-size:13px; display:block; margin-bottom:2px; }

        /* ─── MOBILE ─── */
        @media (max-width:900px) {
            .side-right { display:none; }
            .intel-bottom { height:180px; }
        }
        @media (max-width:600px) {
            .kpi-strip { grid-template-columns:repeat(2,1fr); }
        }
    </style>
</head>

            <div class="panel-title">시군구별 현황 (신규순)</div>
            <div class="panel-body" id="regionPanel">

            </div>
        </div>

    </div><!-- /intel-body -->

    <!-- BOTTOM: 월별 트렌드 -->
    <div class="intel-bottom">
        <div class="chart-panel">

            <div class="chart-wrap">
                <canvas id="trendChart"></canvas>
            </div>

</div><!-- /intel-wrap -->

/* ═══════════════════════════════════════════════════
   MAP INIT
═══════════════════════════════════════════════════ */
function initMap() {
    map = L.map('intel-map', { center:[37.5, 127.1], zoom:9, zoomControl:false });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {

    }).addTo(map);

    markersLayer = L.layerGroup().addTo(map);

/* ═══════════════════════════════════════════════════
   AUTH & 시도 목록 결정
═══════════════════════════════════════════════════ */
async function initDashboard() {
    try {
        const { data:{ session } } = await client.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }

        const bu = session.user.user_metadata?.business_unit || '';

        // managers 테이블에서 이 지점의 시도 목록 조회
        const { data: mgrs } = await client
            .from('managers')
            .select('region1')
            .eq('business_unit', bu)
            .neq('region2', '지점장');

        const normalized = (mgrs || [])
            .map(m => normalizeSido(m.region1))
            .filter(Boolean);

        sidoList = [...new Set(normalized)];

        // 시도가 없으면 수도권 전체 기본
        if (!sidoList.length) sidoList = ['경기도', '서울', '인천'];

        renderSidoChips();
        await loadSido(sidoList[0]);

    } catch(e) {
        console.error('[discover] init error', e);
        showToast?.('초기화 실패: ' + e.message, 'error');
    }
}

function normalizeSido(raw) {
    const SIDO_MAP = {
        '서울특별시':'서울', '서울시':'서울', '서울':'서울',
        '인천광역시':'인천', '인천시':'인천', '인천':'인천',
        '경기도':'경기도', '경기':'경기도',
        '부산광역시':'부산', '부산시':'부산',
        '대구광역시':'대구', '대전광역시':'대전',
        '광주광역시':'광주', '울산광역시':'울산',
    };
    return SIDO_MAP[raw?.trim()] || raw?.trim() || '';
}

/* ═══════════════════════════════════════════════════
   시도 칩 렌더링
═══════════════════════════════════════════════════ */
function renderSidoChips() {
    const container = document.getElementById('sidoChips');
    container.innerHTML = sidoList.map(sido =>
        `<button class="sido-chip" data-sido="${sido}" onclick="loadSido('${sido}')">${sido}</button>`
    ).join('');
}

function setActiveChip(sido) {
    document.querySelectorAll('.sido-chip').forEach(el => {
        el.classList.toggle('active', el.dataset.sido === sido);
    });
}

/* ═══════════════════════════════════════════════════
   데이터 로드 (캐시 우선)
═══════════════════════════════════════════════════ */
async function loadSido(sido, force = false) {
    activeSido = sido;
    setActiveChip(sido);

    // 캐시 확인
    const cacheKey = `discover_${sido}`;
    if (!force) {
        const cached = getCached(cacheKey);
        if (cached) {
            renderAll(cached);
            return;
        }
    }

    showLoading(true, `${sido} 공공인허가 조회 중...`);
    document.getElementById('btnRefresh').disabled = true;

    try {
        const params = new URLSearchParams({ sido, months: 12 });
        const res = await fetch(`${API_BASE}/api/market-stats?${params}`);
        const data = await res.json();

        if (!data.success) throw new Error(data.error || '조회 실패');

        setCache(cacheKey, data);
        renderAll(data);

        const now = new Date();
        document.getElementById('lastSync').textContent =
            now.toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });

    } catch(e) {
        console.error('[discover] loadSido error', e);
        showToast?.('데이터 조회 실패: ' + e.message, 'error');
    } finally {
        showLoading(false);
        document.getElementById('btnRefresh').disabled = false;
    }
}

function refresh() { loadSido(activeSido, true); }

/* ═══════════════════════════════════════════════════
   RENDER ALL
═══════════════════════════════════════════════════ */
function renderAll(data) {
    renderKPIs(data.summary);
    renderMap(data.regions);
    renderRegionPanel(data.regions);
    renderTrendChart(data.monthly);
}

/* KPI */
function renderKPIs({ totalNew, totalClosed, net }) {
    setText('kpiNew',    totalNew.toLocaleString());
    setText('kpiClosed', totalClosed.toLocaleString());

    const sign = net > 0 ? '+' : '';
    setText('kpiNet', sign + net.toLocaleString());

    const rate = totalNew > 0 ? Math.round((net / totalNew) * 100) : 0;
    setText('kpiRate', (rate > 0 ? '+' : '') + rate + '%');
    setText('kpiNetSub', net >= 0 ? '시장 성장 중' : '시장 축소 중');
}

/* MAP 버블 */
function renderMap(regions) {
    markersLayer.clearLayers();

    if (!regions?.length) return;

    const maxNew = Math.max(...regions.map(r => r.new), 1);

    // 지도 중심 이동
    const cfg = SIDO_CENTER[activeSido];
    if (cfg) map.setView(cfg.center, cfg.zoom, { animate:true });

    regions.forEach(r => {
        const coords = CENTROIDS[r.region];
        if (!coords) return;

        const radius = 6 + Math.round((r.new / maxNew) * 24);  // 6~30px
        const color  = r.net > 2  ? '#22c55e'
                     : r.net < -2 ? '#ef4444'
                     :              '#475569';

        const circle = L.circleMarker(coords, {
            radius, fillColor:color, fillOpacity:.7,
            color:color, weight:1, opacity:.5,
        });

        const netStr = r.net > 0 ? `+${r.net}` : String(r.net);
        circle.bindPopup(`
            <strong>${esc(r.region)}</strong>
            <span style="color:#94a3b8">신규 ${r.new}건 &nbsp; 폐업 ${r.closed}건</span>
            <span style="color:${r.net >= 0 ? '#22c55e' : '#ef4444'}">순증 ${netStr}건</span>
        `.split('\n').map(l=>l.trim()).join('<br>'),
        { className:'dark-popup', maxWidth:180 });

        markersLayer.addLayer(circle);
    });
}

/* 시군구 랭킹 패널 */
function renderRegionPanel(regions) {
    if (!regions?.length) {
        document.getElementById('regionPanel').innerHTML =
            '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12px;">데이터 없음</div>';
        return;
    }

    const maxNew = Math.max(...regions.map(r => r.new), 1);

    const html = regions.slice(0, 30).map(r => {
        const pct    = Math.round((r.new / maxNew) * 100);
        const barC   = r.net > 0 ? 'var(--success)' : r.net < 0 ? 'var(--danger)' : 'var(--text-muted)';
        const netStr = r.net > 0 ? `+${r.net}` : String(r.net);
        const netCls = r.net > 0 ? 'net-pos' : r.net < 0 ? 'net-neg' : 'net-zero';

        return `<div class="region-row">
            <div class="region-name-row">
                <span class="region-name">${esc(r.region)}</span>
                <span class="region-net ${netCls}">${netStr}</span>
            </div>
            <div class="region-bar-bg">
                <div class="region-bar-fill" style="width:${pct}%;background:${barC}"></div>
            </div>
            <div class="region-nums">
                <div class="rnum">
                    <span class="rnum-label" style="color:var(--success)">신규</span>
                    <span class="rnum-val" style="color:var(--success)">${r.new}</span>
                </div>
                <div class="rnum">
                    <span class="rnum-label" style="color:var(--danger)">폐업</span>
                    <span class="rnum-val" style="color:var(--danger)">${r.closed}</span>
                </div>
                <div class="rnum">
                    <span class="rnum-label">성장률</span>
                    <span class="rnum-val" style="color:var(--text-dim)">${r.netRate}%</span>
                </div>
            </div>
        </div>`;
    }).join('');

    document.getElementById('regionPanel').innerHTML = html;
}

/* 월별 트렌드 차트 */
function renderTrendChart(monthly) {
    if (!monthly?.length) return;

    const labels   = monthly.map(m => m.month.slice(2));   // 'YY-MM'
    const newData   = monthly.map(m => m.new);
    const closedData = monthly.map(m => m.closed);

    if (trendChart) trendChart.destroy();

    const ctx = document.getElementById('trendChart').getContext('2d');
    trendChart = new Chart(ctx, {
        data: {
            labels,
            datasets: [
                {
                    type: 'bar',
                    label: '신규 오픈',
                    data: newData,
                    backgroundColor: 'rgba(34,197,94,.35)',
                    borderColor:     'rgba(34,197,94,.8)',
                    borderWidth: 1, borderRadius: 2,
                    yAxisID: 'y',
                },
                {
                    type: 'bar',
                    label: '폐업',
                    data: closedData,
                    backgroundColor: 'rgba(239,68,68,.3)',
                    borderColor:     'rgba(239,68,68,.7)',
                    borderWidth: 1, borderRadius: 2,
                    yAxisID: 'y',
                },
                {
                    type: 'line',
                    label: '순증',
                    data: monthly.map(m => m.net),
                    borderColor:   'rgba(0,212,255,.9)',
                    backgroundColor:'rgba(0,212,255,.08)',
                    borderWidth: 2, pointRadius: 3,
                    pointBackgroundColor:'rgba(0,212,255,.9)',
                    fill: true, tension: 0.3,
                    yAxisID: 'y',
                },
            ]
        },
        options: {
            responsive:true, maintainAspectRatio:false,
            plugins: {
                legend: {
                    labels: {
                        color:'#94a3b8', font:{size:10,family:'monospace'},
                        boxWidth:10, padding:12,
                    }
                },
                tooltip: {
                    backgroundColor:'#0d1426',
                    borderColor:'rgba(0,212,255,.25)', borderWidth:1,
                    titleColor:'#e2e8f0', bodyColor:'#94a3b8', padding:8,
                }
            },
            scales: {
                x: {
                    ticks:{ color:'#475569', font:{size:9,family:'monospace'} },
                    grid:{ color:'rgba(255,255,255,.04)' },
                },
                y: {
                    ticks:{ color:'#475569', font:{size:9,family:'monospace'}, stepSize:5 },
                    grid:{ color:'rgba(255,255,255,.04)' },
                    beginAtZero:true,
                }
            }
        }
    });
}

/* ═══════════════════════════════════════════════════
   CACHE (localStorage)
═══════════════════════════════════════════════════ */
function getCached(key) {
    try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const { data, ts } = JSON.parse(raw);
        if (Date.now() - ts > CACHE_TTL) { localStorage.removeItem(key); return null; }
        return data;
    } catch { return null; }
}

function setCache(key, data) {
    try { localStorage.setItem(key, JSON.stringify({ data, ts:Date.now() })); } catch {}
}

/* ─── UTILS ─── */
function showLoading(on, msg = '') {
    const el = document.getElementById('loadingOverlay');
    el.classList.toggle('hidden', !on);
    if (on && msg) setText('loadingText', msg);
}

function setText(id, txt) {
    const el = document.getElementById(id);
    if (el) el.textContent = txt;
}

function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
