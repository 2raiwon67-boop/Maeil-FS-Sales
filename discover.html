<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상권 분석 — FS MISO</title>
    <link rel="icon" href="icons/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="stylesheet" href="common.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --color-primary:        #0071e3;
            --color-primary-hover:  #0077ed;
            --color-success:        #34c759;
            --color-danger:         #ff3b30;
            --color-warning:        #ff9500;
            --color-text:           #1d1d1f;
            --color-text-secondary: #6e6e73;
            --color-text-tertiary:  #a1a1a6;
            --color-bg:             #f5f5f7;
            --color-surface:        #ffffff;
            --color-border:         #e0e0e5;
            --radius-sm:  8px;
            --radius-md:  12px;
            --radius-lg:  16px;
            --shadow-sm:  0 1px 4px rgba(0,0,0,0.08);
            --shadow-md:  0 4px 16px rgba(0,0,0,0.12);
        }

        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 14px;
            color: var(--color-text);
            background: var(--color-bg);
            display: flex;
            flex-direction: column;
        }

        #nav-placeholder { flex-shrink: 0; }

        .page {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        /* ── HEADER ── */
        .ph {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            height: 52px;
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }
        .ph-title {
            font-size: 15px; font-weight: 700;
            color: var(--color-text); letter-spacing: -.01em;
            white-space: nowrap;
        }
        .ph-vline { width: 1px; height: 18px; background: var(--color-border); flex-shrink: 0; }
        .ph-sub {
            font-size: 12px; color: var(--color-text-tertiary);
            flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
        }
        .ph-sync { font-size: 12px; color: var(--color-text-tertiary); white-space: nowrap; }
        .btn-refresh {
            height: 32px; padding: 0 14px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-surface);
            color: var(--color-text-secondary);
            cursor: pointer;
            display: flex; align-items: center; gap: 5px;
            font-size: 13px; font-weight: 500;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn-refresh:hover { border-color: var(--color-primary); color: var(--color-primary); background: rgba(0,113,227,0.08); }
        .btn-refresh:disabled { opacity: .4; cursor: not-allowed; }

        /* ── KPI STRIP ── */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 12px;
            flex-shrink: 0;
            background: var(--color-bg);
        }
        .kpi-cell {
            padding: 16px;
            position: relative;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            background: var(--color-surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border-top: 3px solid;
        }
        .kpi-cell:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .kc-g { border-top-color: var(--color-success); }
        .kc-r { border-top-color: var(--color-danger); }
        .kc-b { border-top-color: var(--color-primary); }
        .kc-a { border-top-color: var(--color-warning); }
        .kpi-lbl {
            font-size: 11px; font-weight: 600; color: var(--color-text-secondary);
            margin-bottom: 6px;
        }
        .kpi-val {
            font-size: 28px; font-weight: 800; line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.02em;
        }
        .kc-g .kpi-val { color: var(--color-success); }
        .kc-r .kpi-val { color: var(--color-danger); }
        .kc-b .kpi-val { color: var(--color-primary); }
        .kc-a .kpi-val { color: var(--color-warning); }
        .kpi-sub { font-size: 11px; color: var(--color-text-tertiary); margin-top: 4px; }

        /* ── TOOLBAR ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
            overflow-x: auto;
            margin: 0 12px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
        }
        .tb-lbl {
            font-size: 12px; font-weight: 600; color: var(--color-text-secondary);
            white-space: nowrap; flex-shrink: 0;
        }
        .tb-sep { width: 1px; height: 20px; background: var(--color-border); flex-shrink: 0; }
        .chips { display: flex; gap: 8px; }
        .chip {
            height: 32px; padding: 0 16px;
            font-size: 13px; font-weight: 500;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            color: var(--color-text-secondary);
            cursor: pointer; white-space: nowrap;
            transition: all 0.15s ease;
        }
        .chip:hover { border-color: var(--color-primary); color: var(--color-primary); background: rgba(0,113,227,0.08); }
        .chip.active {
            background: var(--color-primary); border-color: var(--color-primary);
            color: #fff; font-weight: 600;
        }

        .mnav { display: flex; align-items: center; gap: 4px; }
        .marr {
            width: 32px; height: 32px;
            border: 1px solid var(--color-border); border-radius: var(--radius-sm);
            background: var(--color-surface); color: var(--color-text-secondary);
            cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s ease; font-weight: 600;
        }
        .marr:hover { border-color: var(--color-primary); color: var(--color-primary); background: rgba(0,113,227,0.08); }
        #monthLabel {
            font-size: 13px; font-weight: 700; color: var(--color-text);
            min-width: 72px; text-align: center;
        }
        .btn-mclear {
            height: 28px; padding: 0 12px;
            font-size: 12px; font-weight: 500;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            background: var(--color-surface); color: var(--color-text-secondary);
            cursor: pointer; display: none;
            transition: all 0.15s ease;
        }
        .btn-mclear:hover { border-color: var(--color-danger); color: var(--color-danger); background: rgba(255,59,48,0.08); }

        /* ── COMPARISON STRIP ── */
        .cmp-strip {
            display: none; flex-shrink: 0;
            border-bottom: 2px solid rgba(0,113,227,0.2);
            background: rgba(0,113,227,0.06);
            padding: 0 12px;
        }
        .cmp-strip.on { display: flex; }
        .cmp-col {
            flex: 1; padding: 12px 16px;
            border-right: 1px solid rgba(0,113,227,0.1);
        }
        .cmp-col:last-child { border-right: none; }
        .cmp-ctitle {
            font-size: 11px; font-weight: 700; color: var(--color-text-secondary);
            margin-bottom: 8px;
        }
        .cmp-col.col-cur .cmp-ctitle { color: var(--color-primary); }
        .cmp-ms { display: flex; gap: 22px; }
        .cmp-m { display: flex; flex-direction: column; gap: 2px; }
        .cmp-ml { font-size: 11px; color: var(--color-text-tertiary); }
        .cmp-mv { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .cv-g { color: var(--color-success); }
        .cv-r { color: var(--color-danger); }
        .cv-b { color: var(--color-primary); }
        .cmp-delta { margin-top: 5px; font-size: 12px; color: var(--color-text-secondary); }
        .du { color: var(--color-success); font-weight: 600; }
        .dd { color: var(--color-danger); font-weight: 600; }

        /* ── BODY ── */
        .page-body {
            flex: 1; display: flex; overflow: hidden; min-height: 0;
        }

        /* ── MAP ── */
        .map-wrap { flex: 1; position: relative; min-width: 0; }
        #intel-map { width: 100%; height: 100%; }

        .map-legend {
            position: absolute; bottom: 14px; left: 14px; z-index: 500;
            background: rgba(255,255,255,.96);
            backdrop-filter: blur(8px);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 8px 14px;
            display: flex; gap: 14px;
            font-size: 12px; color: var(--color-text-secondary);
            box-shadow: var(--shadow-md);
        }
        .leg-i { display: flex; align-items: center; gap: 6px; }
        .leg-d { width: 10px; height: 10px; border-radius: 50%; }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 272px; flex-shrink: 0;
            border-left: 1px solid var(--color-border);
            display: flex; flex-direction: column;
            background: var(--color-surface); overflow: hidden;
        }
        .sb-hd {
            padding: 12px 16px;
            border-bottom: 1px solid var(--color-border);
            font-size: 12px; font-weight: 700; color: var(--color-text-secondary);
            flex-shrink: 0; background: var(--color-bg);
            letter-spacing: -.01em;
        }
        .sb-body { flex: 1; overflow-y: auto; }

        .rrow {
            padding: 12px 16px;
            border-bottom: 1px solid var(--color-border);
            transition: background 0.12s ease;
            cursor: default;
        }
        .rrow:hover { background: var(--color-bg); }
        .rrow-top {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 6px;
        }
        .rrow-name {
            font-size: 13px; font-weight: 700; color: var(--color-text);
            display: flex; align-items: center; gap: 6px;
        }
        .rrow-rank {
            font-size: 10px; font-weight: 600;
            color: var(--color-text-tertiary); min-width: 16px;
        }
        .rrow-net { font-size: 13px; font-weight: 700; }
        .rn-pos { color: var(--color-success); }
        .rn-neg { color: var(--color-danger); }
        .rn-0   { color: var(--color-text-tertiary); }
        .rbar {
            height: 4px; background: var(--color-border);
            border-radius: 2px; margin-bottom: 7px; overflow: hidden;
        }
        .rbar-fill { height: 100%; border-radius: 2px; transition: width 0.3s ease; }
        .rnums { display: flex; gap: 14px; }
        .rnum { display: flex; flex-direction: column; gap: 1px; }
        .rnum-l { font-size: 10px; color: var(--color-text-tertiary); font-weight: 500; }
        .rnum-v { font-size: 13px; font-weight: 700; }

        /* ── CHART ── */
        .chart-bar {
            flex-shrink: 0; height: 160px;
            border-top: 1px solid var(--color-border);
            background: var(--color-surface);
            display: flex; flex-direction: column;
            padding: 10px 22px 8px;
            transition: height 0.2s ease;
        }
        .chart-bar.collapsed { height: 38px; overflow: hidden; }
        .chart-title {
            font-size: 12px; font-weight: 600; color: var(--color-text-secondary);
            margin-bottom: 8px; flex-shrink: 0;
        }
        .chart-wrap { flex: 1; position: relative; min-height: 0; }

        /* ── STATE ── */
        .state-msg {
            height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 10px; color: var(--color-text-tertiary); font-size: 13px;
            text-align: center; padding: 24px; line-height: 1.6;
        }
        .state-ico { font-size: 32px; }


        /* ── SCROLL ── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

        /* ── DRILL-DOWN ── */
        .drill-hd {
            display: flex; align-items: center; gap: 10px;
        }
        .drill-back {
            height: 26px; padding: 0 10px;
            font-size: 12px; font-weight: 600;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            background: var(--color-surface); color: var(--color-primary);
            cursor: pointer; flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .drill-back:hover { background: rgba(0,113,227,0.08); }
        #drillTitle { font-size: 13px; font-weight: 700; color: var(--color-text); }

        .drill-summary {
            padding: 10px 16px;
            background: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
            display: flex; gap: 16px;
            flex-shrink: 0;
        }
        .ds-stat { display: flex; flex-direction: column; gap: 2px; }
        .ds-lbl { font-size: 10px; font-weight: 600; color: var(--color-text-tertiary); }
        .ds-val { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }

        .drill-tabs {
            display: flex; gap: 4px; padding: 8px 12px;
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0; background: var(--color-surface);
        }
        .dtab {
            height: 28px; padding: 0 12px;
            font-size: 12px; font-weight: 500;
            border-radius: 20px;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            color: var(--color-text-secondary);
            cursor: pointer; transition: all 0.15s ease;
        }
        .dtab:hover { border-color: var(--color-primary); color: var(--color-primary); }
        .dtab.active {
            background: var(--color-primary); border-color: var(--color-primary);
            color: #fff; font-weight: 600;
        }

        .drill-row {
            padding: 10px 16px;
            border-bottom: 1px solid var(--color-border);
            transition: background 0.12s ease;
        }
        .drill-row:hover { background: var(--color-bg); }
        .drill-row-top {
            display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
        }
        .drill-name {
            font-size: 13px; font-weight: 700; color: var(--color-text);
            flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .big-badge {
            font-size: 10px; font-weight: 700; color: var(--color-warning);
            background: rgba(255,149,0,0.12); border-radius: 4px;
            padding: 1px 5px; flex-shrink: 0;
        }
        .drill-status {
            font-size: 11px; font-weight: 600;
            padding: 2px 7px; border-radius: 10px; flex-shrink: 0;
        }
        .ds-new    { background: rgba(52,199,89,0.12);  color: var(--color-success); }
        .ds-closed { background: rgba(255,59,48,0.12);  color: var(--color-danger); }
        .drill-meta {
            display: flex; gap: 8px; flex-wrap: wrap;
            font-size: 11px; color: var(--color-text-tertiary);
        }
        .drill-addr {
            font-size: 11px; color: var(--color-text-tertiary);
            margin-top: 3px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }

        /* ── 유동인구 PLACEHOLDER ── */
        .drill-fp-section {
            flex-shrink: 0;
            border-top: 1px solid var(--color-border);
            padding: 12px 16px;
            background: var(--color-bg);
        }
        .drill-fp-title {
            font-size: 11px; font-weight: 700; color: var(--color-text-secondary);
            margin-bottom: 6px;
        }
        .drill-fp-placeholder {
            font-size: 11px; color: var(--color-text-tertiary);
            background: var(--color-surface);
            border: 1px dashed var(--color-border);
            border-radius: var(--radius-sm);
            padding: 10px; text-align: center;
        }

        /* ── MAP TOOLTIP ── */
        .map-tooltip {
            background: rgba(29,29,31,.92);
            color: #fff; border: none;
            border-radius: 8px; padding: 6px 10px;
            font-size: 12px; font-weight: 500;
            box-shadow: 0 4px 12px rgba(0,0,0,.2);
            white-space: nowrap; pointer-events: none;
        }

        /* ── CHART TOGGLE ── */
        .chart-toggle-btn {
            height: 22px; padding: 0 10px;
            font-size: 11px; font-weight: 500;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-surface); color: var(--color-text-tertiary);
            cursor: pointer; margin-left: auto;
            transition: all 0.15s ease;
        }
        .chart-toggle-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }

        /* ── RESPONSIVE ── */
        @media (max-width: 960px) {
            .sidebar { display: none; }
            .chart-bar { height: 140px; }
        }
        @media (max-width: 640px) {
            .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; }
            .kpi-val { font-size: 22px; }
            .ph { padding: 0 16px; }
            .toolbar { margin: 0 8px; padding: 10px; gap: 12px; }
        }
    </style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page">

    <!-- HEADER -->
    <header class="ph">
        <span class="ph-title">📊 상권 분석</span>
        <div class="ph-vline"></div>
        <span class="ph-sub" id="headerSub">카페 · 베이커리 · 음식점 신규·폐업 트렌드</span>
        <span class="ph-sync" id="lastSync">로딩 중...</span>
        <button class="btn-refresh" id="btnRefresh" onclick="loadDashboard()" title="새로고침">↺ 새로고침</button>
    </header>

    <!-- KPI -->
    <div class="kpi-row">
        <div class="kpi-cell kc-g">
            <div class="kpi-lbl">신규 오픈</div>
            <div class="kpi-val" id="kpiNew">—</div>
            <div class="kpi-sub" id="kpiNewSub">인허가 기준 누적</div>
        </div>
        <div class="kpi-cell kc-r">
            <div class="kpi-lbl">폐업</div>
            <div class="kpi-val" id="kpiClosed">—</div>
            <div class="kpi-sub">폐업일 기준 누적</div>
        </div>
        <div class="kpi-cell kc-b">
            <div class="kpi-lbl">순증가</div>
            <div class="kpi-val" id="kpiNet">—</div>
            <div class="kpi-sub" id="kpiNetSub">신규 − 폐업</div>
        </div>
        <div class="kpi-cell kc-a">
            <div class="kpi-lbl">성장률</div>
            <div class="kpi-val" id="kpiRate">—</div>
            <div class="kpi-sub">순증 / 신규</div>
        </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <span class="tb-lbl">지역</span>
        <div class="chips" id="regionChips">
            <button class="chip active" id="chip-branch" onclick="setRegionMode('branch')">내 지점</button>
        </div>
        <div class="tb-sep"></div>
        <span class="tb-lbl">월</span>
        <div class="mnav">
            <button class="marr" onclick="shiftMonth(-1)">‹</button>
            <span id="monthLabel">전체</span>
            <button class="marr" onclick="shiftMonth(1)">›</button>
        </div>
        <button class="btn-mclear" id="btnMonthClear" onclick="clearMonth()">전체 보기</button>
    </div>

    <!-- COMPARISON STRIP -->
    <div class="cmp-strip" id="cmpStrip">
        <div class="cmp-col">
            <div class="cmp-ctitle" id="cmpTitleYoy">전년동월</div>
            <div id="cmpYoy"></div>
        </div>
        <div class="cmp-col">
            <div class="cmp-ctitle" id="cmpTitlePrev">전월</div>
            <div id="cmpPrev"></div>
        </div>
        <div class="cmp-col col-cur">
            <div class="cmp-ctitle" id="cmpTitleCur">당월</div>
            <div id="cmpCur"></div>
        </div>
    </div>

    <!-- BODY -->
    <div class="page-body">
        <div class="map-wrap">
            <div id="intel-map"></div>
            <div class="map-legend">
                <div class="leg-i"><div class="leg-d" style="background:var(--green)"></div>순증</div>
                <div class="leg-i"><div class="leg-d" style="background:var(--red)"></div>순감</div>
                <div class="leg-i"><div class="leg-d" style="background:var(--text4)"></div>보합</div>
            </div>
        </div>
        <div class="sidebar">
            <!-- 기본 목록 뷰 -->
            <div id="sbListView" style="display:flex;flex-direction:column;height:100%">
                <div class="sb-hd">시군구 현황 · 신규순</div>
                <div class="sb-body" id="regionPanel">
                    <div class="state-msg"><div class="state-ico">⏳</div>데이터 불러오는 중...</div>
                </div>
            </div>
            <!-- 드릴다운 뷰 (기본 숨김) -->
            <div id="sbDrillView" style="display:none;flex-direction:column;height:100%">
                <div class="sb-hd drill-hd">
                    <button class="drill-back" onclick="closeDrilldown()">← 목록</button>
                    <span id="drillTitle"></span>
                </div>
                <div class="drill-summary" id="drillSummary"></div>
                <div class="drill-tabs">
                    <button class="dtab active" onclick="switchDrillTab(this,'all')">전체</button>
                    <button class="dtab" onclick="switchDrillTab(this,'new')">신규</button>
                    <button class="dtab" onclick="switchDrillTab(this,'closed')">폐업</button>
                    <button class="dtab" onclick="switchDrillTab(this,'big')">100평+</button>
                </div>
                <div class="sb-body" id="drillList">
                    <div class="state-msg"><div class="state-ico">⏳</div>불러오는 중...</div>
                </div>

/* ─── 월 헬퍼 ─── */
function addMonths(ym, delta) {
    let [y, m] = ym.split('-').map(Number);
    m += delta;
    while (m > 12) { m -= 12; y++; }
    while (m < 1)  { m += 12; y--; }
    return `${y}-${String(m).padStart(2,'0')}`;
}
function currentYM() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

/* ─── 지역 모드 전환 ─── */
async function setRegionMode(mode, sido) {
    viewMode = mode;
    viewSido = sido || null;
    document.querySelectorAll('#regionChips .chip').forEach(c => c.classList.remove('active'));
    const chipId = mode === 'branch' ? 'chip-branch' : `chip-sido-${sido}`;
    document.getElementById(chipId)?.classList.add('active');
    await loadDashboard();
}

/* ─── 월 네비게이션 ─── */
function shiftMonth(delta) {
    const cur  = currentYM();
    const base = selectedMonth || cur;
    const next = addMonths(base, delta);
    if (next < '2025-01' || next > cur) return;
    selectedMonth = next;
    updateMonthUI();
    applyFilters();
}
function clearMonth() {
    selectedMonth = null;
    updateMonthUI();
    applyFilters();
}
function updateMonthUI() {
    const lbl = document.getElementById('monthLabel');
    const btn = document.getElementById('btnMonthClear');
    const strip = document.getElementById('cmpStrip');
    if (lbl) lbl.textContent = selectedMonth || '전체';
    if (btn) btn.style.display = selectedMonth ? '' : 'none';
    if (strip) strip.classList.toggle('on', !!selectedMonth);
    const newSub = document.getElementById('kpiNewSub');
    if (newSub) newSub.textContent = selectedMonth ? `${selectedMonth} 기준` : '인허가 기준 누적';
    setTimeout(() => map?.relayout(), 60);
}

/* ═══════════════════════════════════════════════
   AUTH → managers → 초기화
═══════════════════════════════════════════════ */
async function initDashboard() {
    try {
        const { data:{ session } } = await client.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }

        const bu = session.user.user_metadata?.business_unit || '';

        const { data: mgrs, error } = await client
            .from('managers')
            .select('region1, region2')
            .eq('business_unit', bu)
            .neq('region2', '지점장');
        if (error) throw error;

        const rows = mgrs || [];
        sidoSigunguMap = {};
        sigunguSidoMap = {};

        rows.forEach(m => {
            const sido = normSido(m.region1);
            const sgu  = m.region2?.trim();
            if (!sido || !sgu) return;
            if (!sidoSigunguMap[sido]) sidoSigunguMap[sido] = [];
            if (!sidoSigunguMap[sido].includes(sgu)) sidoSigunguMap[sido].push(sgu);
            sigunguSidoMap[sgu] = sido;
        });

        const allSiguList = Object.values(sidoSigunguMap).flat();
        if (!allSiguList.length) {
            document.getElementById('regionPanel').innerHTML =
                '<div class="state-msg"><div class="state-ico">⚠️</div><span>담당 지역이 설정되지 않았습니다.<br>관리자에게 문의하세요.</span></div>';
            return;
        }

        const sidoLabels  = Object.keys(sidoSigunguMap).join(' · ');
        const regionLabel = allSiguList.length <= 3
            ? allSiguList.join(' · ')
            : `${allSiguList.slice(0,3).join(' · ')} 외 ${allSiguList.length - 3}개`;
        const el = document.getElementById('headerSub');
        if (el) el.textContent = `${sidoLabels} · ${regionLabel} · 2025.01 ~ 현재`;

        // 사용자명 + 로그아웃 버튼 표시
        setupLogoutButton?.();

        buildSidoChips();
        await loadDashboard();

    } catch(e) {
        console.error('[discover] init error', e);
        document.getElementById('lastSync').textContent = '초기화 실패';
        document.getElementById('regionPanel').innerHTML =
            `<div class="state-msg"><div class="state-ico">⚠️</div><span>${esc(e.message)}</span></div>`;
    }
}

/* ─── sido 칩 동적 생성 ─── */
async function buildSidoChips() {
    try {
        const { data } = await client
            .from('market_snapshots')
            .select('sido')
            .gte('month', '2025-01');
        const sidos = [...new Set((data || []).map(r => r.sido))].sort();
        const chips = document.getElementById('regionChips');
        sidos.forEach(sido => {
            if (document.getElementById(`chip-sido-${sido}`)) return;
            const btn = document.createElement('button');
            btn.className   = 'chip';
            btn.id          = `chip-sido-${sido}`;
            btn.textContent = sido;
            btn.onclick     = () => setRegionMode('sido', sido);
            chips.appendChild(btn);
        });
    } catch(_) {}
}

/* ═══════════════════════════════════════════════
   DATA LOAD
═══════════════════════════════════════════════ */
async function loadDashboard() {
    const btnRef = document.getElementById('btnRefresh');
    const syncEl = document.getElementById('lastSync');
    if (btnRef) btnRef.disabled = true;
    if (syncEl) syncEl.textContent = '로딩 중...';
    cachedSnaps = [];

    try {
        if (viewMode === 'sido' && viewSido) {
            const { data, error } = await client
                .from('market_snapshots')
                .select('sido, sigungu, month, new_count, closed_count, updated_at')
                .eq('sido', viewSido)
                .gte('month', '2025-01')
                .order('month', { ascending: true });
            if (error) throw error;
            cachedSnaps = data || [];
            // sido 모드에서 역매핑 갱신
            cachedSnaps.forEach(r => { sigunguSidoMap[r.sigungu] = r.sido; });
        } else {
            // branch 모드: sigunguSidoMap을 managers 데이터로 재설정
            sigunguSidoMap = {};
            Object.entries(sidoSigunguMap).forEach(([sido, list]) => {
                list.forEach(sgu => { sigunguSidoMap[sgu] = sido; });
            });
            cachedSnaps = (await Promise.all(
                Object.entries(sidoSigunguMap).map(([sido, siguList]) =>
                    client.from('market_snapshots')
                        .select('sido, sigungu, month, new_count, closed_count, updated_at')
                        .eq('sido', sido)
                        .in('sigungu', siguList)
                        .gte('month', '2025-01')
                        .order('month', { ascending: true })
                        .then(({ data, error }) => { if (error) throw error; return data || []; })
                )
            )).flat();
        }

        const lastUpd = cachedSnaps.reduce((mx, r) => r.updated_at > mx ? r.updated_at : mx, '');
        if (lastUpd && syncEl) {
            const d = new Date(lastUpd).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
            syncEl.textContent = `갱신 ${d}`;
        } else if (syncEl) {
            syncEl.textContent = '데이터 없음';
        }

        applyFilters();

    } catch(e) {
        console.error('[discover] load error', e);
        if (syncEl) syncEl.textContent = '오류';
        document.getElementById('regionPanel').innerHTML =
            `<div class="state-msg"><div class="state-ico">⚠️</div><span>데이터 조회 실패<br>${esc(e.message)}</span></div>`;
    } finally {
        if (btnRef) btnRef.disabled = false;
    }
}

/* ═══════════════════════════════════════════════
   FILTER & RENDER
═══════════════════════════════════════════════ */
function applyFilters() {
    if (!cachedSnaps.length) {
        document.getElementById('regionPanel').innerHTML =
            '<div class="state-msg"><div class="state-ico">📭</div><span>데이터 준비 중입니다.<br>내일 새벽 3시 이후 확인하세요.</span></div>';
        renderKPIs({ totalNew:0, totalClosed:0, net:0 });
        return;
    }

    const displaySnaps = selectedMonth
        ? cachedSnaps.filter(r => r.month === selectedMonth)
        : cachedSnaps;

    // 전체 월별 집계 (차트용)
    const monthlyAll = {};
    cachedSnaps.forEach(r => {
        if (!monthlyAll[r.month]) monthlyAll[r.month] = { new:0, closed:0 };
        monthlyAll[r.month].new    += r.new_count    || 0;
        monthlyAll[r.month].closed += r.closed_count || 0;
    });

    // 표시 대상 집계
    const regions = {};
    displaySnaps.forEach(r => {
        if (!regions[r.sigungu]) regions[r.sigungu] = { new:0, closed:0 };
        regions[r.sigungu].new    += r.new_count    || 0;
        regions[r.sigungu].closed += r.closed_count || 0;
    });

    const regionsArr = Object.entries(regions)
        .map(([region, { new:n, closed:c }]) => ({
            region, new:n, closed:c, net:n-c,
            netRate: n > 0 ? Math.round(((n-c)/n)*100) : (c > 0 ? -100 : 0),
        }))
        .sort((a, b) => b.new - a.new);

    const totalNew    = regionsArr.reduce((s, r) => s + r.new,    0);
    const totalClosed = regionsArr.reduce((s, r) => s + r.closed, 0);

    // 월 목록 (2025-01 ~ 현재)
    const now = new Date();
    const monthList = [];
    const cur = new Date(2025, 0, 1);
    while (cur <= now) {
        monthList.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`);
        cur.setMonth(cur.getMonth() + 1);
    }
    const monthlyArr = monthList.map(m => ({
        month: m,
        new:    monthlyAll[m]?.new    || 0,
        closed: monthlyAll[m]?.closed || 0,
        net:   (monthlyAll[m]?.new || 0) - (monthlyAll[m]?.closed || 0),
    }));

    renderKPIs({ totalNew, totalClosed, net: totalNew - totalClosed });
    renderMap(regionsArr);
    renderRegionPanel(regionsArr);
    renderTrendChart(monthlyArr, selectedMonth);
    if (selectedMonth) renderComparison();
}

/* ─── KPI ─── */
function renderKPIs({ totalNew, totalClosed, net }) {
    setText('kpiNew',    totalNew.toLocaleString());
    setText('kpiClosed', totalClosed.toLocaleString());
    setText('kpiNet',    (net > 0 ? '+' : '') + net.toLocaleString());
    const rate = totalNew > 0 ? Math.round((net / totalNew) * 100) : 0;
    setText('kpiRate', (rate > 0 ? '+' : '') + rate + '%');
    setText('kpiNetSub', net >= 0 ? '시장 성장 중' : '시장 축소 중');
}

/* ─── MAP ─── */
function renderMap(regions) {
    if (!regions?.length) return;
    if (!mapReady) { pendingMapRender = () => renderMap(regions); return; }

    const primarySido = (viewMode === 'sido' && viewSido)
        ? viewSido
        : Object.entries(sidoSigunguMap).sort((a, b) => b[1].length - a[1].length)[0]?.[0] || '경기도';
    const cfg = SIDO_CENTER[primarySido];
    if (cfg) {
        map.setCenter(new kakao.maps.LatLng(cfg.center[0], cfg.center[1]));
        map.setLevel(cfg.level, { animate: true });
    }

    if (geoData) {
        renderGeoMap(regions);
    } else {
        loadGeoData().then(() => { if (geoData) renderGeoMap(regions); });
    }
}

/* ─── REGION PANEL ─── */

    const panel = document.getElementById('regionPanel');
    if (!regions?.length) {
        panel.innerHTML = '<div class="state-msg"><div class="state-ico">📭</div>데이터 없음</div>';
        return;
    }
    const maxNew = Math.max(...regions.map(r => r.new), 1);

        const pct    = Math.round((r.new / maxNew) * 100);

        return `<div class="rrow" style="cursor:pointer" onclick="openDrilldown('${esc(r.region)}')">

                </span>
                <span class="rrow-net ${netCls}">${netStr}</span>

/* ─── CHART ─── */
function renderTrendChart(monthly, highlightMonth) {
    const filtered = (monthly || []).filter(m => m.new + m.closed > 0);
    if (!filtered.length) return;

    const labels     = filtered.map(m => m.month.slice(2));
    const newData    = filtered.map(m => m.new);
    const closedData = filtered.map(m => m.closed);
    const netData    = filtered.map(m => m.net);

    const hlMonths = highlightMonth ? [
        highlightMonth,
        addMonths(highlightMonth, -1),
        addMonths(highlightMonth, -12),
    ] : [];

    function mkColor(i, baseHi, baseMid, baseLow) {
        const m = '20' + labels[i];
        if (!hlMonths.length) return baseHi;
        if (m === highlightMonth) return baseMid;
        if (hlMonths.includes(m)) return baseMid.replace(/[\d.]+\)$/, '0.4)');
        return baseLow;
    }

    const bgNew    = newData.map((_,i) => mkColor(i,'rgba(52,199,89,.25)','rgba(52,199,89,.8)','rgba(52,199,89,.07)'));
    const bgClosed = closedData.map((_,i) => mkColor(i,'rgba(255,59,48,.2)','rgba(255,59,48,.7)','rgba(255,59,48,.06)'));

    if (trendChart) trendChart.destroy();
    const ctx = document.getElementById('trendChart').getContext('2d');
    trendChart = new Chart(ctx, {
        data: {
            labels,
            datasets: [
                {
                    type:'bar', label:'신규 오픈', data:newData,
                    backgroundColor:bgNew, borderColor:'rgba(52,199,89,.6)',
                    borderWidth:1, borderRadius:2, yAxisID:'y',
                },
                {
                    type:'bar', label:'폐업', data:closedData,
                    backgroundColor:bgClosed, borderColor:'rgba(255,59,48,.5)',
                    borderWidth:1, borderRadius:2, yAxisID:'y',
                },
                {
                    type:'line', label:'순증', data:netData,
                    borderColor:'rgba(0,113,227,.8)',
                    backgroundColor:'rgba(0,113,227,.07)',
                    borderWidth:2, pointRadius:2.5,
                    pointBackgroundColor:'rgba(0,113,227,.9)',
                    fill:true, tension:0.35, yAxisID:'y',
                },
            ],
        },
        options: {
            responsive:true, maintainAspectRatio:false,
            plugins: {
                legend: {
                    labels: { color:'#6e6e73', font:{ size:12 }, boxWidth:11, padding:16 },
                },
                tooltip: {
                    backgroundColor:'#fff', borderColor:'#e0e0e5', borderWidth:1,
                    titleColor:'#1d1d1f', bodyColor:'#6e6e73', padding:11,
                    titleFont:{ size:13, weight:'600' },
                    bodyFont:{ size:13 },
                    callbacks: { label: c => ` ${c.dataset.label}: ${c.raw}건` },
                },
            },
            scales: {
                x: { ticks:{ color:'#a1a1a6', font:{ size:11 } }, grid:{ color:'rgba(0,0,0,.04)' } },
                y: { ticks:{ color:'#a1a1a6', font:{ size:11 }, stepSize:5 }, grid:{ color:'rgba(0,0,0,.04)' }, beginAtZero:true },
            },
        },
    });
}

/* ─── COMPARISON ─── */
function renderComparison() {
    if (!selectedMonth) return;
    const prevM = addMonths(selectedMonth, -1);
    const prevY = addMonths(selectedMonth, -12);

    function sum(ym) {
        const rows = cachedSnaps.filter(r => r.month === ym);
        const n = rows.reduce((s, r) => s + (r.new_count    || 0), 0);
        const c = rows.reduce((s, r) => s + (r.closed_count || 0), 0);
        return { new:n, closed:c, net:n-c };
    }
    const cur  = sum(selectedMonth);
    const prev = sum(prevM);
    const yoy  = sum(prevY);

    function colHtml(data, base) {
        const d = base ? cur.new - base.new : null;
        const deltaHtml = (d !== null && base && base.new > 0)
            ? `<div class="cmp-delta">신규 대비 <span class="${d > 0 ? 'du' : d < 0 ? 'dd' : ''}">${d > 0 ? '+' : ''}${d}건</span></div>`
            : '';
        return `<div class="cmp-ms">
            <div class="cmp-m"><span class="cmp-ml">신규</span><span class="cmp-mv cv-g">${data.new.toLocaleString()}</span></div>
            <div class="cmp-m"><span class="cmp-ml">폐업</span><span class="cmp-mv cv-r">${data.closed.toLocaleString()}</span></div>
            <div class="cmp-m"><span class="cmp-ml">순증</span><span class="cmp-mv cv-b">${data.net > 0 ? '+' : ''}${data.net.toLocaleString()}</span></div>
        </div>${deltaHtml}`;
    }

    setText('cmpTitleYoy', `전년동월 (${prevY})`);
    setText('cmpTitlePrev', `전월 (${prevM})`);
    setText('cmpTitleCur', `당월 (${selectedMonth})`);
    document.getElementById('cmpYoy').innerHTML  = colHtml(yoy,  null);
    document.getElementById('cmpPrev').innerHTML = colHtml(prev, null);
    document.getElementById('cmpCur').innerHTML  = colHtml(cur,  prev);
}

/* ═══════════════════════════════════════════════
   GEOJSON + 카카오맵 폴리곤
═══════════════════════════════════════════════ */
const GEOJSON_URL = 'https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2013/json/skorea-municipalities-geo.json';
let geoData = null;

async function loadGeoData() {
    if (geoData) return;
    try {
        const r = await fetch(GEOJSON_URL);
        if (!r.ok) return;
        geoData = await r.json();
    } catch(_) {}
}

function ringCentroid(ring) {
    let sumLng = 0, sumLat = 0;
    ring.forEach(c => { sumLng += c[0]; sumLat += c[1]; });
    return [sumLng / ring.length, sumLat / ring.length];
}

function renderGeoMap(regions) {
    if (!map || !geoData) return;

    // 기존 폴리곤 제거
    kakaoPolygons.forEach(p => p.setMap(null));
    kakaoPolygons = [];
    if (kakaoTooltip) { kakaoTooltip.setMap(null); kakaoTooltip = null; }

    const regionMap = {};
    regions.forEach(r => { regionMap[r.region] = r; });

    // 툴팁 CustomOverlay 생성
    kakaoTooltip = new kakao.maps.CustomOverlay({ zIndex: 100, yAnchor: 1.3 });

    geoData.features.forEach(f => {
        const name = f.properties.name;
        const d    = regionMap[name];

        const fill        = d ? (d.net > 2 ? '#34c759' : d.net < -2 ? '#ff3b30' : '#a1a1a6') : '#e5e5ea';
        const fillOpacity = d ? Math.min(0.25 + Math.abs(d.net) / 30, 0.75) : 0.18;

        const geom      = f.geometry;
        const polyGroups = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;

        polyGroups.forEach(coords => {
            const path = coords[0].map(c => new kakao.maps.LatLng(c[1], c[0]));
            const poly = new kakao.maps.Polygon({
                map,
                path,
                strokeWeight:  d ? 1.5 : 0.8,
                strokeColor:   d ? '#ffffff' : '#d1d1d6',
                strokeOpacity: 0.9,
                fillColor:     fill,
                fillOpacity,
            });

            if (!d) { kakaoPolygons.push(poly); return; }

            const netStr = d.net > 0 ? `+${d.net}` : String(d.net);
            const tipContent = `<div class="map-tooltip"><b>${esc(name)}</b><br>신규 ${d.new} · 폐업 ${d.closed} · 순증 ${netStr}</div>`;
            const centroid   = ringCentroid(coords[0]);
            const centroidLL = new kakao.maps.LatLng(centroid[1], centroid[0]);

            kakao.maps.event.addListener(poly, 'mouseover', () => {
                poly.setOptions({ strokeColor: '#0071e3', strokeWeight: 2.5 });
                kakaoTooltip.setContent(tipContent);
                kakaoTooltip.setPosition(centroidLL);
                kakaoTooltip.setMap(map);
            });
            kakao.maps.event.addListener(poly, 'mouseout', () => {
                poly.setOptions({ strokeColor: '#ffffff', strokeWeight: 1.5 });
                kakaoTooltip.setMap(null);
            });
            kakao.maps.event.addListener(poly, 'click', () => openDrilldown(name));

            kakaoPolygons.push(poly);
        });
    });
}

/* ═══════════════════════════════════════════════
   DRILL-DOWN
═══════════════════════════════════════════════ */
const API_BASE = 'https://maeil-fs-sales.vercel.app';
let currentDrillData   = [];
let currentDrillRegion = '';

async function openDrilldown(sigungu) {
    currentDrillRegion = sigungu;
    document.getElementById('sbListView').style.display  = 'none';
    document.getElementById('sbDrillView').style.display = 'flex';
    setText('drillTitle', sigungu);
    document.getElementById('drillSummary').innerHTML = '';
    document.getElementById('drillList').innerHTML =
        '<div class="state-msg"><div class="state-ico">⏳</div>불러오는 중...</div>';

    // 탭 초기화
    document.querySelectorAll('.dtab').forEach(b => b.classList.remove('active'));
    document.querySelector('.dtab[onclick*="all"]')?.classList.add('active');

    try {
        const sido = sigunguSidoMap[sigungu] || viewSido || '경기도';
        const monthParam = selectedMonth ? `&month=${encodeURIComponent(selectedMonth)}` : '';
        const r = await fetch(
            `${API_BASE}/api/market-stats?detail=true&sido=${encodeURIComponent(sido)}&sigungu=${encodeURIComponent(sigungu)}${monthParam}`
        );
        const data = await r.json();
        if (!data.success) throw new Error(data.error || '조회 실패');

        currentDrillData = data.stores || [];

        // 요약
        document.getElementById('drillSummary').innerHTML = `
            <div class="ds-stat">
                <span class="ds-lbl">신규</span>
                <span class="ds-val" style="color:var(--color-success)">${data.summary.new}</span>
            </div>
            <div class="ds-stat">
                <span class="ds-lbl">폐업</span>
                <span class="ds-val" style="color:var(--color-danger)">${data.summary.closed}</span>
            </div>
            <div class="ds-stat">
                <span class="ds-lbl">100평+</span>
                <span class="ds-val" style="color:var(--color-warning)">${currentDrillData.filter(s=>s.pyeong>=100).length}</span>
            </div>`;

        renderDrillList('all');
    } catch(e) {
        document.getElementById('drillList').innerHTML =
            `<div class="state-msg"><div class="state-ico">⚠️</div><span>데이터 없음<br><small>상권 통계 저장 후 이용 가능합니다</small></span></div>`;
    }
}

function closeDrilldown() {
    document.getElementById('sbListView').style.display  = 'flex';
    document.getElementById('sbDrillView').style.display = 'none';
    currentDrillData   = [];
    currentDrillRegion = '';
}

function switchDrillTab(btn, tab) {
    document.querySelectorAll('.dtab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderDrillList(tab);
}

function renderDrillList(tab) {
    let stores = currentDrillData;
    if (tab === 'new')    stores = stores.filter(s => s.status === 'new');
    if (tab === 'closed') stores = stores.filter(s => s.status === 'closed');
    if (tab === 'big')    stores = stores.filter(s => (s.pyeong || 0) >= 100);

    if (!stores.length) {
        document.getElementById('drillList').innerHTML =
            '<div class="state-msg"><div class="state-ico">📭</div>해당 데이터 없음</div>';
        return;
    }

    document.getElementById('drillList').innerHTML = stores.map(s => {
        const isBig = (s.pyeong || 0) >= 100;
        return `<div class="drill-row">
            <div class="drill-row-top">
                <span class="drill-name">${esc(s.name)}</span>
                ${isBig ? '<span class="big-badge">★ 대형</span>' : ''}
                <span class="drill-status ${s.status === 'new' ? 'ds-new' : 'ds-closed'}">${s.status === 'new' ? '신규' : '폐업'}</span>
            </div>
            <div class="drill-meta">
                ${s.category ? `<span>${esc(s.category)}</span>` : ''}
                ${s.pyeong   ? `<span>${s.pyeong}평</span>` : ''}
                ${s.license_date ? `<span>${s.license_date}</span>` : ''}
            </div>
            ${s.address ? `<div class="drill-addr">${esc(s.address)}</div>` : ''}
        </div>`;
    }).join('');
}

/* ─── 차트 접기/펼치기 ─── */
function toggleChart() {
    const bar = document.getElementById('chartBar');
    const btn = bar?.querySelector('.chart-toggle-btn');
    const collapsed = bar?.classList.toggle('collapsed');
    if (btn) btn.textContent = collapsed ? '펼치기' : '접기';
    setTimeout(() => map?.relayout(), 220);
}

/* ─── UTILS ─── */
function setText(id, txt) {
    const el = document.getElementById(id);
    if (el) el.textContent = txt;
}
function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
