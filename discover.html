<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FS MISO — 상권 분석</title>
    <link rel="icon" href="icons/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg:          #f1f5f9;
            --surface:     #ffffff;
            --surface-2:   #f8fafc;
            --border:      #e2e8f0;
            --border-dim:  #f1f5f9;
            --success:     #16a34a;
            --success-bg:  #f0fdf4;
            --success-border: #bbf7d0;
            --danger:      #dc2626;
            --danger-bg:   #fef2f2;
            --danger-border: #fecaca;
            --info:        #2563eb;
            --info-bg:     #eff6ff;
            --info-border: #bfdbfe;
            --warning:     #d97706;
            --warning-bg:  #fffbeb;
            --warning-border: #fde68a;
            --text:        #1e293b;
            --text-dim:    #64748b;
            --text-muted:  #94a3b8;
            --shadow-sm:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
            --shadow-md:   0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #nav-placeholder { flex-shrink: 0; }

        .intel-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        /* ─── HEADER ─── */
        .intel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 12px;
            flex-wrap: wrap;
            box-shadow: var(--shadow-sm);
        }

        .header-left { display: flex; align-items: center; gap: 10px; }

        .header-icon {
            width: 32px; height: 32px; border-radius: 8px;
            background: var(--info-bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
        }

        .header-title {
            font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2;
        }
        .header-sub {
            font-size: 11px; color: var(--text-muted); margin-top: 1px;
        }

        .header-right {
            display: flex; align-items: center; gap: 10px;
        }

        .sync-badge {
            font-size: 11px; color: var(--text-muted);
            background: var(--bg); border: 1px solid var(--border);
            padding: 4px 10px; border-radius: 20px;
        }

        .btn-refresh {
            padding: 6px 14px; font-size: 12px; font-weight: 600;
            border-radius: 6px; cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface); color: var(--text-dim);
            transition: all .15s;
        }
        .btn-refresh:hover { background: var(--bg); border-color: var(--info); color: var(--info); }
        .btn-refresh:disabled { opacity: .45; cursor: not-allowed; }

        /* ─── KPI STRIP ─── */
        .kpi-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--border);
        }

        .kpi-card {
            background: var(--surface);
            padding: 14px 20px;
            border-left: 4px solid transparent;
        }

        .kpi-card.c-green  { border-left-color: var(--success); }
        .kpi-card.c-red    { border-left-color: var(--danger); }
        .kpi-card.c-blue   { border-left-color: var(--info); }
        .kpi-card.c-yellow { border-left-color: var(--warning); }

        .kpi-label {
            font-size: 10px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px;
        }
        .kpi-val { font-size: 26px; font-weight: 700; line-height: 1; }
        .kpi-card.c-green  .kpi-val { color: var(--success); }
        .kpi-card.c-red    .kpi-val { color: var(--danger); }
        .kpi-card.c-blue   .kpi-val { color: var(--info); }
        .kpi-card.c-yellow .kpi-val { color: var(--warning); }

        .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        /* ─── BODY ─── */
        .intel-body {
            flex: 1; display: flex; overflow: hidden; min-height: 0;
        }

        /* ─── MAP ─── */
        .map-area { flex: 1; position: relative; background: #e8edf2; }
        #intel-map { width: 100%; height: 100%; }

        .map-legend {
            position: absolute; bottom: 14px; left: 14px;
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px; z-index: 500;
            display: flex; gap: 14px;
            font-size: 11px; color: var(--text-dim);
            box-shadow: var(--shadow-sm);
        }
        .leg-item { display: flex; align-items: center; gap: 6px; }
        .leg-dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

        /* ─── RIGHT PANEL ─── */
        .side-right {
            width: 280px; flex-shrink: 0;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .panel-header {
            padding: 11px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 11px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .06em;
            flex-shrink: 0; background: var(--surface-2);
        }

        .panel-body { flex: 1; overflow-y: auto; }

        /* 시군구 행 */
        .region-row {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-dim);
            transition: background .1s;
        }
        .region-row:hover { background: var(--surface-2); }

        .region-top {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 6px;
        }
        .region-name { font-size: 13px; font-weight: 600; color: var(--text); }
        .region-net {
            font-size: 12px; font-weight: 700;
        }
        .net-pos { color: var(--success); }
        .net-neg { color: var(--danger); }
        .net-zero { color: var(--text-muted); }

        .region-bar-bg {
            height: 4px; background: var(--bg);
            border-radius: 2px; margin-bottom: 6px; overflow: hidden;
        }
        .region-bar-fill { height: 100%; border-radius: 2px; transition: width .4s; }

        .region-nums { display: flex; gap: 14px; font-size: 11px; }
        .rnum { display: flex; flex-direction: column; gap: 1px; }
        .rnum-label { color: var(--text-muted); font-size: 10px; }
        .rnum-val { font-weight: 600; }

        /* ─── BOTTOM CHART ─── */
        .intel-bottom {
            flex-shrink: 0; height: 220px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            display: flex; overflow: hidden;
        }
        .chart-panel {
            flex: 1; min-width: 0;
            padding: 12px 20px 10px;
            display: flex; flex-direction: column;
        }
        .chart-panel-title {
            font-size: 11px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .06em;
            margin-bottom: 8px; flex-shrink: 0;
        }
        .chart-wrap { flex: 1; position: relative; min-height: 0; }

        /* ─── EMPTY / LOADING ─── */
        .state-msg {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100%; gap: 10px;
            color: var(--text-muted); font-size: 13px;
        }
        .state-msg .icon { font-size: 32px; }

        /* ─── LEAFLET POPUP (light) ─── */
        .leaflet-popup-content-wrapper {
            border-radius: 8px !important;
            box-shadow: var(--shadow-md) !important;
            border: 1px solid var(--border) !important;
        }
        .leaflet-popup-content { font-size: 13px; line-height: 1.7; }

        /* ─── FILTER BAR ─── */
        .filter-bar {
            display: flex; align-items: center; gap: 14px;
            padding: 7px 20px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0; flex-wrap: wrap;
        }
        .filter-label {
            font-size: 10px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: .07em; white-space: nowrap;
        }
        .chip-group { display: flex; gap: 5px; flex-wrap: wrap; }
        .chip {
            padding: 4px 11px; font-size: 12px; font-weight: 500;
            border-radius: 20px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-dim);
            cursor: pointer; transition: all .15s;
        }
        .chip:hover { border-color: var(--info); color: var(--info); }
        .chip.active { background: var(--info); border-color: var(--info); color: #fff; }
        .filter-sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
        .month-nav { display: flex; align-items: center; gap: 5px; }
        .month-nav .nav-btn {
            width: 24px; height: 24px; border-radius: 5px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text-dim); cursor: pointer; font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            transition: all .15s; line-height: 1;
        }
        .month-nav .nav-btn:hover { border-color: var(--info); color: var(--info); }
        #monthLabel {
            font-size: 13px; font-weight: 600; color: var(--text);
            min-width: 68px; text-align: center;
        }
        .btn-month-clear {
            font-size: 11px; padding: 3px 8px; border-radius: 4px;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text-muted); cursor: pointer; display: none;
            transition: all .15s;
        }
        .btn-month-clear:hover { border-color: var(--danger); color: var(--danger); }

        /* ─── COMPARISON STRIP (월 선택 시) ─── */
        .cmp-strip {
            display: none; flex-shrink: 0; overflow-x: auto;
            background: var(--surface);
            border-bottom: 2px solid var(--info-border);
        }
        .cmp-strip.visible { display: flex; }
        .cmp-col {
            flex: 1; min-width: 150px;
            padding: 10px 18px;
            border-right: 1px solid var(--border);
        }
        .cmp-col:last-child { border-right: none; }
        .cmp-col-title {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .07em; color: var(--text-muted); margin-bottom: 8px;
        }
        .cmp-col.col-cur .cmp-col-title { color: var(--info); }
        .cmp-metrics { display: flex; gap: 16px; }
        .cmp-metric { display: flex; flex-direction: column; gap: 1px; }
        .cmp-metric-label { font-size: 10px; color: var(--text-muted); }
        .cmp-metric-val { font-size: 17px; font-weight: 700; }
        .cv-green { color: var(--success); }
        .cv-red   { color: var(--danger);  }
        .cv-blue  { color: var(--info);    }
        .cmp-change { margin-top: 5px; font-size: 11px; color: var(--text-muted); }
        .delta-up   { color: var(--success); font-weight: 600; }
        .delta-down { color: var(--danger);  font-weight: 600; }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* ─── MOBILE ─── */
        @media (max-width: 900px) {
            .side-right { display: none; }
            .intel-bottom { height: 180px; }
        }
        @media (max-width: 600px) {
            .kpi-strip { grid-template-columns: repeat(2, 1fr); }
            .intel-header { padding: 8px 14px; }
            .filter-bar { padding: 7px 12px; gap: 10px; }
        }
    </style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="intel-wrap">

    <!-- HEADER -->
    <div class="intel-header">
        <div class="header-left">
            <div class="header-icon">📊</div>
            <div>
                <div class="header-title">상권 분석</div>
                <div class="header-sub" id="headerSub">카페·베이커리·음식점 신규·폐업 트렌드 (2025.01~)</div>
            </div>
        </div>

        <div class="header-right">
            <div class="sync-badge" id="lastSync">로딩 중...</div>
            <button class="btn-refresh" id="btnRefresh" onclick="loadDashboard(true)">새로고침</button>
        </div>
    </div>

    <!-- KPI STRIP -->
    <div class="kpi-strip">
        <div class="kpi-card c-green">
            <div class="kpi-label">신규 오픈</div>
            <div class="kpi-val" id="kpiNew">—</div>
            <div class="kpi-sub">인허가 기준 누적</div>
        </div>
        <div class="kpi-card c-red">
            <div class="kpi-label">폐업</div>
            <div class="kpi-val" id="kpiClosed">—</div>
            <div class="kpi-sub">폐업일 기준 누적</div>
        </div>
        <div class="kpi-card c-blue">
            <div class="kpi-label">순증가</div>
            <div class="kpi-val" id="kpiNet">—</div>
            <div class="kpi-sub" id="kpiNetSub">신규 − 폐업</div>
        </div>
        <div class="kpi-card c-yellow">
            <div class="kpi-label">성장률</div>
            <div class="kpi-val" id="kpiRate">—</div>
            <div class="kpi-sub">순증 / 신규</div>
        </div>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
        <span class="filter-label">지역</span>
        <div class="chip-group" id="regionChips">
            <button class="chip active" id="chip-branch" onclick="setRegionMode('branch')">내 지점</button>
            <!-- sido 칩은 initDashboard에서 동적 생성 -->
        </div>
        <div class="filter-sep"></div>
        <span class="filter-label">월 선택</span>
        <div class="month-nav">
            <button class="nav-btn" onclick="shiftMonth(-1)">‹</button>
            <span id="monthLabel">전체</span>
            <button class="nav-btn" onclick="shiftMonth(1)">›</button>
            <button class="btn-month-clear" id="btnMonthClear" onclick="clearMonth()">전체 보기</button>
        </div>
    </div>

    <!-- COMPARISON STRIP (월 선택 시 노출) -->
    <div class="cmp-strip" id="cmpStrip">
        <div class="cmp-col">
            <div class="cmp-col-title" id="cmpTitleYoy">전년동월</div>
            <div id="cmpYoy"></div>
        </div>
        <div class="cmp-col">
            <div class="cmp-col-title" id="cmpTitlePrev">전월</div>
            <div id="cmpPrev"></div>
        </div>
        <div class="cmp-col col-cur">
            <div class="cmp-col-title" id="cmpTitleCur">당월</div>
            <div id="cmpCur"></div>
        </div>
    </div>

    <!-- BODY -->
    <div class="intel-body">

        <!-- MAP -->
        <div class="map-area">
            <div id="intel-map"></div>
            <div class="map-legend">
                <div class="leg-item">
                    <div class="leg-dot" style="background:#16a34a"></div>
                    <span>순증</span>
                </div>
                <div class="leg-item">
                    <div class="leg-dot" style="background:#dc2626"></div>
                    <span>순감</span>
                </div>
                <div class="leg-item">
                    <div class="leg-dot" style="background:#94a3b8"></div>
                    <span>보합</span>
                </div>
                <div class="leg-item" style="margin-left:4px;border-left:1px solid #e2e8f0;padding-left:10px;color:#94a3b8">
                    크기 = 신규 건수
                </div>
            </div>
        </div>

        <!-- RIGHT: 시군구 랭킹 -->
        <div class="side-right">
            <div class="panel-header">시군구별 현황 · 신규순</div>
            <div class="panel-body" id="regionPanel">
                <div class="state-msg"><div class="icon">⏳</div><span>데이터 불러오는 중...</span></div>
            </div>
        </div>

    </div><!-- /intel-body -->

    <!-- BOTTOM: 월별 트렌드 -->
    <div class="intel-bottom">
        <div class="chart-panel">
            <div class="chart-panel-title">월별 신규 오픈 / 폐업 추이 · 2025.01~</div>
            <div class="chart-wrap">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>

</div><!-- /intel-wrap -->

<!-- ─── SCRIPTS ─── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script>
/* ═══════════════════════════════════════════════════
   시도명 정규화 (managers.region1 → 정규 단축명)
═══════════════════════════════════════════════════ */
const SIDO_NORM = {
    '서울특별시':'서울','서울시':'서울','서울':'서울',
    '부산광역시':'부산','부산시':'부산','부산':'부산',

    '제주특별자치도':'제주','제주도':'제주','제주':'제주',

function normSido(s) { return SIDO_NORM[s?.trim()] || s?.trim() || ''; }

/* ═══════════════════════════════════════════════════

═══════════════════════════════════════════════════ */

    '서울_강북구':  [37.6397,127.0258], '서울_강서구':  [37.5509,126.8496],

    '서울_마포구':  [37.5663,126.9014], '서울_서대문구':[37.5791,126.9368],
    '서울_서초구':  [37.4837,127.0324], '서울_성동구':  [37.5633,127.0369],
    '서울_성북구':  [37.5894,127.0167], '서울_송파구':  [37.5145,127.1059],

let map, markersLayer, trendChart;
let sidoSigunguMap  = {};   // { '경기도': ['의정부시',...], '인천': [...] }
let sigunguSidoMap  = {};   // sigungu → sido 역매핑 (CENTROIDS 조회)
let cachedSnaps     = [];   // 현재 지역 로드된 전체 스냅샷
let viewMode        = 'branch';   // 'branch' | 'sido'
let viewSido        = null;       // sido 모드일 때 선택된 시도
let selectedMonth   = null;       // 'YYYY-MM' | null (전체)

/* ─── 월 헬퍼 ─── */
function addMonths(ym, delta) {
    let [y, m] = ym.split('-').map(Number);
    m += delta;
    while (m > 12) { m -= 12; y++; }
    while (m < 1)  { m += 12; y--; }
    return `${y}-${String(m).padStart(2,'0')}`;
}
function currentYM() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

/* ─── 지역 모드 전환 ─── */
async function setRegionMode(mode, sido) {
    viewMode = mode;
    viewSido = sido || null;
    document.querySelectorAll('#regionChips .chip').forEach(c => c.classList.remove('active'));
    document.getElementById(mode === 'branch' ? 'chip-branch' : `chip-sido-${sido}`)?.classList.add('active');
    await loadDashboard();
}

/* ─── 월 네비게이션 ─── */
function shiftMonth(delta) {
    const cur  = currentYM();
    const base = selectedMonth || cur;
    const next = addMonths(base, delta);
    if (next < '2025-01' || next > cur) return;
    selectedMonth = next;
    updateMonthUI();
    applyFilters();
}
function clearMonth() {
    selectedMonth = null;
    updateMonthUI();
    applyFilters();
}
function updateMonthUI() {
    document.getElementById('monthLabel').textContent    = selectedMonth || '전체';
    document.getElementById('btnMonthClear').style.display = selectedMonth ? '' : 'none';
    document.getElementById('cmpStrip').classList.toggle('visible', !!selectedMonth);
    // KPI 라벨 업데이트
    const kpiSub = document.querySelector('.kpi-card.c-green .kpi-sub');
    if (kpiSub) kpiSub.textContent = selectedMonth ? `${selectedMonth} 기준` : '인허가 기준 누적';
}

/* ═══════════════════════════════════════════════════
   MAP INIT
═══════════════════════════════════════════════════ */
function initMap() {
    map = L.map('intel-map', { center:[37.5, 127.1], zoom:9, zoomControl:false });

    // CartoDB Positron (라이트 타일)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
        maxZoom: 19,
    }).addTo(map);

    L.control.zoom({ position:'bottomright' }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);
}

/* ═══════════════════════════════════════════════════
   AUTH → managers → sigungu 목록
═══════════════════════════════════════════════════ */
async function initDashboard() {
    try {
        const { data:{ session } } = await client.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }

        const bu = session.user.user_metadata?.business_unit || '';

        const { data: mgrs, error } = await client
            .from('managers')
            .select('region1, region2')
            .eq('business_unit', bu)
            .neq('region2', '지점장');

        if (error) throw error;

        const rows = mgrs || [];

        // sido → sigungu 목록 매핑 (다중 시도 지점 대응)
        sidoSigunguMap = {};
        sigunguSidoMap = {};
        rows.forEach(m => {
            const sido = normSido(m.region1);
            const sgu  = m.region2?.trim();
            if (!sido || !sgu) return;
            if (!sidoSigunguMap[sido]) sidoSigunguMap[sido] = [];
            if (!sidoSigunguMap[sido].includes(sgu)) sidoSigunguMap[sido].push(sgu);
            sigunguSidoMap[sgu] = sido;  // 마지막 sido로 덮어쓰기 (중복 시군구명은 드묾)
        });

        const allSiguList = Object.values(sidoSigunguMap).flat();
        if (!allSiguList.length) {
            document.getElementById('regionPanel').innerHTML =
                '<div class="state-msg"><div class="icon">⚠️</div><span>담당 지역이 설정되지 않았습니다.<br>관리자에게 문의하세요.</span></div>';
            return;
        }

        // 헤더: 시도 목록 + 시군구 요약
        const sidoLabels  = Object.keys(sidoSigunguMap).join(' · ');
        const regionLabel = allSiguList.length <= 3
            ? allSiguList.join(' · ')
            : `${allSiguList.slice(0,3).join(' · ')} 외 ${allSiguList.length - 3}개`;
        document.getElementById('headerSub').textContent =
            `${sidoLabels} · ${regionLabel} · 2025.01 ~ 현재`;

        // sido 칩 생성 (데이터 있는 시도 조회)
        buildSidoChips();

        await loadDashboard();

    } catch(e) {
        console.error('[discover] init error', e);
        showToast?.('초기화 실패: ' + e.message, 'error');
    }
}

/* ═══════════════════════════════════════════════════
   sido 칩 동적 생성
═══════════════════════════════════════════════════ */
async function buildSidoChips() {
    try {
        const { data } = await client
            .from('market_snapshots')
            .select('sido')
            .gte('month', '2025-01');
        const sidos = [...new Set((data || []).map(r => r.sido))].sort();
        const chips = document.getElementById('regionChips');
        sidos.forEach(sido => {
            if (document.getElementById(`chip-sido-${sido}`)) return;
            const btn = document.createElement('button');
            btn.className   = 'chip';
            btn.id          = `chip-sido-${sido}`;
            btn.textContent = sido;
            btn.onclick     = () => setRegionMode('sido', sido);
            chips.appendChild(btn);
        });
    } catch(_) {}
}

/* ═══════════════════════════════════════════════════
   Supabase에서 market_snapshots 조회 → cachedSnaps
═══════════════════════════════════════════════════ */
async function loadDashboard(force = false) {
    document.getElementById('btnRefresh').disabled = true;
    document.getElementById('lastSync').textContent = '로딩 중...';
    cachedSnaps = [];

    try {
        if (viewMode === 'sido' && viewSido) {
            // 시도 전체 조회
            const { data, error } = await client
                .from('market_snapshots')
                .select('sido, sigungu, month, new_count, closed_count, updated_at')
                .eq('sido', viewSido)
                .gte('month', '2025-01')
                .order('month', { ascending: true });
            if (error) throw error;
            cachedSnaps = data || [];
            // sido 모드에서 sigunguSidoMap 갱신
            cachedSnaps.forEach(r => { sigunguSidoMap[r.sigungu] = r.sido; });
        } else {
            // 내 지점: 시도별 쿼리 병렬 실행
            cachedSnaps = (await Promise.all(
                Object.entries(sidoSigunguMap).map(([sido, siguList]) =>
                    client.from('market_snapshots')
                        .select('sido, sigungu, month, new_count, closed_count, updated_at')
                        .eq('sido', sido)
                        .in('sigungu', siguList)
                        .gte('month', '2025-01')
                        .order('month', { ascending: true })
                        .then(({ data, error }) => { if (error) throw error; return data || []; })
                )
            )).flat();
        }

        // 갱신 시각
        const lastUpd = cachedSnaps.reduce((max, r) => r.updated_at > max ? r.updated_at : max, '');
        if (lastUpd) {
            const d = new Date(lastUpd).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
            document.getElementById('lastSync').textContent = `갱신 ${d}`;
        }

        applyFilters();

    } catch(e) {
        console.error('[discover] load error', e);
        showToast?.('데이터 조회 실패: ' + e.message, 'error');
        document.getElementById('lastSync').textContent = '오류';
    } finally {
        document.getElementById('btnRefresh').disabled = false;
    }
}

/* ═══════════════════════════════════════════════════
   필터 적용 → 렌더 (월 선택 반영)
═══════════════════════════════════════════════════ */
function applyFilters() {
    if (!cachedSnaps.length) {
        document.getElementById('regionPanel').innerHTML =
            '<div class="state-msg"><div class="icon">📭</div><span>데이터 준비 중입니다.<br>내일 새벽 3시 이후 확인하세요.</span></div>';
        return;
    }

    // 지도·패널은 선택 월만, 차트는 전체 기간
    const displaySnaps = selectedMonth
        ? cachedSnaps.filter(r => r.month === selectedMonth)
        : cachedSnaps;

    // 전체 월별 집계 (차트용)
    const monthlyAll = {};
    cachedSnaps.forEach(row => {
        if (!monthlyAll[row.month]) monthlyAll[row.month] = { new: 0, closed: 0 };
        monthlyAll[row.month].new    += row.new_count    || 0;
        monthlyAll[row.month].closed += row.closed_count || 0;
    });

    // 표시 대상 집계 (KPI·지도·패널)
    const regions = {};
    displaySnaps.forEach(row => {
        if (!regions[row.sigungu]) regions[row.sigungu] = { new: 0, closed: 0 };
        regions[row.sigungu].new    += row.new_count    || 0;
        regions[row.sigungu].closed += row.closed_count || 0;
    });

    const regionsArr = Object.entries(regions)
        .map(([region, { new: n, closed: c }]) => ({
            region, new: n, closed: c, net: n - c,
            netRate: n > 0 ? Math.round(((n - c) / n) * 100) : 0,
        }))
        .sort((a, b) => b.new - a.new);

    const totalNew    = regionsArr.reduce((s, r) => s + r.new,    0);
    const totalClosed = regionsArr.reduce((s, r) => s + r.closed, 0);

    // 월 목록 (2025-01 ~ 현재월)
    const now = new Date();
    const monthList = [];
    const cur = new Date(2025, 0, 1);
    while (cur <= now) {
        monthList.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`);
        cur.setMonth(cur.getMonth() + 1);
    }
    const monthlyArr = monthList.map(m => ({
        month: m,
        new:    monthlyAll[m]?.new    || 0,
        closed: monthlyAll[m]?.closed || 0,
        net:   (monthlyAll[m]?.new || 0) - (monthlyAll[m]?.closed || 0),
    }));

    renderKPIs({ totalNew, totalClosed, net: totalNew - totalClosed });
    renderMap(regionsArr);
    renderRegionPanel(regionsArr);
    renderTrendChart(monthlyArr, selectedMonth);
    if (selectedMonth) renderMonthComparison();
}

/* ═══════════════════════════════════════════════════
   월별 3구간 비교 렌더 (당월 / 전월 / 전년동월)
═══════════════════════════════════════════════════ */
function renderMonthComparison() {
    if (!selectedMonth) return;
    const prevM = addMonths(selectedMonth, -1);
    const prevY = addMonths(selectedMonth, -12);

    function sumMonth(ym) {
        const rows = cachedSnaps.filter(r => r.month === ym);
        const n = rows.reduce((s, r) => s + (r.new_count    || 0), 0);
        const c = rows.reduce((s, r) => s + (r.closed_count || 0), 0);
        return { new: n, closed: c, net: n - c };
    }
    const cur  = sumMonth(selectedMonth);
    const prev = sumMonth(prevM);
    const yoy  = sumMonth(prevY);

    function deltaHtml(val, base, label) {
        if (!base || base.new === 0) return '';
        const d = val.new - base.new;
        const cls = d > 0 ? 'delta-up' : d < 0 ? 'delta-down' : '';
        return `<div class="cmp-change">신규 ${label} 대비 <span class="${cls}">${d > 0 ? '+' : ''}${d}건</span></div>`;
    }

    function colHtml(data, base, label) {
        return `<div class="cmp-metrics">
            <div class="cmp-metric">
                <span class="cmp-metric-label">신규</span>
                <span class="cmp-metric-val cv-green">${data.new.toLocaleString()}</span>
            </div>
            <div class="cmp-metric">
                <span class="cmp-metric-label">폐업</span>
                <span class="cmp-metric-val cv-red">${data.closed.toLocaleString()}</span>
            </div>
            <div class="cmp-metric">
                <span class="cmp-metric-label">순증</span>
                <span class="cmp-metric-val cv-blue">${data.net > 0 ? '+' : ''}${data.net.toLocaleString()}</span>
            </div>
        </div>${deltaHtml(cur, base, label)}`;
    }

    document.getElementById('cmpTitleYoy').textContent  = `전년동월 (${prevY})`;
    document.getElementById('cmpTitlePrev').textContent  = `전월 (${prevM})`;
    document.getElementById('cmpTitleCur').textContent   = `당월 (${selectedMonth})`;
    document.getElementById('cmpYoy').innerHTML   = colHtml(yoy,  null, '');
    document.getElementById('cmpPrev').innerHTML  = colHtml(prev, null, '');
    document.getElementById('cmpCur').innerHTML   = colHtml(cur,  prev, '전월');
}

/* ═══════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════ */
function renderKPIs({ totalNew, totalClosed, net }) {
    setText('kpiNew',    totalNew.toLocaleString());
    setText('kpiClosed', totalClosed.toLocaleString());

    const sign = net > 0 ? '+' : '';
    setText('kpiNet', sign + net.toLocaleString());

    const rate = totalNew > 0 ? Math.round((net / totalNew) * 100) : 0;
    setText('kpiRate', (rate > 0 ? '+' : '') + rate + '%');
    setText('kpiNetSub', net >= 0 ? '시장 성장 중' : '시장 축소 중');
}

function renderMap(regions) {
    markersLayer.clearLayers();
    if (!regions?.length) return;

    const maxNew = Math.max(...regions.map(r => r.new), 1);

    // 지도 중심: 가장 많은 시군구를 가진 시도 기준
    const primarySido = Object.entries(sidoSigunguMap)
        .sort((a, b) => b[1].length - a[1].length)[0]?.[0] || '경기도';
    const cfg = SIDO_CENTER[primarySido];
    if (cfg) map.setView(cfg.center, cfg.zoom, { animate: true });

    regions.forEach(r => {
        // sigungu → sido 역매핑으로 정확한 좌표 조회 (동명 구 완전 분리)
        const sido   = sigunguSidoMap[r.region] || primarySido;
        const coords = CENTROIDS[`${sido}_${r.region}`];
        if (!coords) return;

        const radius = 7 + Math.round((r.new / maxNew) * 22);   // 7~29px
        const color  = r.net > 2  ? '#16a34a'
                     : r.net < -2 ? '#dc2626'
                     :              '#94a3b8';

        const circle = L.circleMarker(coords, {
            radius,
            fillColor:   color,
            fillOpacity: .65,
            color:       color,
            weight:      2,
            opacity:     .8,
        });

        const netStr = r.net > 0 ? `+${r.net}` : String(r.net);
        circle.bindPopup(`
            <div style="min-width:140px">
                <div style="font-weight:700;font-size:14px;margin-bottom:4px">${esc(r.region)}</div>
                <div style="color:#16a34a">신규 오픈 ${r.new}건</div>
                <div style="color:#dc2626">폐업 ${r.closed}건</div>
                <div style="color:${r.net >= 0 ? '#16a34a' : '#dc2626'};font-weight:600;margin-top:2px">순증 ${netStr}건</div>
            </div>
        `);

        markersLayer.addLayer(circle);
    });
}

function renderRegionPanel(regions) {
    if (!regions?.length) {
        document.getElementById('regionPanel').innerHTML =
            '<div class="state-msg"><div class="icon">📭</div><span>데이터 없음</span></div>';
        return;
    }

    const maxNew = Math.max(...regions.map(r => r.new), 1);

    const html = regions.map((r, idx) => {
        const pct    = Math.round((r.new / maxNew) * 100);
        const barC   = r.net > 0 ? '#16a34a' : r.net < 0 ? '#dc2626' : '#cbd5e1';
        const netStr = r.net > 0 ? `+${r.net}` : String(r.net);
        const netCls = r.net > 0 ? 'net-pos' : r.net < 0 ? 'net-neg' : 'net-zero';

        return `<div class="region-row">
            <div class="region-top">
                <span class="region-name">
                    <span style="color:#94a3b8;font-size:11px;margin-right:4px">${idx+1}</span>${esc(r.region)}
                </span>
                <span class="region-net ${netCls}">${netStr}</span>
            </div>
            <div class="region-bar-bg">
                <div class="region-bar-fill" style="width:${pct}%;background:${barC}"></div>
            </div>
            <div class="region-nums">
                <div class="rnum">
                    <span class="rnum-label" style="color:#16a34a">신규</span>
                    <span class="rnum-val" style="color:#16a34a">${r.new}</span>
                </div>
                <div class="rnum">
                    <span class="rnum-label" style="color:#dc2626">폐업</span>
                    <span class="rnum-val" style="color:#dc2626">${r.closed}</span>
                </div>
                <div class="rnum">
                    <span class="rnum-label">성장률</span>
                    <span class="rnum-val" style="color:#64748b">${r.netRate}%</span>
                </div>
            </div>
        </div>`;
    }).join('');

    document.getElementById('regionPanel').innerHTML = html;
}

function renderTrendChart(monthly, highlightMonth) {
    if (!monthly?.length) return;

    const filtered = monthly.filter(m => m.new + m.closed > 0);
    if (!filtered.length) return;

    const labels     = filtered.map(m => m.month.slice(2));
    const newData    = filtered.map(m => m.new);
    const closedData = filtered.map(m => m.closed);
    const netData    = filtered.map(m => m.net);

    // 선택 월 하이라이트
    const hlMonths = highlightMonth ? [
        highlightMonth,
        addMonths(highlightMonth, -1),
        addMonths(highlightMonth, -12),
    ] : [];
    const bgNew = newData.map((_, i) => {
        const m = '20' + labels[i];
        if (!hlMonths.length) return 'rgba(22,163,74,.25)';
        if (m === highlightMonth) return 'rgba(22,163,74,.75)';
        if (hlMonths.includes(m)) return 'rgba(22,163,74,.4)';
        return 'rgba(22,163,74,.08)';
    });
    const bgClosed = closedData.map((_, i) => {
        const m = '20' + labels[i];
        if (!hlMonths.length) return 'rgba(220,38,38,.2)';
        if (m === highlightMonth) return 'rgba(220,38,38,.65)';
        if (hlMonths.includes(m)) return 'rgba(220,38,38,.35)';
        return 'rgba(220,38,38,.06)';
    });

    if (trendChart) trendChart.destroy();

    const ctx = document.getElementById('trendChart').getContext('2d');
    trendChart = new Chart(ctx, {
        data: {
            labels,
            datasets: [
                {
                    type: 'bar', label: '신규 오픈',
                    data: newData,
                    backgroundColor: bgNew,
                    borderColor:     'rgba(22,163,74,.7)',
                    borderWidth: 1, borderRadius: 3, yAxisID: 'y',
                },
                {
                    type: 'bar', label: '폐업',
                    data: closedData,
                    backgroundColor: bgClosed,
                    borderColor:     'rgba(220,38,38,.6)',
                    borderWidth: 1, borderRadius: 3, yAxisID: 'y',
                },
                {
                    type: 'line', label: '순증',
                    data: netData,
                    borderColor:     'rgba(37,99,235,.85)',
                    backgroundColor: 'rgba(37,99,235,.08)',
                    borderWidth: 2, pointRadius: 3,
                    pointBackgroundColor: 'rgba(37,99,235,.9)',
                    fill: true, tension: 0.3, yAxisID: 'y',
                },
            ],
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: {
                        color: '#64748b', font:{ size:11 },
                        boxWidth: 10, padding: 14,
                    },
                },
                tooltip: {
                    backgroundColor: '#fff',
                    borderColor: '#e2e8f0', borderWidth: 1,
                    titleColor: '#1e293b', bodyColor: '#64748b', padding: 10,
                    callbacks: {
                        label: ctx => ` ${ctx.dataset.label}: ${ctx.raw}건`
                    }
                },
            },
            scales: {
                x: {
                    ticks: { color:'#94a3b8', font:{ size:10 } },
                    grid:  { color:'rgba(0,0,0,.04)' },
                },
                y: {
                    ticks: { color:'#94a3b8', font:{ size:10 }, stepSize: 5 },
                    grid:  { color:'rgba(0,0,0,.04)' },
                    beginAtZero: true,
                },
            },
        },
    });
}

/* ─── UTILS ─── */
function setText(id, txt) {
    const el = document.getElementById(id);
    if (el) el.textContent = txt;
}

function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
