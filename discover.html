<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시장 분석 — FS MISO</title>
    <link rel="icon" href="icons/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="stylesheet" href="common.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            /* aliases for JS inline styles */
            --color-primary: #2563eb;
            --color-success: #16a34a;
            --color-danger:  #dc2626;
            --color-warning: #d97706;

            --surface: #ffffff;
            --bg:      #f0f3f8;
            --border:  #e2e8f2;
            --border-light: #eef1f7;

            --text:    #0f172a;
            --text-2:  #64748b;
            --text-3:  #94a3b8;

            --blue:   #2563eb;
            --green:  #16a34a;
            --red:    #dc2626;
            --amber:  #d97706;

            --sh-xs: 0 1px 3px rgba(15,23,42,.06);
            --sh-sm: 0 2px 10px rgba(15,23,42,.07), 0 1px 3px rgba(15,23,42,.04);
            --sh-md: 0 4px 20px rgba(15,23,42,.09), 0 2px 6px rgba(15,23,42,.04);
            --sh-lg: 0 8px 36px rgba(15,23,42,.11), 0 3px 10px rgba(15,23,42,.05);

            --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 100px;
        }

        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 14px;
            color: var(--text);
            background: #cbd5e1;
            display: flex;
            flex-direction: column;
        }

        #nav-placeholder { flex-shrink: 0; }

        /* ── MAP CONTAINER ── */
        .map-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }
        #intel-map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* ── GLASS ── */
        .glass {
            background: var(--surface);
            box-shadow: var(--sh-sm);
            border: 1px solid var(--border);
        }

        /* ── VIEW TOGGLE ── */
        .view-toggle {
            position: absolute; top: 14px; left: 14px; z-index: 600;
            display: flex; gap: 2px; padding: 3px;
            border-radius: var(--r-pill);
        }
        .vtbtn {
            height: 32px; padding: 0 15px; border-radius: var(--r-pill);
            border: none; background: transparent; color: var(--text-2);
            font-size: 12px; font-weight: 600; letter-spacing: .01em;
            cursor: pointer; transition: all .18s ease;
            white-space: nowrap; font-family: inherit;
        }
        .vtbtn:hover { color: var(--text); }
        .vtbtn.active {
            background: var(--blue); color: #fff; font-weight: 700;
            box-shadow: 0 2px 8px rgba(37,99,235,.3);
        }

        /* ── KPI STRIP ── */
        .kpi-float {
            position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
            z-index: 200; display: flex; align-items: center;
            border-radius: var(--r-pill); white-space: nowrap;
        }
        .kf-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 1px; padding: 8px 18px;
        }
        .kf-sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
        .kf-lbl {
            font-size: 9px; font-weight: 600; color: var(--text-3);
            letter-spacing: .08em; text-transform: uppercase;
        }
        .kf-val {
            font-size: 20px; font-weight: 800;
            font-variant-numeric: tabular-nums; letter-spacing: -.03em; line-height: 1;
        }
        .kf-g .kf-val { color: var(--green); }
        .kf-r .kf-val { color: var(--red); }
        .kf-b .kf-val { color: var(--blue); }
        .kf-a .kf-val { color: var(--amber); }

        /* ── TOP RIGHT ── */
        .top-right {
            position: absolute; top: 14px; right: 14px;
            z-index: 200; display: flex; align-items: center; gap: 6px;
        }
        .sync-badge {
            border-radius: var(--r-pill); padding: 6px 12px;
            font-size: 11px; font-weight: 500; color: var(--text-3); white-space: nowrap;
        }
        .btn-refresh {
            height: 32px; padding: 0 13px; border-radius: var(--r-pill);
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text-2); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all .15s ease;
            display: flex; align-items: center; gap: 5px;
            white-space: nowrap; font-family: inherit;
            box-shadow: var(--sh-xs);
        }
        .btn-refresh:hover { border-color: var(--blue); color: var(--blue); }
        .btn-refresh:disabled { opacity: .35; cursor: not-allowed; }

        /* ── FLOATING TOOLBAR ── */
        .toolbar-float {
            position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            z-index: 200; border-radius: var(--r-lg);
            padding: 10px 14px 10px; display: flex; flex-direction: column; gap: 7px;
            max-width: calc(100vw - 28px);
        }
        .tf-row { display: flex; align-items: center; gap: 7px; }
        .tf-lbl {
            font-size: 9px; font-weight: 600; color: var(--text-3);
            letter-spacing: .1em; text-transform: uppercase;
            white-space: nowrap; flex-shrink: 0; min-width: 26px;
        }
        .tf-sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }
        .chips { display: flex; gap: 4px; overflow-x: auto; }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            height: 28px; padding: 0 12px; font-size: 12px; font-weight: 600;
            border-radius: var(--r-pill); border: 1px solid var(--border);
            background: transparent; color: var(--text-2);
            cursor: pointer; white-space: nowrap; transition: all .14s ease;
            flex-shrink: 0; font-family: inherit;
        }
        .chip:hover { border-color: var(--blue); color: var(--blue); background: rgba(37,99,235,.05); }
        .chip.active {
            background: var(--blue); border-color: var(--blue);
            color: #fff; font-weight: 700;
        }

        /* ── MONTH TIMELINE ── */
        .month-timeline {
            display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0;
        }
        .month-timeline::-webkit-scrollbar { height: 2px; }
        .month-timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 1px; }
        .mt-pill {
            height: 28px; padding: 0 11px; border-radius: var(--r-pill);
            border: 1px solid var(--border-light); background: transparent;
            color: var(--text-3); font-size: 11px; font-weight: 600;
            cursor: pointer; white-space: nowrap; flex-shrink: 0;
            transition: all .14s ease; font-family: inherit;
        }
        .mt-pill:hover { border-color: var(--blue); color: var(--blue); }
        .mt-pill.active {
            background: var(--blue); border-color: var(--blue);
            color: #fff; font-weight: 700;
        }
        .mt-pill.mt-all { color: var(--text-2); border-color: var(--border); font-weight: 700; }
        .mt-pill.mt-all.active { background: var(--text); border-color: var(--text); color: #fff; }

        /* ── MAP LEGEND ── */
        .map-legend {
            position: absolute; bottom: 150px; left: 14px; z-index: 200;
            border-radius: var(--r-md); padding: 6px 12px;
            display: flex; gap: 12px;
            font-size: 11px; color: var(--text-2); font-weight: 500;
        }
        .leg-i { display: flex; align-items: center; gap: 5px; }
        .leg-d { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

        /* ── BACKDROP ── */
        .panel-backdrop {
            position: absolute; inset: 0; background: rgba(15,23,42,.3);
            z-index: 499; opacity: 0; pointer-events: none; transition: opacity .28s ease;
        }
        .panel-backdrop.on { opacity: 1; pointer-events: all; }

        /* ── SLIDE PANEL ── */
        .slide-panel {
            position: absolute; top: 0; right: -460px;
            width: 440px; height: 100%;
            background: var(--surface);
            border-left: 1px solid var(--border);
            box-shadow: -6px 0 32px rgba(15,23,42,.1);
            z-index: 500;
            transition: right .3s cubic-bezier(.4,0,.2,1);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .slide-panel.open { right: 0; }

        .sp-hd {
            display: flex; align-items: center; gap: 12px;
            padding: 16px 20px; border-bottom: 1px solid var(--border);
            flex-shrink: 0; background: var(--bg);
        }
        .sp-close {
            width: 30px; height: 30px; border-radius: 50%;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text-2); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; flex-shrink: 0;
            transition: all .14s ease; font-family: inherit;
        }
        .sp-close:hover { background: #fee2e2; color: var(--red); border-color: #fca5a5; }
        .sp-title {
            font-size: 17px; font-weight: 800; color: var(--text);
            flex: 1; letter-spacing: -.025em;
        }

        /* Drill summary */
        .drill-summary {
            padding: 12px 20px; background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex; gap: 24px; flex-shrink: 0;
        }
        .ds-stat { display: flex; flex-direction: column; gap: 2px; }
        .ds-lbl {
            font-size: 9px; font-weight: 600; color: var(--text-3);
            letter-spacing: .1em; text-transform: uppercase;
        }
        .ds-val { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }

        /* Drill tabs */
        .drill-tabs {
            display: flex; gap: 4px; padding: 9px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0; overflow-x: auto;
        }
        .drill-tabs::-webkit-scrollbar { display: none; }
        .dtab {
            height: 28px; padding: 0 13px; font-size: 12px; font-weight: 600;
            border-radius: var(--r-pill); border: 1px solid var(--border);
            background: transparent; color: var(--text-2);
            cursor: pointer; transition: all .14s ease;
            white-space: nowrap; flex-shrink: 0; font-family: inherit;
        }
        .dtab:hover { border-color: var(--blue); color: var(--blue); }
        .dtab.active {
            background: var(--blue); border-color: var(--blue);
            color: #fff; font-weight: 700;
        }

        /* Drill list */
        .drill-list { flex: 1; overflow-y: auto; min-height: 0; }
        .drill-list::-webkit-scrollbar { width: 3px; }
        .drill-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .drill-row {
            padding: 13px 20px; border-bottom: 1px solid var(--border-light);
            transition: background .1s ease;
        }
        .drill-row:hover { background: var(--bg); }
        .drill-row-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .drill-name {
            font-size: 14px; font-weight: 700; color: var(--text);
            flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .big-badge {
            font-size: 10px; font-weight: 700; color: var(--amber);
            background: #fef3c7; border-radius: 4px; padding: 2px 6px; flex-shrink: 0;
        }
        .drill-status {
            font-size: 11px; font-weight: 700; padding: 2px 9px;
            border-radius: 20px; flex-shrink: 0;
        }
        .ds-new    { background: #dcfce7; color: #166534; }
        .ds-closed { background: #fee2e2; color: #991b1b; }
        .drill-meta {
            display: flex; gap: 6px; flex-wrap: wrap;
            font-size: 12px; color: var(--text-2); margin-bottom: 4px;
        }
        .drill-meta span {
            background: var(--bg); padding: 1px 6px;
            border-radius: 4px; border: 1px solid var(--border-light);
        }
        .drill-addr {
            font-size: 11px; color: var(--text-3);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Panel chart */
        .sp-chart-section {
            flex-shrink: 0; border-top: 1px solid var(--border);
        }
        .sp-chart-toggle {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 20px; cursor: pointer;
            font-size: 11px; font-weight: 600; color: var(--text-2);
            letter-spacing: .04em; transition: background .1s ease; user-select: none;
        }
        .sp-chart-toggle:hover { background: var(--bg); }
        .sp-chart-body { padding: 0 16px 12px; height: 148px; display: none; }
        .sp-chart-body.open { display: block; }

        /* State messages */
        .state-msg {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 10px; padding: 52px 24px;
            color: var(--text-3); font-size: 13px; text-align: center; line-height: 1.6;
        }
        .state-ico { font-size: 30px; opacity: .7; }

        /* ── RANKING VIEW ── */
        .ranking-view {
            position: absolute; inset: 0; background: var(--bg);
            z-index: 300; display: none; flex-direction: column; overflow: hidden;
        }
        .ranking-view.on { display: flex; }

        .rv-header {
            padding: 12px 20px; border-bottom: 1px solid var(--border);
            background: var(--surface); flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .rv-title {
            font-size: 11px; font-weight: 700; color: var(--text-2);
            letter-spacing: .1em; text-transform: uppercase;
        }
        .rv-sorts { display: flex; gap: 4px; }
        .rv-sort-btn {
            height: 27px; padding: 0 12px; border-radius: var(--r-pill);
            border: 1px solid var(--border); background: transparent;
            color: var(--text-2); font-size: 11px; font-weight: 600;
            cursor: pointer; transition: all .14s ease; font-family: inherit;
        }
        .rv-sort-btn:hover { border-color: var(--blue); color: var(--blue); }
        .rv-sort-btn.active {
            background: var(--text); border-color: var(--text);
            color: #fff; font-weight: 700;
        }

        .rv-body {
            flex: 1; overflow-y: auto; padding: 14px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px; align-content: start;
        }
        .rv-body::-webkit-scrollbar { width: 3px; }
        .rv-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .rv-card {
            background: var(--surface); border-radius: var(--r-md);
            border: 1px solid var(--border); padding: 16px 18px;
            cursor: pointer; transition: all .16s ease;
            box-shadow: var(--sh-xs);
        }
        .rv-card:hover {
            box-shadow: var(--sh-md); transform: translateY(-2px);
            border-color: #bfdbfe;
        }
        .rv-card-top {
            display: flex; align-items: baseline;
            justify-content: space-between; margin-bottom: 10px;
        }
        .rv-card-name { display: flex; align-items: baseline; gap: 8px; }
        .rv-rank { font-size: 11px; font-weight: 600; color: var(--text-3); min-width: 22px; }
        .rv-name { font-size: 16px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
        .rv-net { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .rv-net-pos { color: var(--green); }
        .rv-net-neg { color: var(--red); }
        .rv-net-0   { color: var(--text-3); }
        .rv-bar { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
        .rv-bar-fill { height: 100%; border-radius: 2px; transition: width .5s cubic-bezier(.4,0,.2,1); }
        .rv-nums { display: flex; gap: 18px; }
        .rv-num { display: flex; flex-direction: column; gap: 2px; }
        .rv-num-l { font-size: 9px; color: var(--text-3); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
        .rv-num-v { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }

        /* Ranking chart strip */
        .rv-chart-strip {
            flex-shrink: 0; height: 150px; border-top: 1px solid var(--border);
            background: var(--surface); padding: 10px 20px;
            display: flex; flex-direction: column;
        }
        .rv-chart-lbl {
            font-size: 9px; font-weight: 600; color: var(--text-3);
            letter-spacing: .1em; text-transform: uppercase;
            margin-bottom: 6px; flex-shrink: 0;
        }
        .rv-chart-wrap { flex: 1; position: relative; min-height: 0; }

        /* ── MAP TOOLTIP ── */
        .map-tooltip {
            background: var(--text); color: #fff;
            border-radius: 8px; padding: 7px 13px;
            font-size: 13px; font-weight: 500;
            box-shadow: var(--sh-md);
            white-space: nowrap; pointer-events: none;
        }
        .map-tooltip b { font-weight: 800; }

        /* MapLibre popup chrome 제거 — .map-tooltip만 노출 */
        .muni-popup .maplibregl-popup-content { background: transparent; padding: 0; box-shadow: none; }
        .muni-popup .maplibregl-popup-tip { display: none; }
        .maplibregl-ctrl-bottom-right { bottom: 150px; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) { .slide-panel { width: 380px; right: -400px; } }
        @media (max-width: 768px) {
            .kpi-float { top: 60px; }
            .kf-item { padding: 6px 12px; }
            .kf-val { font-size: 17px; }
            .toolbar-float { bottom: 68px; padding: 9px 12px; gap: 6px; }
            .slide-panel { width: 100%; right: -100%; }
            .rv-body { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .kpi-float { display: none; }
            .view-toggle { top: 10px; left: 10px; }
            .top-right { top: 10px; right: 10px; }
        }
    </style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="map-container">

    <!-- MAP -->
    <div id="intel-map"></div>

    <!-- VIEW TOGGLE -->
    <div class="view-toggle glass">
        <button class="vtbtn active" id="btnMapView" onclick="setView('map')">🗺 지도</button>
        <button class="vtbtn" id="btnRankView" onclick="setView('rank')">📊 랭킹</button>
    </div>

    <!-- KPI STRIP -->
    <div class="kpi-float glass">
        <div class="kf-item kf-g">
            <span class="kf-lbl">신규</span>
            <span class="kf-val" id="kpiNew">—</span>
        </div>
        <div class="kf-sep"></div>
        <div class="kf-item kf-r">
            <span class="kf-lbl">폐업</span>
            <span class="kf-val" id="kpiClosed">—</span>
        </div>
        <div class="kf-sep"></div>
        <div class="kf-item kf-b">
            <span class="kf-lbl">순증</span>
            <span class="kf-val" id="kpiNet">—</span>
        </div>
        <div class="kf-sep"></div>
        <div class="kf-item kf-a">
            <span class="kf-lbl">성장률</span>
            <span class="kf-val" id="kpiRate">—</span>
        </div>
    </div>

    <!-- SYNC + REFRESH -->
    <div class="top-right">
        <span class="sync-badge glass" id="lastSync">로딩 중...</span>
        <button class="btn-refresh glass" id="btnRefresh" onclick="loadDashboard()">↺ 새로고침</button>
    </div>

    <!-- FLOATING TOOLBAR -->
    <div class="toolbar-float glass">
        <div class="tf-row">
            <span class="tf-lbl">지역</span>
            <div class="chips" id="regionChips">
                <button class="chip active" id="chip-branch" onclick="setRegionMode('branch')">내 지점</button>
            </div>
            <div class="tf-sep"></div>
            <span class="tf-lbl">업종</span>
            <div class="chips" id="catChips">
                <button class="chip active" onclick="setCategory('all', this)">전체</button>
                <button class="chip" onclick="setCategory('cafe', this)">☕ 카페</button>
                <button class="chip" onclick="setCategory('bakery', this)">🥐 베이커리</button>
                <button class="chip" onclick="setCategory('restaurant', this)">🍽 음식점</button>
            </div>
        </div>
        <div class="tf-row">
            <span class="tf-lbl">월</span>
            <div class="month-timeline" id="monthTimeline"></div>
        </div>
    </div>

    <!-- MAP LEGEND -->
    <div class="map-legend glass">
        <div class="leg-i"><div class="leg-d" style="background:#34c759"></div>순증</div>
        <div class="leg-i"><div class="leg-d" style="background:#ff3b30"></div>순감</div>
        <div class="leg-i"><div class="leg-d" style="background:#a1a1a6"></div>보합</div>
    </div>

    <!-- BACKDROP -->
    <div class="panel-backdrop" id="panelBackdrop" onclick="closePanel()"></div>

    <!-- SLIDE PANEL -->
    <div class="slide-panel" id="slidePanel">
        <div class="sp-hd">
            <button class="sp-close" onclick="closePanel()">✕</button>
            <span class="sp-title" id="drillTitle">—</span>
        </div>
        <div class="drill-summary" id="drillSummary"></div>
        <div class="drill-tabs">
            <button class="dtab active" onclick="switchDrillTab(this,'all')">전체</button>
            <button class="dtab" onclick="switchDrillTab(this,'new')">신규</button>
            <button class="dtab" onclick="switchDrillTab(this,'closed')">폐업</button>
            <button class="dtab" onclick="switchDrillTab(this,'big')">100평+</button>
        </div>
        <div class="drill-list" id="drillList">
            <div class="state-msg"><div class="state-ico">⏳</div>지역을 선택하세요</div>
        </div>
        <div class="sp-chart-section">
            <div class="sp-chart-toggle" onclick="toggleSpChart()">
                <span>📈 월별 추이</span>
                <span id="spChartArrow">▲ 펼치기</span>
            </div>
            <div class="sp-chart-body" id="spChartBody">
                <canvas id="trendChart"></canvas>

/* ─── MONTH HELPERS ─── */
function addMonths(ym, delta) {
    let [y, m] = ym.split('-').map(Number);
    m += delta;
    while (m > 12) { m -= 12; y++; }
    while (m < 1)  { m += 12; y--; }
    return `${y}-${String(m).padStart(2,'0')}`;
}
function currentYM() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function getMonthList() {
    const list = [];
    const now = new Date();
    let cur = new Date(2025, 0, 1);
    while (cur <= now) {
        list.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`);
        cur.setMonth(cur.getMonth() + 1);
    }
    return list;
}

/* ─── DATA LOAD ─── */
async function loadDashboard() {
    const btnRef = document.getElementById('btnRefresh');
    const syncEl = document.getElementById('lastSync');
    if (btnRef) btnRef.disabled = true;
    if (syncEl) syncEl.textContent = '로딩 중...';
    cachedSnaps = [];
    mapCentered = false;

    try {
        if (viewMode === 'sido' && viewSido) {
            const { data, error } = await client
                .from('market_snapshots')
                .select('sido, sigungu, month, new_count, closed_count, updated_at')
                .eq('sido', viewSido)
                .gte('month', '2025-01')
                .order('month', { ascending: true });
            if (error) throw error;
            cachedSnaps = data || [];
            cachedSnaps.forEach(r => { sigunguSidoMap[r.sigungu] = r.sido; });
        } else {
            sigunguSidoMap = {};
            Object.entries(sidoSigunguMap).forEach(([sido, list]) => {
                list.forEach(sgu => { sigunguSidoMap[sgu] = sido; });
            });
            cachedSnaps = (await Promise.all(
                Object.entries(sidoSigunguMap).map(([sido, siguList]) =>
                    client.from('market_snapshots')
                        .select('sido, sigungu, month, new_count, closed_count, updated_at')
                        .eq('sido', sido)
                        .in('sigungu', siguList)
                        .gte('month', '2025-01')
                        .order('month', { ascending: true })
                        .then(({ data, error }) => { if (error) throw error; return data || []; })
                )
            )).flat();
        }

        const lastUpd = cachedSnaps.reduce((mx, r) => r.updated_at > mx ? r.updated_at : mx, '');
        if (lastUpd && syncEl) {
            const d = new Date(lastUpd).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
            syncEl.textContent = `갱신 ${d}`;
        } else if (syncEl) {
            syncEl.textContent = '데이터 없음';
        }

        applyFilters();

    } catch(e) {
        console.error('[discover] load error', e);
        if (syncEl) syncEl.textContent = '오류';
    } finally {
        if (btnRef) btnRef.disabled = false;
    }
}

/* ─── FILTER & RENDER ─── */
function applyFilters() {
    if (!cachedSnaps.length) {
        renderKPIs({ totalNew:0, totalClosed:0, net:0 });
        return;
    }

    const displaySnaps = selectedMonth
        ? cachedSnaps.filter(r => r.month === selectedMonth)
        : cachedSnaps;

    const regions = {};
    displaySnaps.forEach(r => {
        if (!regions[r.sigungu]) regions[r.sigungu] = { new:0, closed:0 };
        regions[r.sigungu].new    += r.new_count    || 0;
        regions[r.sigungu].closed += r.closed_count || 0;
    });

    cachedRegionsArr = Object.entries(regions)
        .map(([region, { new:n, closed:c }]) => ({
            region, new:n, closed:c, net:n-c,
            netRate: n > 0 ? Math.round(((n-c)/n)*100) : (c > 0 ? -100 : 0),
        }))
        .sort((a, b) => b.new - a.new);

    const totalNew    = cachedRegionsArr.reduce((s, r) => s + r.new,    0);
    const totalClosed = cachedRegionsArr.reduce((s, r) => s + r.closed, 0);

    renderKPIs({ totalNew, totalClosed, net: totalNew - totalClosed });
    renderMap(cachedRegionsArr);
    if (currentView === 'rank') {
        renderRankingView(cachedRegionsArr);
        renderOverallChart();
    }
}

/* ─── KPI ─── */
function renderKPIs({ totalNew, totalClosed, net }) {
    setText('kpiNew',    totalNew.toLocaleString());
    setText('kpiClosed', totalClosed.toLocaleString());
    setText('kpiNet',    (net > 0 ? '+' : '') + net.toLocaleString());
    const rate = totalNew > 0 ? Math.round((net / totalNew) * 100) : 0;
    setText('kpiRate', (rate > 0 ? '+' : '') + rate + '%');
}

/* ─── MAP ─── */
function renderMap(regions) {
    if (!mapReady) { pendingMapRender = () => renderMap(regions); return; }

    if (!mapCentered) {
        const primarySido = (viewMode === 'sido' && viewSido)
            ? viewSido
            : Object.entries(sidoSigunguMap).sort((a, b) => b[1].length - a[1].length)[0]?.[0] || '경기도';
        const cfg = SIDO_CENTER[primarySido];
        if (cfg) {
            // SIDO_CENTER는 [lat,lng]+kakao level → MapLibre [lng,lat]+zoom(≈17-level)
            map.flyTo({ center: [cfg.center[1], cfg.center[0]], zoom: 17 - cfg.level, duration: 800 });
            mapCentered = true;
        }
    }

    if (geoData) {
        renderGeoMap(regions);
    } else {
        loadGeoData().then(() => { if (geoData) renderGeoMap(regions); });
    }
}

/* ─── RANKING VIEW ─── */
function renderRankingView(regions) {
    if (!regions?.length) return;
    const sorted = [...regions].sort((a, b) => {
        if (rankSort === 'new')    return b.new - a.new;
        if (rankSort === 'closed') return b.closed - a.closed;
        if (rankSort === 'net')    return b.net - a.net;
        if (rankSort === 'rate')   return b.netRate - a.netRate;
        return 0;
    });
    const maxNew = Math.max(...sorted.map(r => r.new), 1);
    document.getElementById('rankBody').innerHTML = sorted.map((r, i) => {
        const pct    = Math.round((r.new / maxNew) * 100);
        const barC   = r.net > 0 ? '#34c759' : r.net < 0 ? '#ff3b30' : '#d1d5db';
        const netStr = r.net > 0 ? `+${r.net}` : String(r.net);
        const netCls = r.net > 0 ? 'rv-net-pos' : r.net < 0 ? 'rv-net-neg' : 'rv-net-0';
        return `<div class="rv-card" onclick="openDrilldown('${esc(r.region)}')">
            <div class="rv-card-top">
                <div class="rv-card-name">
                    <span class="rv-rank">#${i+1}</span>
                    <span class="rv-name">${esc(r.region)}</span>
                </div>
                <span class="rv-net ${netCls}">${netStr}</span>
            </div>
            <div class="rv-bar"><div class="rv-bar-fill" style="width:${pct}%;background:${barC}"></div></div>
            <div class="rv-nums">
                <div class="rv-num">
                    <span class="rv-num-l" style="color:#34c759">신규</span>
                    <span class="rv-num-v" style="color:#34c759">${r.new}</span>
                </div>
                <div class="rv-num">
                    <span class="rv-num-l" style="color:#ff3b30">폐업</span>
                    <span class="rv-num-v" style="color:#ff3b30">${r.closed}</span>
                </div>
                <div class="rv-num">
                    <span class="rv-num-l">성장률</span>
                    <span class="rv-num-v" style="color:#6b7280">${r.netRate}%</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

/* ─── OVERALL CHART (ranking view) ─── */
function renderOverallChart() {
    const monthlyAll = {};
    cachedSnaps.forEach(r => {
        if (!monthlyAll[r.month]) monthlyAll[r.month] = { new:0, closed:0 };
        monthlyAll[r.month].new    += r.new_count    || 0;
        monthlyAll[r.month].closed += r.closed_count || 0;

        .map(m => ({ month: m, new: monthlyAll[m]?.new||0, closed: monthlyAll[m]?.closed||0 }))
        .filter(m => m.new + m.closed > 0);

    renderChartOnCanvas('overallChart', filtered, null, overallChart, c => { overallChart = c; });

/* ─── SHARED CHART RENDERER ─── */
function renderChartOnCanvas(canvasId, monthly, highlightMonth, existingChart, setter) {
    if (existingChart) existingChart.destroy();
    const ctx = document.getElementById(canvasId)?.getContext('2d');
    if (!ctx) return;

    const labels     = monthly.map(m => m.month.slice(2));
    const newData    = monthly.map(m => m.new);
    const closedData = monthly.map(m => m.closed);
    const netData    = monthly.map(m => m.new - m.closed);

    const hlMonths = highlightMonth
        ? [highlightMonth, addMonths(highlightMonth,-1), addMonths(highlightMonth,-12)]
        : [];

    const mkBg = (i, hiA, loA, hiC, loC) => {
        if (!hlMonths.length) return hiC;
        const m = '20' + labels[i];
        if (m === highlightMonth) return hiC;
        if (hlMonths.includes(m)) return loC.replace(/[\d.]+\)$/, '0.45)');
        return loA;
    };

    const chart = new Chart(ctx, {
        data: {
            labels,
            datasets: [
                {
                    type:'bar', label:'신규', data:newData,
                    backgroundColor: newData.map((_,i)=>mkBg(i,'rgba(52,199,89,.08)','rgba(52,199,89,.07)','rgba(52,199,89,.8)','rgba(52,199,89,.8)')),
                    borderColor:'rgba(52,199,89,.6)', borderWidth:1, borderRadius:3, yAxisID:'y',
                },
                {
                    type:'bar', label:'폐업', data:closedData,
                    backgroundColor: closedData.map((_,i)=>mkBg(i,'rgba(255,59,48,.07)','rgba(255,59,48,.06)','rgba(255,59,48,.75)','rgba(255,59,48,.75)')),
                    borderColor:'rgba(255,59,48,.5)', borderWidth:1, borderRadius:3, yAxisID:'y',
                },
                {
                    type:'line', label:'순증', data:netData,
                    borderColor:'rgba(0,113,227,.8)', backgroundColor:'rgba(0,113,227,.06)',
                    borderWidth:2, pointRadius:2.5, fill:true, tension:0.35, yAxisID:'y',
                },
            ],
        },
        options: {
            responsive:true, maintainAspectRatio:false,
            plugins: {
                legend: { labels:{ color:'#64748b', font:{size:11}, boxWidth:10, padding:12 } },
                tooltip: {
                    backgroundColor:'#0f172a', borderColor:'#1e293b', borderWidth:0,
                    titleColor:'#f1f5f9', bodyColor:'#94a3b8', padding:10,
                    cornerRadius: 8,
                    callbacks: { label: c => ` ${c.dataset.label}: ${c.raw}건` },
                },
            },
            scales: {
                x: { ticks:{ color:'#94a3b8', font:{size:10} }, grid:{ color:'rgba(15,23,42,.04)' } },
                y: { ticks:{ color:'#94a3b8', font:{size:10}, stepSize:5 }, grid:{ color:'rgba(15,23,42,.04)' }, beginAtZero:true },
            },
        },
    });
    setter(chart);
}

/* ─── GEOJSON ─── */
const GEOJSON_URL = 'geojson/municipalities.json';
let geoData = null, geoLoadPromise = null;

async function loadGeoData() {
    if (geoData) return;
    if (geoLoadPromise) return geoLoadPromise;
    geoLoadPromise = (async () => {
        try {
            const r = await fetch(GEOJSON_URL);
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            geoData = await r.json();
        } catch(e) {
            console.warn('[discover] GeoJSON 실패:', e.message);
            geoData = null; geoLoadPromise = null;
        }
    })();
    return geoLoadPromise;
}

function ringCentroid(ring) {
    let sumLng = 0, sumLat = 0;
    ring.forEach(c => { sumLng += c[0]; sumLat += c[1]; });
    return [sumLng / ring.length, sumLat / ring.length];
}

// 시군구 choropleth — MapLibre GeoJSON 소스 + feature-state 동적 채색
function renderGeoMap(regions) {
    if (!map || !geoData) return;

    const regionMap = {};
    regions.forEach(r => { regionMap[r.region] = r; });

    // 1) 소스/레이어 1회 등록 + 이벤트 바인딩
    if (!geoLayerReady) {
        map.addSource('munis', { type: 'geojson', data: geoData, promoteId: 'name' });

        const tone = ['coalesce', ['feature-state', 'tone'], 'none'];
        const t    = ['coalesce', ['feature-state', 't'], 0];
        map.addLayer({
            id: 'muni-fill', type: 'fill', source: 'munis',
            paint: {
                'fill-color': [
                    'case',
                    ['==', tone, 'pos'], ['interpolate', ['linear'], t, 0, '#bbf7d0', 1, '#15803d'],
                    ['==', tone, 'neg'], ['interpolate', ['linear'], t, 0, '#fecaca', 1, '#b91c1c'],
                    ['==', tone, 'zero'], '#94a3b8',
                    'rgba(148,163,184,0.18)'
                ],
                'fill-opacity': ['case', ['==', tone, 'none'], 0.25, 0.72],
            },
        });
        map.addLayer({
            id: 'muni-line', type: 'line', source: 'munis',
            paint: { 'line-color': '#ffffff', 'line-width': 0.8, 'line-opacity': 0.45 },
        });

        map.on('mousemove', 'muni-fill', (e) => {
            const f = e.features[0]; if (!f) return;
            const st = f.state || {};
            if (st.tone == null || st.tone === 'none') {
                map.getCanvas().style.cursor = '';
                if (mapPopup) mapPopup.remove();
                return;
            }
            map.getCanvas().style.cursor = 'pointer';
            const netStr = st.net > 0 ? `+${st.net}` : String(st.net);
            const html = `<div class="map-tooltip"><b>${esc(f.properties.name)}</b><br>신규 ${st.nnew||0} · 폐업 ${st.closed||0} · 순증 ${netStr}</div>`;
            if (!mapPopup) mapPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, className: 'muni-popup', offset: 10 });
            mapPopup.setLngLat(e.lngLat).setHTML(html).addTo(map);
        });
        map.on('mouseleave', 'muni-fill', () => {
            map.getCanvas().style.cursor = '';
            if (mapPopup) mapPopup.remove();
        });
        map.on('click', 'muni-fill', (e) => {
            const f = e.features[0];
            if (f && f.state && f.state.tone && f.state.tone !== 'none') openDrilldown(f.properties.name);
        });

        geoLayerReady = true;
    }

    // 2) feature-state 초기화 후 갱신
    map.removeFeatureState({ source: 'munis' });
    geoData.features.forEach(f => {
        const name = f.properties.name;
        // 직접 매칭 → 없으면 prefix 매칭 (예: '고양시일산서구' → '고양시')
        let d = regionMap[name];
        if (!d) {
            const parent = Object.keys(regionMap).find(k => k.endsWith('시') && name.startsWith(k));
            if (parent) d = regionMap[parent];
        }
        if (!d) return;
        let toneVal = 'zero', tVal = 0;
        if (d.net > 0)      { toneVal = 'pos'; tVal = Math.min(d.net / 25, 1); }
        else if (d.net < 0) { toneVal = 'neg'; tVal = Math.min(Math.abs(d.net) / 25, 1); }
        map.setFeatureState(
            { source: 'munis', id: name },
            { tone: toneVal, t: tVal, nnew: d.new, closed: d.closed, net: d.net }
        );
    });
}

/* ─── DRILLDOWN ─── */
const API_BASE = 'https://maeilfs-sales.vercel.app';

async function openDrilldown(sigungu) {
    currentDrillRegion = sigungu;
    setText('drillTitle', sigungu);
    document.getElementById('drillSummary').innerHTML = '';
    document.getElementById('drillList').innerHTML =
        '<div class="state-msg"><div class="state-ico">⏳</div>불러오는 중...</div>';
    currentDrillTab = 'all';
    document.querySelectorAll('.dtab').forEach(b => b.classList.remove('active'));
    document.querySelector('.dtab:first-child')?.classList.add('active');

    openPanel();

    if (spChartOpen && trendChart) { trendChart.destroy(); trendChart = null; }

    try {
        const sido = sigunguSidoMap[sigungu] || viewSido || '경기도';
        const monthParam = selectedMonth ? `&month=${encodeURIComponent(selectedMonth)}` : '';
        const res  = await fetch(`${API_BASE}/api/market-stats?detail=true&sido=${encodeURIComponent(sido)}&sigungu=${encodeURIComponent(sigungu)}${monthParam}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || '조회 실패');

        currentDrillData = data.stores || [];

        document.getElementById('drillSummary').innerHTML = `
            <div class="ds-stat">
                <span class="ds-lbl">신규</span>
                <span class="ds-val" style="color:var(--color-success)">${data.summary.new}</span>
            </div>
            <div class="ds-stat">
                <span class="ds-lbl">폐업</span>
                <span class="ds-val" style="color:var(--color-danger)">${data.summary.closed}</span>
            </div>
            <div class="ds-stat">
                <span class="ds-lbl">100평+</span>
                <span class="ds-val" style="color:var(--color-warning)">${currentDrillData.filter(s=>s.pyeong>=100).length}</span>
            </div>`;

        renderDrillList('all');
        if (spChartOpen) setTimeout(() => renderRegionChart(sigungu), 50);

    } catch(e) {
        document.getElementById('drillList').innerHTML =
            `<div class="state-msg"><div class="state-ico">⚠️</div><span>데이터 없음<br><small>상권 통계 저장 후 이용 가능합니다</small></span></div>`;
    }
}

function switchDrillTab(btn, tab) {
    currentDrillTab = tab;
    document.querySelectorAll('.dtab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderDrillList(tab);
}

function renderDrillList(tab) {
    let stores = currentDrillData;
    if (tab === 'new')    stores = stores.filter(s => s.status === 'new');
    if (tab === 'closed') stores = stores.filter(s => s.status === 'closed');
    if (tab === 'big')    stores = stores.filter(s => (s.pyeong||0) >= 100);
    if (selectedCategory !== 'all') stores = stores.filter(s => matchCategory(s));

    if (!stores.length) {
        document.getElementById('drillList').innerHTML =
            '<div class="state-msg"><div class="state-ico">📭</div>해당 데이터 없음</div>';
        return;
    }
    document.getElementById('drillList').innerHTML = stores.map(s => {
        const isBig = (s.pyeong||0) >= 100;
        return `<div class="drill-row">
            <div class="drill-row-top">
                <span class="drill-name">${esc(s.name)}</span>
                ${isBig ? '<span class="big-badge">★ 대형</span>' : ''}
                <span class="drill-status ${s.status==='new'?'ds-new':'ds-closed'}">${s.status==='new'?'신규':'폐업'}</span>
            </div>
            <div class="drill-meta">
                ${s.category   ? `<span>${esc(s.category)}</span>` : ''}
                ${s.pyeong     ? `<span>${s.pyeong}평</span>` : ''}
                ${s.license_date ? `<span>${s.license_date}</span>` : ''}
            </div>
            ${s.address ? `<div class="drill-addr">${esc(s.address)}</div>` : ''}
        </div>`;
    }).join('');
}

/* ─── UTILS ─── */
function setText(id, txt) {
    const el = document.getElementById(id);
    if (el) el.textContent = txt;
}
function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
