<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터 관리 - FS MISO</title>
    <!-- 앱 파비콘 (커스텀 아이콘 적용) -->
    <link rel="icon" href="icons/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="common.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 36px 24px 80px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 4px;
        }

        .page-sub {
            font-size: 14px;
            color: #86868b;
            margin: 0 0 28px;
        }

        /* 카드 */
        .card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .card-header {
            padding: 14px 20px;
            border-bottom: 1px solid #f5f5f7;
            font-size: 12px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .card-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-body {
            padding: 20px;
        }

        /* 유형 선택 */
        .type-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .type-btn {
            padding: 14px 8px;
            border: 2px solid #e5e5ea;
            background: white;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            color: #1d1d1f;
            line-height: 1.4;
        }

        .type-btn .type-icon {
            display: block;
            font-size: 20px;
            margin-bottom: 6px;
        }

        .type-btn.active {
            border-color: #0071e3;
            background: #e8f2fd;
            color: #0071e3;
            font-weight: 600;
        }

        .type-btn:hover:not(.active) {
            border-color: #c7c7cc;
            background: #fafafa;
        }

        /* 드롭존 */
        .btn-template {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            background: #f5f5f7;
            color: #1d1d1f;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 14px;
        }

        .btn-template:hover {
            background: #e5e5ea;
        }

        .dropzone {
            border: 2px dashed #c7c7cc;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #86868b;
            font-size: 14px;
        }

        .dropzone .dz-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .dropzone .dz-hint {
            font-size: 12px;
            margin-top: 6px;
            color: #c7c7cc;
        }

        .dropzone:hover,
        .dropzone.drag {
            border-color: #0071e3;
            color: #0071e3;
            background: #f5f8ff;
        }

        .dropzone.has-file {
            border-color: #34c759;
            color: #1d1d1f;
            background: #f5fff8;
            border-style: solid;
        }

        /* 미리보기 */
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            display: block;
            overflow-x: auto;
        }

        .preview-table th {
            background: #f5f5f7;
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
            border-bottom: 1px solid #e5e5ea;
        }

        .preview-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #f5f5f7;
            white-space: nowrap;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 경고 / 성공 배너 */
        .banner {
            border-radius: 10px;
            padding: 13px 16px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .banner-warn {
            background: #fff8e1;
            border: 1px solid #ffd54f;
            color: #5d4037;
        }

        .banner-success {
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            color: #1b5e20;
        }

        .banner-error {
            background: #ffeaea;
            border: 1px solid #ffb3b3;
            color: #7f0000;
        }

        /* 업로드 버튼 */
        .btn-upload {
            width: 100%;
            padding: 14px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-upload:hover {
            background: #0077ed;
        }

        .btn-upload:disabled {
            background: #c7c7cc;
            cursor: default;
        }

        /* 업로드 섹션 레이아웃 */
        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 토스트 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1d1d1f;
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.3s ease;
            z-index: 999;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* 로딩 스피너 */
        .spinner-inline {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        .spinner-dark {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid #e5e5ea;
            border-top-color: #0071e3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* DB 현황 섹션 */
        .db-loading {
            text-align: center;
            padding: 28px;
            color: #86868b;
            font-size: 14px;
        }

        .db-empty {
            text-align: center;
            padding: 28px;
            color: #c7c7cc;
            font-size: 14px;
            line-height: 1.6;
        }

        .db-summary {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .badge {
            background: #f5f5f7;
            border: 1px solid #e5e5ea;
            color: #3d3d3f;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .btn-refresh {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            padding: 2px 4px;
            line-height: 1;
            opacity: 0.6;
            transition: opacity 0.15s;
        }

        .btn-refresh:hover {
            opacity: 1;
        }

        /* 편집 가능 테이블 */
        .editable-table input {
            border: none;
            background: transparent;
            font-size: 12px;
            padding: 2px 4px;
            width: 100%;
            outline: none;
            font-family: inherit;
            color: #1d1d1f;
            border-radius: 4px;
        }

        .editable-table input:focus {
            background: #eef5ff;
        }

        .editable-table td {
            padding: 4px 6px !important;
        }

        .btn-add-row {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            border: 2px dashed #c7c7cc;
            background: white;
            border-radius: 8px;
            color: #86868b;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-add-row:hover {
            border-color: #0071e3;
            color: #0071e3;
            background: #f5f8ff;
        }

        .btn-save-editable {
            margin-left: auto;
            padding: 7px 16px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-save-editable:hover {
            background: #0077ed;
        }

        .btn-save-editable:disabled {
            background: #c7c7cc;
            cursor: default;
        }

        .btn-delete-row {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 4px;
            font-size: 14px;
            opacity: 0.35;
            transition: opacity 0.15s;
            display: block;
            margin: 0 auto;
        }

        .btn-delete-row:hover {
            opacity: 1;
        }

        /* DB 테이블 스크롤 컨테이너 */
        .db-table-scroll {
            overflow-y: auto;
            overflow-x: auto;
            max-height: 400px;
            border-radius: 6px;
            border: 1px solid #e5e5ea;
        }

        .db-table-scroll .preview-table {
            display: table;
            /* block 오버라이드 해제 */
            overflow-x: unset;
            min-width: 100%;
            width: max-content;
            /* 컬럼 내용만큼 테이블 확장 → 컨테이너가 가로 스크롤 */
        }

        .db-table-scroll .preview-table td {
            max-width: none;
            /* 160px 제한 해제 */
        }

        .db-table-scroll .preview-table th {
            position: sticky;
            top: 0;
            z-index: 1;
        }

        @media (max-width: 600px) {
            .type-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ── 공공인허가 조회 패널 ── */
        .search-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 14px;
        }

        .search-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 130px;
        }

        .search-field label {
            font-size: 11px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .search-field input[type="date"] {
            padding: 8px 10px;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            color: #1d1d1f;
            outline: none;
            transition: border-color 0.15s;
        }

        .search-field input[type="date"]:focus {
            border-color: #0071e3;
        }

        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }

        .chip {
            padding: 5px 12px;
            border: 1px solid #e5e5ea;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: white;
            color: #3d3d3f;
            cursor: pointer;
            transition: all 0.15s;
        }

        .chip.active {
            background: #0071e3;
            border-color: #0071e3;
            color: white;
        }

        .chip:hover:not(.active) {
            border-color: #0071e3;
            color: #0071e3;
        }

        .search-divider {
            font-size: 11px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 8px;
        }

        .btn-search {
            padding: 9px 20px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }

        .btn-search:hover {
            background: #0077ed;
        }

        .btn-search:disabled {
            background: #c7c7cc;
            cursor: default;
        }

        .search-result-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            background: #34c759;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-download:hover {
            background: #2db54e;
        }

        .btn-download:disabled {
            background: #c7c7cc;
            cursor: default;
        }
    </style>
</head>

<body>
    <div id="nav-placeholder"></div>
    <script src="js/auth.js"></script>
    <script src="js/nav-component.js"></script>

    <div class="container">
        <h1 class="page-title">데이터 관리</h1>
        <p class="page-sub">지점 데이터를 확인하고 관리합니다. 담당자·거래처는 직접 편집, 인허가·방문일지는 엑셀 업로드로 교체합니다.</p>

        <div class="upload-section">

            <!-- 1. 유형 선택 -->
            <div class="card">
                <div class="card-header">1 — 업로드할 데이터 유형</div>
                <div class="card-body">
                    <div class="type-grid" id="typeGrid">
                        <button class="type-btn active" onclick="selectType('licenses')">
                            <span class="type-icon">📋</span>인허가 데이터
                        </button>
                        <button class="type-btn" onclick="selectType('accounts')">
                            <span class="type-icon">🏪</span>주요거래처
                        </button>
                        <button class="type-btn" onclick="selectType('visit_logs')">
                            <span class="type-icon">🗒️</span>방문일지
                        </button>
                        <button class="type-btn" id="recipeTypeBtn" onclick="selectType('recipes')"
                            style="display:none;">
                            <span class="type-icon">📖</span>레시피 데이터
                        </button>
                        <button class="type-btn" onclick="selectType('managers')">
                            <span class="type-icon">👥</span>담당자관리
                        </button>
                    </div>
                </div>
            </div>

            <!-- 2. 현재 DB 현황 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-header-row">
                        <span>2 — 현재 DB 현황 (<span id="dbCurrentCount">—</span>)</span>
                        <button class="btn-refresh" onclick="loadCurrentData()" title="새로고침">🔄</button>
                    </div>
                </div>
                <div class="card-body" id="dbCurrentBody">
                    <div class="db-loading"><span class="spinner-dark"></span>데이터 로딩 중...</div>
                </div>
            </div>

            <!-- 2-1. 공공인허가 데이터 조회 (인허가 탭 전용) -->
            <div class="card" id="publicSearchCard">
                <div class="card-header">공공인허가 데이터 조회 (data.go.kr)</div>
                <div class="card-body">

                    <!-- 날짜 -->
                    <div class="search-divider">조회 기간</div>
                    <div class="search-row">
                        <div class="search-field">
                            <label>시작일</label>
                            <input type="date" id="srchStartDate">
                        </div>
                        <div class="search-field">
                            <label>종료일</label>
                            <input type="date" id="srchEndDate">
                        </div>
                        <button class="btn-search" id="btnSearch" onclick="searchPublicLicense()">조회</button>
                    </div>

                    <!-- 업종 -->
                    <div class="search-divider">업종</div>
                    <div class="chip-group" id="typeChips">
                        <span class="chip active" data-code="general_restaurants">일반음식점</span>
                        <span class="chip active" data-code="rest_cafes">휴게음식점</span>
                        <span class="chip active" data-code="bakeries">제과점영업</span>
                    </div>

                    <!-- 지역 -->
                    <div class="search-divider">지역</div>
                    <div class="chip-group" id="regionChips">
                        <span class="chip active" data-region="의정부">의정부</span>
                        <span class="chip active" data-region="양주">양주</span>
                        <span class="chip active" data-region="동두천">동두천</span>
                        <span class="chip active" data-region="포천">포천</span>
                        <span class="chip active" data-region="연천">연천</span>
                        <span class="chip active" data-region="파주">파주</span>
                        <span class="chip active" data-region="고양">고양</span>
                        <span class="chip active" data-region="남양주">남양주</span>
                        <span class="chip active" data-region="구리">구리</span>
                        <span class="chip active" data-region="가평">가평</span>
                        <span class="chip active" data-region="김포">김포</span>
                        <span class="chip active" data-region="부천">부천</span>
                        <span class="chip active" data-region="인천">인천</span>
                    </div>

                    <!-- 결과 -->
                    <div id="searchResultArea"></div>
                </div>
            </div>

            <!-- 3. 템플릿 + 파일 업로드 -->
            <div class="card" id="uploadCard">
                <div class="card-header">3 — 엑셀 업로드 (대용량 일괄 교체용)</div>
                <div class="card-body">
                    <button class="btn-template" onclick="downloadTemplate()">
                        ⬇️ 템플릿 다운로드 (.xlsx)
                    </button>
                    <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()"
                        ondragover="event.preventDefault(); this.classList.add('drag')"
                        ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event)">
                        <div class="dz-icon">📁</div>
                        <div id="dropzoneText">파일을 여기에 드롭하거나 클릭하세요</div>
                        <div class="dz-hint">.xlsx, .xls 파일 지원</div>
                    </div>
                    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none"
                        onchange="handleFile(event)">
                </div>
            </div>

            <!-- 4. 미리보기 + 확인 버튼 -->
            <div id="previewSection" style="display:none;">
                <div class="card" style="margin-bottom:12px;">
                    <div class="card-header">4 — 데이터 미리보기 (상위 5행)</div>
                    <div class="card-body" style="overflow-x:auto;">
                        <div id="previewContent"></div>
                    </div>
                </div>
                <div id="uploadBanner" class="banner banner-warn"></div>
                <button class="btn-upload" id="btnUpload" onclick="confirmUpload()">
                    업로드 확인 (기존 데이터 교체)
                </button>
            </div>

        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ── 데이터 유형 설정 ──────────────────────────────────
        const UPLOAD_TYPES = {
            licenses: {
                label: '인허가 데이터', table: 'licenses',
                editable: false, scrollAll: true,
                previewColumns: [
                    { key: 'permit_date', label: '영업 허가일' },
                    { key: 'business_name', label: '사업장명' },
                    { key: 'trade_status', label: '거래여부(기입예정)' },
                    { key: 'business_type', label: '업태구분명' },
                    { key: 'area', label: '평형' },
                    { key: 'road_address', label: '도로명전체주소' },
                    { key: 'address1', label: '주소1' },
                    { key: 'address2', label: '주소2' },
                    { key: 'address3', label: '주소3' },
                    { key: 'priority', label: '순위' },
                    { key: 'manager', label: '담당자' },
                    { key: 'appsheet_date', label: '앱시트등록일' },
                    { key: 'lat', label: '위도' },
                    { key: 'lng', label: '경도' },
                    { key: 'milk_type', label: '사용우유' }
                ],
                templateHeaders: ['NO', '영업 허가일', '사업장명', '거래여부(기입예정)', '업태구분명', '평형', '도로명전체주소', '주소1', '주소2', '주소3', '순위', '담당자', '앱시트등록일', '위도', '경도', '사용우유'],

        let selectedType = 'licenses';
        let parsedData = null;

        // ── DB 현황 상태 ──────────────────────────────────────
        let currentDbData = [];
        let currentBusinessUnit = null;
        let previewPage = 0;
        const PREVIEW_PAGE_SIZE = 5;

        // ── 페이지 초기화 ────────────────────────────────────
        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
            setupLogoutButton();
            // 레시피 버튼: 관리자만 표시
            if (sessionStorage.getItem('fs_admin_access') === 'true') {
                const recipeBtn = document.getElementById('recipeTypeBtn');
                if (recipeBtn) recipeBtn.style.display = '';
            }
            // onAuthStateChange를 통해 세션 복원 시점에 데이터 로드
            // (INITIAL_SESSION: 기존 세션 복원, SIGNED_IN: 신규 로그인)
            if (client) {
                const { data: { subscription } } = client.auth.onAuthStateChange((event) => {
                    if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
                        currentBusinessUnit = null;
                        loadCurrentData();
                        subscription.unsubscribe();
                    }
                });
            } else {
                loadCurrentData();
            }
        });

        // ── 유형 선택 ────────────────────────────────────────
        function selectType(type) {
            selectedType = type;
            parsedData = null;
            currentDbData = [];

            document.querySelectorAll('.type-btn').forEach((btn, i) => {
                const keys = Object.keys(UPLOAD_TYPES);
                btn.classList.toggle('active', keys[i] === type);
            });

            const fi = document.getElementById('fileInput');
            if (fi) fi.value = '';
            resetDropzone();
            document.getElementById('previewSection').style.display = 'none';

            previewPage = 0;
            const cfg = UPLOAD_TYPES[type];

            // 공공인허가 조회 패널: 인허가 탭일 때만 표시
            const searchCard = document.getElementById('publicSearchCard');
            if (searchCard) searchCard.style.display = type === 'licenses' ? '' : 'none';

            // 레시피는 CLI로만 관리 — 업로드 카드 숨김
            const uploadCard = document.getElementById('uploadCard');
            if (uploadCard) uploadCard.style.display = cfg.noBusinessUnit ? 'none' : '';
            loadCurrentData();
        }

        function changePage(page) {
            previewPage = page;
            loadCurrentData();
        }

        function resetDropzone() {
            const dz = document.getElementById('dropzone');
            dz.classList.remove('has-file', 'drag');
            document.getElementById('dropzoneText').textContent = '파일을 여기에 드롭하거나 클릭하세요';
        }

        // ── business_unit 취득 ───────────────────────────────
        async function getBusinessUnit() {
            if (currentBusinessUnit) return currentBusinessUnit;
            if (!client) return null;
            try {
                // getSession()은 localStorage에서 즉시 읽음 (네트워크 불필요)
                const { data: { session } } = await client.auth.getSession();
                const bu = session?.user?.user_metadata?.business_unit ?? null;
                if (bu) { currentBusinessUnit = bu; return bu; }
                // 세션이 없으면 getUser()로 재확인 (네트워크 요청)
                const { data: userData } = await client.auth.getUser();
                const bu2 = userData?.user?.user_metadata?.business_unit ?? null;
                if (bu2) currentBusinessUnit = bu2;
                return bu2;
            } catch (e) { return null; }
        }

        // ── HTML 속성 이스케이프 ─────────────────────────────
        function escapeAttr(val) {
            return String(val ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ── 현재 DB 데이터 로드 ──────────────────────────────
        async function loadCurrentData() {
            const dbBody = document.getElementById('dbCurrentBody');
            const dbCount = document.getElementById('dbCurrentCount');
            const cfg = UPLOAD_TYPES[selectedType];

            dbBody.innerHTML = '<div class="db-loading"><span class="spinner-dark"></span>데이터 로딩 중...</div>';
            dbCount.textContent = '—';

            const businessUnit = cfg.noBusinessUnit ? null : await getBusinessUnit();
            if (!cfg.noBusinessUnit && !businessUnit) {
                dbBody.innerHTML = '<div class="db-empty">소속 정보를 불러오지 못했습니다.<br><button onclick="loadCurrentData()" style="margin-top:8px;padding:6px 14px;background:#0071e3;color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px;">🔄 다시 시도</button></div>';
                dbCount.textContent = '—';
                return;
            }

            try {
                // 전체 건수 조회
                let countQuery = client.from(cfg.table).select('*', { count: 'exact' }).limit(1);
                if (businessUnit) countQuery = countQuery.eq('business_unit', businessUnit);
                const { count: totalCount, error: countErr } = await countQuery;

                if (countErr) throw countErr;

                dbCount.textContent = `${totalCount ?? 0}건`;

                if (!totalCount) {
                    dbBody.innerHTML = '<div class="db-empty">아직 업로드된 데이터가 없습니다.</div>';
                    return;
                }

                // 실제 데이터 조회
                let query = client.from(cfg.table).select('*');
                if (businessUnit) query = query.eq('business_unit', businessUnit);

                if (cfg.table === 'visit_logs') {
                    query = query.order('visit_date', { ascending: false, nullsFirst: false });
                } else if (cfg.table === 'licenses') {
                    query = query.order('permit_date', { ascending: false, nullsFirst: false });
                } else if (cfg.table === 'recipes') {
                    query = query.order('name', { ascending: true });
                }

                if (cfg.editable) {
                    // 편집 테이블: 전체 로드 (최대 1,000건 — managers/accounts는 소량)
                    query = query.limit(1000);
                } else {
                    // 읽기 전용: 5건 미리보기 + 페이지네이션
                    const from = previewPage * PREVIEW_PAGE_SIZE;
                    const to = from + PREVIEW_PAGE_SIZE - 1;
                    query = query.range(from, to);
                }

                const { data, error } = await query;
                if (error) throw error;

                if (cfg.editable) {
                    currentDbData = data || [];
                    renderEditableTable(currentDbData, cfg, totalCount);
                } else {
                    renderReadonlyTable(data || [], cfg, totalCount, previewPage);
                }

            } catch (e) {
                dbBody.innerHTML = `<div class="banner banner-error" style="margin:0;">❌ 데이터 로드 실패: ${e.message}</div>`;
                dbCount.textContent = '오류';
            }
        }

        // ── 셀 값 포맷 (배열·불리언 처리) ───────────────────
        function formatCellValue(val) {
            if (Array.isArray(val)) return val.join(', ');
            if (typeof val === 'boolean') return val ? '✓' : '';
            return String(val ?? '');
        }

        // ── 읽기 전용 테이블 렌더링 ─────────────────────────
        function renderReadonlyTable(data, cfg, total) {
            const dbBody = document.getElementById('dbCurrentBody');
            const cols = cfg.previewColumns;

            let summaryHtml = '';
            if (cfg.table === 'licenses') {
                const lastUpload = data[0]?.uploaded_at
                    ? new Date(data[0].uploaded_at).toLocaleDateString('ko-KR')
                    : '-';
                summaryHtml = `
                    <span class="badge">총 ${total}건</span>
                    <span class="badge">마지막 업로드: ${lastUpload}</span>`;
            } else if (cfg.table === 'visit_logs') {
                const latestSeq = data[0]?.seq_no ?? '-';
                const latestDate = data[0]?.visit_date ?? '-';
                summaryHtml = `
                    <span class="badge">총 ${total}건</span>
                    <span class="badge">최신 seq_no: ${latestSeq}</span>
                    <span class="badge">최근 방문일: ${latestDate}</span>`;
            } else if (cfg.table === 'recipes') {
                summaryHtml = `
                    <span class="badge">총 ${total}건</span>
                    <span class="badge">레시피 데이터 (CLI 스크립트로 관리)</span>`;
            }

            const headerHtml = cols.map(c => `<th>${c.label}</th>`).join('');
            const rowsHtml = data.map(row => `
                <tr>${cols.map(c => {
                const v = escapeAttr(formatCellValue(row[c.key]));
                return `<td title="${v}">${v}</td>`;
            }).join('')}</tr>
            `).join('');

            const totalPages = Math.ceil(total / PREVIEW_PAGE_SIZE);
            const startRow = previewPage * PREVIEW_PAGE_SIZE + 1;
            const endRow = Math.min(startRow + PREVIEW_PAGE_SIZE - 1, total);
            const paginationHtml = totalPages > 1 ? `
                    <div style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#86868b;">
                        <button onclick="changePage(${previewPage - 1})" ${previewPage === 0 ? 'disabled' : ''}
                            style="padding:3px 10px;border:1px solid #d1d1d6;border-radius:5px;background:#fff;cursor:pointer;font-size:12px;">◀ 이전</button>
                        <span>${startRow}–${endRow} / 총 ${total}건 (${previewPage + 1}/${totalPages}페이지)</span>
                        <button onclick="changePage(${previewPage + 1})" ${previewPage >= totalPages - 1 ? 'disabled' : ''}
                            style="padding:3px 10px;border:1px solid #d1d1d6;border-radius:5px;background:#fff;cursor:pointer;font-size:12px;">다음 ▶</button>
                    </div>` : `<p style="font-size:12px;color:#86868b;margin:4px 0 0;">총 ${total}건</p>`;

            dbBody.innerHTML = `
                <div class="db-summary">${summaryHtml}</div>
                <div class="db-table-scroll">
                    <table class="preview-table">
                        <thead><tr>${headerHtml}</tr></thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>
                ${paginationHtml}`;
        }

        // ── 편집 가능 테이블 렌더링 ─────────────────────────
        function renderEditableTable(data, cfg, total) {
            const dbBody = document.getElementById('dbCurrentBody');
            const cols = cfg.columns;

            const headerHtml = cols.map(c => `<th>${c.label}</th>`).join('') + '<th style="width:36px"></th>';
            const rowsHtml = data.map((row, i) => `
                <tr>
                    ${cols.map(c => `<td><input type="text" value="${escapeAttr(row[c.key])}" data-key="${c.key}"></td>`).join('')}
                    <td><button class="btn-delete-row" onclick="deleteRow(${i})" title="삭제">🗑️</button></td>
                </tr>`).join('');

            dbBody.innerHTML = `
                <div class="db-summary">
                    <span class="badge">${total ?? data.length}건</span>
                    <button class="btn-save-editable" id="btnSaveEditable" onclick="saveEditableData()">변경사항 저장</button>
                </div>
                <div class="db-table-scroll" style="margin-top:10px;max-height:220px;">
                    <table class="preview-table editable-table">
                        <thead><tr>${headerHtml}</tr></thead>
                        <tbody id="editableTableBody">${rowsHtml}</tbody>
                    </table>
                </div>
                <button class="btn-add-row" onclick="addRow()">+ 행 추가</button>`;
        }

        // ── 편집 테이블 DOM → currentDbData 동기화 ──────────
        function collectEditableValues() {
            const rows = document.querySelectorAll('#editableTableBody tr');
            rows.forEach((tr, i) => {
                if (!currentDbData[i]) return;
                tr.querySelectorAll('input[data-key]').forEach(input => {
                    currentDbData[i][input.dataset.key] = input.value || null;
                });
            });
        }

        function deleteRow(i) {
            collectEditableValues();
            currentDbData.splice(i, 1);
            renderEditableTable(currentDbData, UPLOAD_TYPES[selectedType], currentDbData.length);
        }

        function addRow() {
            collectEditableValues();
            const cfg = UPLOAD_TYPES[selectedType];
            const emptyRow = {};
            cfg.columns.forEach(c => { emptyRow[c.key] = ''; });
            currentDbData.push(emptyRow);
            renderEditableTable(currentDbData, cfg, currentDbData.length);
            setTimeout(() => {
                const tbody = document.getElementById('editableTableBody');
                if (tbody?.lastElementChild) {
                    tbody.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    const firstInput = tbody.lastElementChild.querySelector('input');
                    if (firstInput) firstInput.focus();
                }
            }, 50);
        }

        // ── 편집 데이터 저장 (managers, accounts) ───────────
        async function saveEditableData() {
            collectEditableValues();
            const cfg = UPLOAD_TYPES[selectedType];
            const businessUnit = await getBusinessUnit();

            if (!businessUnit) {
                showToast('❌ 소속 정보가 없습니다.');
                return;
            }

            const toSave = currentDbData.filter(row =>
                cfg.columns.some(c => row[c.key] && String(row[c.key]).trim())
            );

            if (toSave.length === 0) {
                showToast('저장할 데이터가 없습니다.');
                return;
            }

            if (!confirm(`${cfg.label} 데이터를 ${toSave.length}건으로 저장합니다.\n기존 데이터가 모두 교체됩니다. 계속하시겠습니까?`)) return;

            const btn = document.getElementById('btnSaveEditable');
            if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }

            try {
                const { data: userData, error: authErr } = await client.auth.getUser();
                if (authErr || !userData?.user) throw new Error('로그인 정보를 가져올 수 없습니다.');

                const user = userData.user;
                const now = new Date().toISOString();

                // 1. 기존 데이터 삭제
                const { error: delErr } = await client.from(cfg.table).delete().eq('business_unit', businessUnit);
                if (delErr) throw new Error('기존 데이터 삭제 실패: ' + delErr.message);

                // 2. INSERT
                const rows = toSave.map(row => ({
                    ...row,
                    business_unit: businessUnit,
                    uploaded_by: user.id,
                    uploaded_at: now
                }));

                const BATCH = 500;
                for (let i = 0; i < rows.length; i += BATCH) {
                    const { error } = await client.from(cfg.table).insert(rows.slice(i, i + BATCH));
                    if (error) throw new Error(`저장 실패 (${i + 1}~${Math.min(i + BATCH, rows.length)}번째): ` + error.message);
                }

                showToast(`✅ ${cfg.label} ${toSave.length}건 저장 완료!`);
                previewPage = 0;
                await loadCurrentData();

            } catch (e) {
                showToast('❌ ' + e.message);
                if (btn) { btn.disabled = false; btn.textContent = '변경사항 저장'; }
            }
        }

        // ── 템플릿 다운로드 ──────────────────────────────────
        function downloadTemplate() {
            const cfg = UPLOAD_TYPES[selectedType];
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet([cfg.templateHeaders, cfg.sampleRow]);
            ws['!cols'] = cfg.templateHeaders.map(h => ({ wch: Math.max(h.length + 2, 14) }));
            XLSX.utils.book_append_sheet(wb, ws, cfg.label);
            XLSX.writeFile(wb, `FS_MISO_템플릿_${cfg.label}.xlsx`);
        }

        // ── 파일 처리 ────────────────────────────────────────
        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('dropzone').classList.remove('drag');
            if (e.dataTransfer.files.length > 0) processFile(e.dataTransfer.files[0]);
        }

        function handleFile(e) {
            if (e.target.files.length > 0) processFile(e.target.files[0]);
        }

        function processFile(file) {
            const cfg = UPLOAD_TYPES[selectedType];
            const reader = new FileReader();

            reader.onload = function (ev) {
                try {
                    const wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, dateNF: 'YYYY-MM-DD' });

                    if (raw.length < 2) {
                        showToast('데이터가 없습니다. 헤더 외 1행 이상 필요합니다.');
                        return;
                    }

                    const fileHeaders = raw[0].map(h => String(h || '').trim());
                    const rows = raw.slice(1).filter(row => row.some(c => c !== '' && c != null));

                    parsedData = rows.map(row => {
                        const obj = {};
                        fileHeaders.forEach((header, i) => {
                            const dbCol = cfg.columnMap[header];
                            if (!dbCol) return;
                            let val = row[i] != null ? String(row[i]).trim() : '';

                            if (dbCol === 'is_branch_manager') {
                                val = ['Y', 'y', 'TRUE', 'true', '1', '예', '지점장'].includes(val);
                            } else if (cfg.numericFields.includes(dbCol)) {
                                val = val ? parseFloat(val) : null;
                            } else if (val === '') {
                                val = null;
                            }
                            obj[dbCol] = val;
                        });
                        return obj;
                    }).filter(row => row[cfg.requiredCol]);

                    if (parsedData.length === 0) {
                        showToast('유효한 데이터가 없습니다. 필수 컬럼을 확인해주세요.');
                        return;
                    }

                    const dz = document.getElementById('dropzone');
                    dz.classList.add('has-file');
                    document.getElementById('dropzoneText').innerHTML =
                        `<strong>${file.name}</strong> — ${parsedData.length}건 인식`;

                    const previewRows = parsedData.slice(0, 5);
                    const dbCols = Object.keys(previewRows[0]);

                    document.getElementById('previewContent').innerHTML = `
                        <p style="font-size:13px;color:#86868b;margin:0 0 12px;">
                            총 <strong style="color:#1d1d1f">${parsedData.length}건</strong> 인식됨. 상위 5행:
                        </p>
                        <table class="preview-table">
                            <thead><tr>${dbCols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
                            <tbody>
                                ${previewRows.map(row =>
                        `<tr>${dbCols.map(c =>
                            `<td title="${escapeAttr(row[c])}">${row[c] ?? ''}</td>`
                        ).join('')}</tr>`
                    ).join('')}
                            </tbody>
                        </table>`;

                    const isAppend = cfg.mode === 'append';
                    document.getElementById('uploadBanner').className = 'banner banner-warn';
                    document.getElementById('uploadBanner').innerHTML = isAppend
                        ? `➕ <strong>${cfg.label}</strong> 기존 데이터에 <strong>${parsedData.length}건</strong>을 추가합니다. (seq_no 중복 시 덮어씀)`
                        : `⚠️ 기존 <strong>${cfg.label}</strong> 데이터가 모두 삭제되고 새 데이터 <strong>${parsedData.length}건</strong>으로 교체됩니다.`;
                    document.getElementById('btnUpload').textContent = isAppend
                        ? `업로드 확인 (${parsedData.length}건 추가/갱신)`
                        : `업로드 확인 (${parsedData.length}건 교체)`;
                    document.getElementById('previewSection').style.display = 'block';

                } catch (err) {
                    showToast('파일 파싱 오류: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ── 업로드 실행 ──────────────────────────────────────
        async function confirmUpload() {
            if (!parsedData || parsedData.length === 0) return;
            const cfg = UPLOAD_TYPES[selectedType];

            if (!confirm(`${cfg.label} 기존 데이터를 삭제하고\n새 데이터 ${parsedData.length}건을 업로드합니다.\n계속하시겠습니까?`)) return;

            const btn = document.getElementById('btnUpload');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-inline"></span>업로드 중...';

            try {
                const { data: userData, error: authErr } = await client.auth.getUser();
                if (authErr || !userData?.user) throw new Error('로그인 정보를 가져올 수 없습니다.');

                const user = userData.user;
                const businessUnit = user.user_metadata?.business_unit;
                if (!businessUnit) throw new Error('소속(business_unit)이 설정되지 않은 계정입니다. 관리자에게 문의하세요.');

                const isAppend = cfg.mode === 'append';

                if (!isAppend) {
                    const { error: delErr } = await client.from(cfg.table)
                        .delete()
                        .eq('business_unit', businessUnit);
                    if (delErr) throw new Error('기존 데이터 삭제 실패: ' + delErr.message);
                }

                const BATCH = 500;
                const now = new Date().toISOString();
                let inserted = 0;

                // ── 방문일지: seq_no 자동 채번 (DB 최대값 기준으로 이어서 부여) ──
                let seqStart = 1;
                if (cfg.table === 'visit_logs') {
                    const { data: seqData } = await client
                        .from('visit_logs')
                        .select('seq_no')
                        .eq('business_unit', businessUnit)
                        .order('seq_no', { ascending: false })
                        .limit(1);
                    const maxSeq = seqData?.[0]?.seq_no;
                    seqStart = maxSeq ? (parseInt(maxSeq, 10) || 0) + 1 : 1;
                }

                for (let i = 0; i < parsedData.length; i += BATCH) {
                    const batch = parsedData.slice(i, i + BATCH).map((row, idx) => {
                        const base = { ...row, business_unit: businessUnit };
                        if (cfg.table === 'visit_logs') {
                            // 엑셀 NO 번호 무시 → DB 기준 자동 채번
                            base.seq_no = String(seqStart + i + idx);
                            base.created_by = user.id;
                            base.created_at = now;
                        } else {
                            base.uploaded_by = user.id;
                            base.uploaded_at = now;
                        }
                        return base;
                    });

                    let opErr;
                    if (isAppend && cfg.conflictKey) {
                        // 충돌 키: visit_date,manager,business_name 기준 upsert
                        const { error } = await client.from(cfg.table)
                            .upsert(batch, { onConflict: cfg.conflictKey });
                        opErr = error;
                    } else {
                        // 충돌 키 없는 append(인허가) 또는 replace: 단순 INSERT
                        const { error } = await client.from(cfg.table).insert(batch);
                        opErr = error;
                    }
                    if (opErr) throw new Error(`업로드 실패 (${i + 1}~${i + batch.length}번째): ` + opErr.message);

                    inserted += batch.length;
                    btn.innerHTML = `<span class="spinner-inline"></span>${inserted}/${parsedData.length}건 처리 중...`;
                }

                const doneMsg = isAppend
                    ? `✅ <strong>${cfg.label}</strong> ${inserted}건 추가/갱신 완료!`
                    : `✅ <strong>${cfg.label}</strong> ${inserted}건 업로드 완료!`;
                document.getElementById('uploadBanner').className = 'banner banner-success';
                document.getElementById('uploadBanner').innerHTML = doneMsg;
                btn.disabled = false;
                btn.textContent = '업로드 완료 ✅';
                parsedData = null;
                showToast(doneMsg.replace(/<[^>]+>/g, ''));

                // DB 현황 자동 갱신
                previewPage = 0;
                await loadCurrentData();

            } catch (e) {
                btn.disabled = false;
                btn.textContent = `업로드 확인 (${parsedData?.length ?? 0}건 교체)`;
                document.getElementById('uploadBanner').className = 'banner banner-error';
                document.getElementById('uploadBanner').innerHTML = '❌ ' + e.message;
                showToast('❌ ' + e.message);
            }
        }

        // ── 공공인허가 조회 ───────────────────────────────────

        // 칩 토글
        document.addEventListener('click', e => {
            if (e.target.classList.contains('chip')) {
                e.target.classList.toggle('active');
            }
        });

        // 날짜 기본값: 이번 주 월~일
        (function initSearchDates() {
            const today = new Date();
            const day = today.getDay();
            const mon = new Date(today);
            mon.setDate(today.getDate() - (day === 0 ? 6 : day - 1));
            const sun = new Date(mon);
            sun.setDate(mon.getDate() + 6);
            const fmt = d => d.toISOString().split('T')[0];
            document.getElementById('srchStartDate').value = fmt(mon);
            document.getElementById('srchEndDate').value = fmt(sun);
        })();

        let srchResults = [];
        let srchSelected = new Set();

        async function searchPublicLicense() {
            const startDate = document.getElementById('srchStartDate').value.replace(/-/g, '');
            const endDate = document.getElementById('srchEndDate').value.replace(/-/g, '');
            if (!startDate || !endDate) { showToast('조회 기간을 선택해주세요.'); return; }

            const types = [...document.querySelectorAll('#typeChips .chip.active')].map(c => c.dataset.code).join(',');
            const regions = [...document.querySelectorAll('#regionChips .chip.active')].map(c => c.dataset.region).join(',');
            if (!types) { showToast('업종을 하나 이상 선택해주세요.'); return; }
            if (!regions) { showToast('지역을 하나 이상 선택해주세요.'); return; }

            const btn = document.getElementById('btnSearch');
            btn.disabled = true;
            btn.textContent = '조회 중...';
            document.getElementById('searchResultArea').innerHTML =
                '<div class="db-loading"><span class="spinner-dark"></span>공공데이터 조회 중...</div>';

            try {
                const params = new URLSearchParams({ types, regions, startDate, endDate });
                const res = await fetch(`/api/public-license?${params}`);
                const data = await res.json();

                if (!data.success) throw new Error(data.error || '조회 실패');

                srchResults = data.items;
                srchSelected = new Set();
                renderSearchResults();

            } catch (e) {
                document.getElementById('searchResultArea').innerHTML =
                    `<div class="banner banner-error" style="margin:0;">❌ ${e.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '조회';
            }
        }

        function renderSearchResults() {
            const area = document.getElementById('searchResultArea');
            if (!srchResults.length) {
                area.innerHTML = '<div class="db-empty">해당 기간·지역의 인허가 데이터가 없습니다.</div>';
                return;
            }

            const allChecked = srchSelected.size === srchResults.length;
            const headerHtml = ['영업 허가일', '사업장명', '업태구분명', '평형', '도로명전체주소'].map(h => `<th>${h}</th>`).join('');
            const rowsHtml = srchResults.map((item, i) => {
                const chk = srchSelected.has(i) ? 'checked' : '';
                return `<tr>
                    <td><input type="checkbox" ${chk} onchange="toggleSrchItem(${i}, this.checked)" style="cursor:pointer;"></td>
                    <td title="${escapeAttr(item.permit_date)}">${item.permit_date || '-'}</td>
                    <td title="${escapeAttr(item.business_name)}">${escapeAttr(item.business_name)}</td>
                    <td>${escapeAttr(item.business_type)}</td>
                    <td>${item.area || '-'}</td>
                    <td title="${escapeAttr(item.road_address)}">${escapeAttr(item.road_address) || '-'}</td>
                </tr>`;
            }).join('');

            area.innerHTML = `
                <div class="search-result-bar">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="badge">총 ${srchResults.length}건</span>
                        ${srchSelected.size > 0 ? `<span class="badge" style="background:#e8f2fd;border-color:#0071e3;color:#0071e3;">${srchSelected.size}건 선택</span>` : ''}
                    </div>
                    <button class="btn-download" onclick="downloadSrchResults()" ${srchSelected.size === 0 ? 'disabled' : ''}>
                        ⬇️ 선택 항목 엑셀 다운로드 (${srchSelected.size}건)
                    </button>
                </div>
                <div class="db-table-scroll">
                    <table class="preview-table">
                        <thead>
                            <tr>
                                <th style="width:36px;">
                                    <input type="checkbox" ${allChecked ? 'checked' : ''} onchange="toggleAllSrch(this.checked)" style="cursor:pointer;">
                                </th>
                                ${headerHtml}
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>`;
        }

        function toggleSrchItem(i, checked) {
            checked ? srchSelected.add(i) : srchSelected.delete(i);
            renderSearchResults();
        }

        function toggleAllSrch(checked) {
            srchSelected = checked ? new Set(srchResults.map((_, i) => i)) : new Set();
            renderSearchResults();
        }

        function downloadSrchResults() {
            if (!srchSelected.size) return;
            const selected = [...srchSelected].map(i => srchResults[i]);
            const headers = ['NO', '영업 허가일', '사업장명', '거래여부(기입예정)', '업태구분명', '평형', '도로명전체주소', '주소1', '주소2', '주소3', '순위', '담당자', '앱시트등록일', '위도', '경도', '사용우유'];
            const rows = selected.map((item, idx) => [
                idx + 1,
                item.permit_date || '',
                item.business_name || '',
                '인허가',
                item.business_type || '',
                item.area || '',
                item.road_address || '',
                item.address1 || '',
                item.address2 || '',
                item.address3 || '',
                '1',
                '',
                '',
                item.lat || '',
                item.lng || '',
                ''
            ]);

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
            ws['!cols'] = headers.map(h => ({ wch: Math.max(h.length + 2, 14) }));
            XLSX.utils.book_append_sheet(wb, ws, '인허가데이터');

            const start = document.getElementById('srchStartDate').value;
            const end = document.getElementById('srchEndDate').value;
            XLSX.writeFile(wb, `인허가_공공데이터_${start}_${end}.xlsx`);
            showToast(`✅ ${selected.length}건 다운로드 완료`);
        }

        // ── 토스트 ───────────────────────────────────────────
        let toastTimer;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
        }
    </script>
</body>
