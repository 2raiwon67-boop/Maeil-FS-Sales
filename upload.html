<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터 관리 - FS MISO</title>
    <!-- 앱 파비콘 (커스텀 아이콘 적용) -->
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="common.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 36px 24px 80px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 4px;
        }

        .page-sub {
            font-size: 14px;
            color: #86868b;
            margin: 0 0 28px;
        }

        /* 카드 */
        .card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .card-header {
            padding: 14px 20px;
            border-bottom: 1px solid #f5f5f7;
            font-size: 12px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .card-body {
            padding: 20px;
        }

        /* 유형 선택 */
        .type-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .type-btn {
            padding: 14px 8px;
            border: 2px solid #e5e5ea;
            background: white;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            color: #1d1d1f;
            line-height: 1.4;
        }

        .type-btn .type-icon {
            display: block;
            font-size: 20px;
            margin-bottom: 6px;
        }

        .type-btn.active {
            border-color: #0071e3;
            background: #e8f2fd;
            color: #0071e3;
            font-weight: 600;
        }

        .type-btn:hover:not(.active) {
            border-color: #c7c7cc;
            background: #fafafa;
        }

        /* 드롭존 */
        .btn-template {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            background: #f5f5f7;
            color: #1d1d1f;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 14px;
        }

        .btn-template:hover {
            background: #e5e5ea;
        }

        .dropzone {
            border: 2px dashed #c7c7cc;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #86868b;
            font-size: 14px;
        }

        .dropzone .dz-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .dropzone .dz-hint {
            font-size: 12px;
            margin-top: 6px;
            color: #c7c7cc;
        }

        .dropzone:hover,
        .dropzone.drag {
            border-color: #0071e3;
            color: #0071e3;
            background: #f5f8ff;
        }

        .dropzone.has-file {
            border-color: #34c759;
            color: #1d1d1f;
            background: #f5fff8;
            border-style: solid;
        }

        /* 미리보기 */
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            display: block;
            overflow-x: auto;
        }

        .preview-table th {
            background: #f5f5f7;
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
            border-bottom: 1px solid #e5e5ea;
        }

        .preview-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #f5f5f7;
            white-space: nowrap;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 경고 / 성공 배너 */
        .banner {
            border-radius: 10px;
            padding: 13px 16px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .banner-warn {
            background: #fff8e1;
            border: 1px solid #ffd54f;
            color: #5d4037;
        }

        .banner-success {
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            color: #1b5e20;
        }

        .banner-error {
            background: #ffeaea;
            border: 1px solid #ffb3b3;
            color: #7f0000;
        }

        /* 업로드 버튼 */
        .btn-upload {
            width: 100%;
            padding: 14px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-upload:hover {
            background: #0077ed;
        }

        .btn-upload:disabled {
            background: #c7c7cc;
            cursor: default;
        }

        /* 업로드 섹션 레이아웃 */
        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 토스트 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1d1d1f;
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.3s ease;
            z-index: 999;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* 로딩 스피너 */
        .spinner-inline {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .type-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div id="nav-placeholder"></div>
    <script src="auth.js"></script>
    <script src="nav-component.js"></script>

    <div class="container">
        <h1 class="page-title">데이터 관리</h1>
        <p class="page-sub">지점 데이터를 업로드합니다. 업로드하면 기존 데이터가 새 데이터로 교체됩니다.</p>

        <div class="upload-section">

            <!-- 1. 유형 선택 -->
            <div class="card">
                <div class="card-header">1 — 업로드할 데이터 유형</div>
                <div class="card-body">
                    <div class="type-grid" id="typeGrid">
                        <button class="type-btn active" onclick="selectType('licenses')">
                            <span class="type-icon">📋</span>인허가 데이터
                        </button>
                        <button class="type-btn" onclick="selectType('accounts')">
                            <span class="type-icon">🏪</span>주요거래처
                        </button>
                        <button class="type-btn" onclick="selectType('visit_logs')">
                            <span class="type-icon">🗒️</span>방문일지
                        </button>
                        <button class="type-btn" onclick="selectType('managers')">
                            <span class="type-icon">👥</span>담당자관리
                        </button>
                    </div>
                </div>
            </div>

            <!-- 2. 템플릿 + 파일 업로드 -->
            <div class="card">
                <div class="card-header">2 — 템플릿 다운로드 후 파일 업로드</div>
                <div class="card-body">
                    <button class="btn-template" onclick="downloadTemplate()">
                        ⬇️ 템플릿 다운로드 (.xlsx)
                    </button>
                    <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()"
                        ondragover="event.preventDefault(); this.classList.add('drag')"
                        ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event)">
                        <div class="dz-icon">📁</div>
                        <div id="dropzoneText">파일을 여기에 드롭하거나 클릭하세요</div>
                        <div class="dz-hint">.xlsx, .xls 파일 지원</div>
                    </div>
                    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none"
                        onchange="handleFile(event)">
                </div>
            </div>

            <!-- 3. 미리보기 + 확인 버튼 -->
            <div id="previewSection" style="display:none;">
                <div class="card" style="margin-bottom:12px;">
                    <div class="card-header">3 — 데이터 미리보기 (상위 5행)</div>
                    <div class="card-body" style="overflow-x:auto;">
                        <div id="previewContent"></div>
                    </div>
                </div>
                <div id="uploadBanner" class="banner banner-warn"></div>
                <button class="btn-upload" id="btnUpload" onclick="confirmUpload()">
                    업로드 확인 (기존 데이터 교체)
                </button>
            </div>

        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ── 데이터 유형 설정 (Google Sheets 실제 헤더와 1:1 일치) ──
        const UPLOAD_TYPES = {
            licenses: {
                label: '인허가 데이터', table: 'licenses',
                // Google Sheets '인허가데이터' 시트 헤더와 동일 (내보내기 후 바로 업로드 가능)
                templateHeaders: ['NO', '영업 허가일', '사업장명', '거래여부(기입예정)', '업태구분명', '평형', '도로명전체주소', '주소1', '주소2', '주소3', '순위', '담당자', '앱시트등록일', '위도', '경도', '사용우유'],
                sampleRow: ['1', '2024-01-15', '테스트카페', '인허가', '커피', '30', '경기도 포천시 테스트로 1', '경기', '포천시', '신북면', '1', '홍길동', '2024-01-20', '37.89', '127.20', '서울우유'],
                columnMap: {
                    // NO 는 무시 (자동 생성 값)
                    '영업 허가일': 'permit_date',
                    '사업장명': 'business_name',
                    '거래여부(기입예정)': 'trade_status',
                    '업태구분명': 'business_type',
                    '평형': 'area',
                    '도로명전체주소': 'road_address',
                    '주소1': 'address1',
                    '주소2': 'address2',
                    '주소3': 'address3',
                    '순위': 'priority',
                    '담당자': 'manager',
                    '앱시트등록일': 'appsheet_date',
                    '위도': 'lat',
                    '경도': 'lng',
                    '사용우유': 'milk_type'
                },
                requiredCol: 'business_name',
                dateFields: ['permit_date', 'appsheet_date'],
                numericFields: ['lat', 'lng']
            },
            accounts: {
                label: '주요거래처', table: 'accounts',
                // Google Sheets '주요거래처' 시트 헤더와 동일 (내보내기 후 바로 업로드 가능)
                templateHeaders: ['NO', '사업부', '사업장', '지점', '사업장코드명', '고객레벨2', '거래처ID', '거래처명', '거래상태', '주요거래처 여부', '담당자명', '주소', '도/광역시', '시/군/구', '면/동'],
                sampleRow: ['1', '경기북부', '포천', '포천지점', 'S001', 'A', 'C001', '홍길동마트', '거래', 'Y', '홍길동', '경기도 포천시 테스트로 2', '경기도', '포천시', '신북면'],
                columnMap: {
                    // 저장: NO, 사업장코드명, 고객레벨2, 거래처ID, 거래처명, 거래상태, 담당자명, 주소
                    // 무시: 사업부, 사업장, 지점, 주요거래처 여부, 도/광역시, 시/군/구, 면/동
                    'NO': 'seq_no',
                    '사업장코드명': 'store_code',
                    '고객레벨2': 'customer_level',
                    '거래처ID': 'account_id',
                    '거래처명': 'business_name',
                    '거래상태': 'trade_status',
                    '담당자명': 'manager_name',
                    '주소': 'address'
                },
                requiredCol: 'business_name', dateFields: [], numericFields: []
            },
            visit_logs: {
                label: '방문일지', table: 'visit_logs',
                // Google Sheets '방문일지' 시트 헤더와 동일 (내보내기 후 바로 업로드 가능)
                templateHeaders: ['NO', '사업부', '사업장', '지점', '사업장코드', '작성일', '작성자', '방문처(대리점 코드)', '방문처(대리점)', '방문처(거래처 코드)', '방문처(거래처)', '내용', 'AI_핵심태그'],
                sampleRow: ['1', '경기북부', '포천', '포천지점', 'S001', '2024-03-01', '홍길동', 'D001', '포천대리점', 'C001', '테스트카페', '방문 후 가격 협의 진행', '가격'],
                columnMap: {
                    // 저장: NO, 사업장코드, 작성일, 작성자, 방문처(대리점 코드), 방문처(대리점), 방문처(거래처 코드), 방문처(거래처), 내용
                    // 무시: 사업부, 사업장, 지점, AI_핵심태그
                    'NO': 'seq_no',
                    '사업장코드': 'store_code',
                    '작성일': 'visit_date',
                    '작성자': 'manager',
                    '방문처(대리점 코드)': 'dealer_code',
                    '방문처(대리점)': 'dealer_name',
                    '방문처(거래처 코드)': 'account_code',
                    '방문처(거래처)': 'business_name',
                    '내용': 'content'
                },
                requiredCol: 'business_name', dateFields: ['visit_date'], numericFields: []
            },
            managers: {
                label: '담당자관리', table: 'managers',
                // Google Sheets '담당자관리' 시트 헤더와 동일
                templateHeaders: ['지역', '담당자', '이메일'],
                sampleRow: ['포천', '홍길동', 'hong@example.com'],
                columnMap: {
                    '지역': 'region',
                    '담당자': 'manager_name',   // 실제 시트는 '담당자' (담당자명 아님)
                    '이메일': 'email'
                },
                requiredCol: 'manager_name', dateFields: [], numericFields: []
            }
        };

        let selectedType = 'licenses';
        let parsedData = null;

        // ── 페이지 초기화 ────────────────────────────────────
        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
            setupLogoutButton();
        });

        // ── 유형 선택 ────────────────────────────────────────
        function selectType(type) {
            selectedType = type;
            parsedData = null;

            document.querySelectorAll('.type-btn').forEach((btn, i) => {
                const keys = Object.keys(UPLOAD_TYPES);
                btn.classList.toggle('active', keys[i] === type);
            });

            // 파일 초기화
            const fi = document.getElementById('fileInput');
            if (fi) fi.value = '';
            resetDropzone();
            document.getElementById('previewSection').style.display = 'none';
        }

        function resetDropzone() {
            const dz = document.getElementById('dropzone');
            dz.classList.remove('has-file', 'drag');
            document.getElementById('dropzoneText').textContent = '파일을 여기에 드롭하거나 클릭하세요';
        }

        // ── 템플릿 다운로드 ──────────────────────────────────
        function downloadTemplate() {
            const cfg = UPLOAD_TYPES[selectedType];
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet([cfg.templateHeaders, cfg.sampleRow]);
            ws['!cols'] = cfg.templateHeaders.map(h => ({ wch: Math.max(h.length + 2, 14) }));
            XLSX.utils.book_append_sheet(wb, ws, cfg.label);
            XLSX.writeFile(wb, `FS_MISO_템플릿_${cfg.label}.xlsx`);
        }

        // ── 파일 처리 ────────────────────────────────────────
        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('dropzone').classList.remove('drag');
            if (e.dataTransfer.files.length > 0) processFile(e.dataTransfer.files[0]);
        }

        function handleFile(e) {
            if (e.target.files.length > 0) processFile(e.target.files[0]);
        }

        function processFile(file) {
            const cfg = UPLOAD_TYPES[selectedType];
            const reader = new FileReader();

            reader.onload = function (ev) {
                try {
                    const wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, dateNF: 'YYYY-MM-DD' });

                    if (raw.length < 2) {
                        showToast('데이터가 없습니다. 헤더 외 1행 이상 필요합니다.');
                        return;
                    }

                    const fileHeaders = raw[0].map(h => String(h || '').trim());
                    const rows = raw.slice(1).filter(row => row.some(c => c !== '' && c != null));

                    // 헤더 → DB 컬럼 매핑
                    parsedData = rows.map(row => {
                        const obj = {};
                        fileHeaders.forEach((header, i) => {
                            const dbCol = cfg.columnMap[header];
                            if (!dbCol) return;
                            let val = row[i] != null ? String(row[i]).trim() : '';

                            if (dbCol === 'is_branch_manager') {
                                val = ['Y', 'y', 'TRUE', 'true', '1', '예', '지점장'].includes(val);
                            } else if (cfg.numericFields.includes(dbCol)) {
                                val = val ? parseFloat(val) : null;
                            } else if (val === '') {
                                val = null;
                            }
                            obj[dbCol] = val;
                        });
                        return obj;
                    }).filter(row => row[cfg.requiredCol]);

                    if (parsedData.length === 0) {
                        showToast('유효한 데이터가 없습니다. 필수 컬럼을 확인해주세요.');
                        return;
                    }

                    // 드롭존 업데이트
                    const dz = document.getElementById('dropzone');
                    dz.classList.add('has-file');
                    document.getElementById('dropzoneText').innerHTML =
                        `<strong>${file.name}</strong> — ${parsedData.length}건 인식`;

                    // 미리보기
                    const previewRows = parsedData.slice(0, 5);
                    const dbCols = Object.keys(previewRows[0]);

                    document.getElementById('previewContent').innerHTML = `
                        <p style="font-size:13px;color:#86868b;margin:0 0 12px;">
                            총 <strong style="color:#1d1d1f">${parsedData.length}건</strong> 인식됨. 상위 5행:
                        </p>
                        <table class="preview-table">
                            <thead><tr>${dbCols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
                            <tbody>
                                ${previewRows.map(row =>
                        `<tr>${dbCols.map(c =>
                            `<td title="${row[c] ?? ''}">${row[c] ?? ''}</td>`
                        ).join('')}</tr>`
                    ).join('')}
                            </tbody>
                        </table>`;

                    document.getElementById('uploadBanner').className = 'banner banner-warn';
                    document.getElementById('uploadBanner').innerHTML =
                        `⚠️ 기존 <strong>${cfg.label}</strong> 데이터가 모두 삭제되고 새 데이터 <strong>${parsedData.length}건</strong>으로 교체됩니다.`;
                    document.getElementById('btnUpload').textContent =
                        `업로드 확인 (${parsedData.length}건 교체)`;
                    document.getElementById('previewSection').style.display = 'block';

                } catch (err) {
                    showToast('파일 파싱 오류: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ── 업로드 실행 ──────────────────────────────────────
        async function confirmUpload() {
            if (!parsedData || parsedData.length === 0) return;
            const cfg = UPLOAD_TYPES[selectedType];

            if (!confirm(`${cfg.label} 기존 데이터를 삭제하고\n새 데이터 ${parsedData.length}건을 업로드합니다.\n계속하시겠습니까?`)) return;

            const btn = document.getElementById('btnUpload');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-inline"></span>업로드 중...';

            try {
                const { data: userData, error: authErr } = await client.auth.getUser();
                if (authErr || !userData?.user) throw new Error('로그인 정보를 가져올 수 없습니다.');

                const user = userData.user;
                const businessUnit = user.user_metadata?.business_unit;
                if (!businessUnit) throw new Error('소속(business_unit)이 설정되지 않은 계정입니다. 관리자에게 문의하세요.');

                // 1. 기존 데이터 삭제 (RLS: 자신이 업로드한 것만 삭제됨)
                const { error: delErr } = await client.from(cfg.table)
                    .delete()
                    .eq('business_unit', businessUnit);
                if (delErr) throw new Error('기존 데이터 삭제 실패: ' + delErr.message);

                // 2. 500건씩 분할 INSERT
                const BATCH = 500;
                const now = new Date().toISOString();
                let inserted = 0;

                for (let i = 0; i < parsedData.length; i += BATCH) {
                    const batch = parsedData.slice(i, i + BATCH).map(row => {
                        const base = { ...row, business_unit: businessUnit };
                        if (cfg.table === 'visit_logs') {
                            base.created_by = user.id;
                            base.created_at = now;
                        } else {
                            base.uploaded_by = user.id;
                            base.uploaded_at = now;
                        }
                        return base;
                    });

                    const { error: insErr } = await client.from(cfg.table).insert(batch);
                    if (insErr) throw new Error(`INSERT 실패 (${i + 1}~${i + batch.length}번째): ` + insErr.message);

                    inserted += batch.length;
                    btn.innerHTML = `<span class="spinner-inline"></span>${inserted}/${parsedData.length}건 처리 중...`;
                }

                // 성공
                document.getElementById('uploadBanner').className = 'banner banner-success';
                document.getElementById('uploadBanner').innerHTML =
                    `✅ <strong>${cfg.label}</strong> ${inserted}건 업로드 완료!`;
                btn.disabled = false;
                btn.textContent = '업로드 완료 ✅';
                parsedData = null;
                showToast(`✅ ${cfg.label} ${inserted}건 업로드 완료!`);

            } catch (e) {
                btn.disabled = false;
                btn.textContent = `업로드 확인 (${parsedData?.length ?? 0}건 교체)`;
                document.getElementById('uploadBanner').className = 'banner banner-error';
                document.getElementById('uploadBanner').innerHTML = '❌ ' + e.message;
                showToast('❌ ' + e.message);
            }
        }

        // ── 토스트 ───────────────────────────────────────────
        let toastTimer;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
        }
    </script>
</body>
