<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin">
    <title>경기북부 FS 인허가 대시보드</title>

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <!-- 카카오 지도 API -->
    <script type="text/javascript"
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=178d3ee35f67ded1f5d2411aa3cee010&libraries=services&autoload=false"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Proj4js (좌표계 변환) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #1d1d1f;
            overflow: hidden;
            height: 100vh;
        }

        /* =============== 상단 네비게이션 =============== */
        .nav-bar {
            background: #1d1d1f;
            padding: 0 24px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
        }

        .nav-menu {
            display: flex;
            gap: 24px;
        }

        .nav-link {
            color: #f5f5f7;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: #424245;
        }

        .nav-link.active {
            background: #0071e3;
        }

        .nav-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 980px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #0071e3;
            color: white;
        }

        .btn-primary:hover {
            background: #0077ed;
        }

        .btn-secondary {
            background: #424245;
            color: white;
        }

        .btn-secondary:hover {
            background: #515154;
        }

        /* =============== 메인 레이아웃 =============== */
        .main-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            height: calc(100vh - 52px);
        }

        /* =============== 좌측 사이드바 =============== */
        .sidebar {
            background: #f5f5f7;
            overflow-y: auto;
            padding: 20px;
            border-right: 1px solid #d2d2d7;
        }

        .sidebar-title {
            font-size: 22px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-header {
            font-size: 12px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        /* =============== 방문 현황 카드 (5개 가로) =============== */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 6px;
        }

        .status-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 10px 6px;
            text-align: center;
            border: 1px solid #e8e8ed;
        }

        .status-card.deal {
            border-left: 3px solid #0071e3;
        }

        .status-card.no-deal {
            border-left: 3px solid #1d1d1f;
        }

        .status-card.licensed {
            border-left: 3px solid #34c759;
        }

        .status-card.drop {
            border-left: 3px solid #ff3b30;
        }

        .status-card.construction {
            border-left: 3px solid #ff9500;
        }

        .status-card .label {
            font-size: 10px;
            font-weight: 500;
            color: #86868b;
            margin-bottom: 2px;
        }

        .status-card .value {
            font-size: 20px;
            font-weight: 700;
            color: #1d1d1f;
        }

        /* =============== 순위별 현황 =============== */
        .priority-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .priority-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            border: 1px solid #e8e8ed;
            position: relative;
        }

        .priority-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            border-radius: 10px 0 0 10px;
        }

        .priority-card.rank1::before {
            background: #ff3b30;
        }

        .priority-card.rank2::before {
            background: #ff9500;
        }

        .priority-card.rank3::before {
            background: #86868b;
        }

        .priority-card .label {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .priority-card.rank1 .label {
            color: #ff3b30;
        }

        .priority-card.rank2 .label {
            color: #ff9500;
        }

        .priority-card.rank3 .label {
            color: #86868b;
        }

        .priority-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #1d1d1f;
        }

        /* =============== 드롭다운 섹션 =============== */
        .dropdown-card {
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e8e8ed;
            margin-bottom: 8px;
        }

        .dropdown-header {
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dropdown-header:hover {
            background: #f5f5f7;
        }

        .dropdown-header h4 {
            font-size: 14px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .dropdown-arrow {
            font-size: 12px;
            color: #86868b;
            transition: transform 0.2s;
        }

        .dropdown-card.open .dropdown-arrow {
            transform: rotate(180deg);
        }

        .dropdown-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .dropdown-card.open .dropdown-content {
            max-height: 300px;
        }

        .dropdown-list {
            padding: 0 14px 12px;
        }

        .dropdown-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            background: #f5f5f7;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .dropdown-item:last-child {
            margin-bottom: 0;
        }

        .dropdown-item-name {
            color: #1d1d1f;
            font-weight: 500;
        }

        .dropdown-item-count {
            color: #0071e3;
            font-weight: 600;
        }

        /* =============== 주간 추이 차트 =============== */
        .chart-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid #e8e8ed;
        }

        .chart-wrapper {
            height: 120px;
        }

        /* =============== 우측 지도 영역 =============== */
        .map-area {
            position: relative;
            background: #f5f5f7;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 14px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .filter-label {
            font-size: 11px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .filter-buttons {
            display: flex;
            gap: 6px;
        }

        .filter-btn {
            padding: 6px 14px;
            border: 1px solid #d2d2d7;
            background: white;
            border-radius: 980px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #f5f5f7;
        }

        .filter-btn.active {
            background: #0071e3;
            color: white;
            border-color: #0071e3;
        }

        /* =============== 모달 =============== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 28px;
            border-radius: 16px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .close-btn {
            font-size: 24px;
            cursor: pointer;
            color: #86868b;
            transition: color 0.2s;
            line-height: 1;
        }

        .close-btn:hover {
            color: #1d1d1f;
        }

        .upload-zone {
            border: 2px dashed #d2d2d7;
            border-radius: 12px;
            padding: 36px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: #0071e3;
            background: #f0f7ff;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 15px;
            font-weight: 500;
            color: #1d1d1f;
        }

        .upload-hint {
            font-size: 13px;
            color: #86868b;
            margin-top: 4px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f5f5f7;
            border-top: 3px solid #0071e3;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin: 14px 0;
            font-size: 13px;
            font-weight: 500;
        }

        .alert-success {
            background: #d1f2eb;
            color: #0a6847;
        }

        .alert-error {
            background: #fce4e4;
            color: #b91c1c;
        }

        .alert-info {
            background: #e0f2fe;
            color: #0369a1;
        }

        input[type="file"] {
            display: none;
        }

        .btn-full {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
        }

        /* =============== 스크롤바 스타일 =============== */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #d2d2d7;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <!-- 상단 네비게이션 -->
    <nav class="nav-bar">
        <div class="nav-logo">📊 경기북부 FS 통합 대시보드</div>
        <div class="nav-menu">
            <a href="index.html" class="nav-link active">인허가</a>
            <a href="방문일지.html" class="nav-link">방문일지</a>
        </div>
        <div class="nav-actions">
            <button class="btn btn-secondary" onclick="openUploadModal()">📤 RAW 업로드</button>
            <button class="btn btn-primary" onclick="openFinalUploadModal()">최종본 업로드</button>
        </div>
    </nav>

    <!-- 메인 레이아웃 -->
    <div class="main-layout">
        <!-- 좌측 사이드바 -->
        <div class="sidebar">
            <h1 class="sidebar-title">인허가 현황</h1>

            <!-- 방문 현황 -->
            <div class="section">
                <div class="section-header">📍 방문 현황</div>
                <div class="status-grid">
                    <div class="status-card deal">
                        <div class="label">거래</div>
                        <div class="value" id="dealCount">0</div>
                    </div>
                    <div class="status-card no-deal">
                        <div class="label">미거래</div>
                        <div class="value" id="noDealCount">0</div>
                    </div>
                    <div class="status-card licensed">
                        <div class="label">인허가</div>
                        <div class="value" id="licensedCount">0</div>
                    </div>
                    <div class="status-card drop">
                        <div class="label">DROP</div>
                        <div class="value" id="dropCount">0</div>
                    </div>
                    <div class="status-card construction">
                        <div class="label">공사중</div>
                        <div class="value" id="constructionCount">0</div>
                    </div>
                </div>
            </div>

            <!-- 순위별 현황 -->
            <div class="section">
                <div class="section-header">🎯 순위별 현황</div>
                <div class="priority-grid">
                    <div class="priority-card rank1">
                        <div class="label">1순위</div>
                        <div class="value" id="rank1Count">0</div>
                    </div>
                    <div class="priority-card rank2">
                        <div class="label">2순위</div>
                        <div class="value" id="rank2Count">0</div>
                    </div>
                    <div class="priority-card rank3">
                        <div class="label">3순위</div>
                        <div class="value" id="rank3Count">0</div>
                    </div>
                </div>
            </div>

            <!-- 담당자별 현황 -->
            <div class="section">
                <div class="dropdown-card" id="managerDropdown">
                    <div class="dropdown-header" onclick="toggleDropdown('managerDropdown')">
                        <h4>👥 담당자별 현황</h4>
                        <span class="dropdown-arrow">▼</span>
                    </div>
                    <div class="dropdown-content">
                        <div class="dropdown-list" id="managerList"></div>
                    </div>
                </div>

                <div class="dropdown-card" id="regionDropdown">
                    <div class="dropdown-header" onclick="toggleDropdown('regionDropdown')">
                        <h4>🗺️ 지역별 현황</h4>
                        <span class="dropdown-arrow">▼</span>
                    </div>
                    <div class="dropdown-content">
                        <div class="dropdown-list" id="regionList"></div>
                    </div>
                </div>
            </div>

            <!-- 주간 추이 -->
            <div class="section">
                <div class="section-header">📈 주간 추이</div>
                <div class="chart-card">
                    <div class="chart-wrapper">
                        <canvas id="weeklyChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 우측 지도 -->
        <div class="map-area">
            <div id="map"></div>
            <div class="map-controls">
                <div class="search-box" style="margin-bottom: 12px; display: flex; gap: 6px;">
                    <input type="text" id="mapSearchInput" placeholder="장소 또는 상호명 검색"
                        style="flex: 1; padding: 8px; border: 1px solid #d2d2d7; border-radius: 6px; font-size: 13px;"
                        onkeypress="if(event.key === 'Enter') searchMapPlaces()">
                    <button onclick="searchMapPlaces()"
                        style="padding: 8px 12px; background: #0071e3; color: white; border: none; border-radius: 6px; cursor: pointer;">🔍</button>
                </div>
                <div class="filter-label">순위 필터</div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">전체</button>
                    <button class="filter-btn" data-filter="1" onclick="setFilter('1')">1순위</button>
                    <button class="filter-btn" data-filter="2" onclick="setFilter('2')">2순위</button>
                    <button class="filter-btn" data-filter="3" onclick="setFilter('3')">3순위</button>
                </div>
                <button onclick="resetFilters()"
                    style="margin-top: 10px; width: 100%; padding: 8px; background: #000; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">🔄
                    모든 필터 초기화</button>
            </div>
        </div>
    </div>

    <!-- RAW 파일 업로드 모달 -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>RAW 파일 업로드</h2>
                <span class="close-btn" onclick="closeUploadModal()">&times;</span>
            </div>
            <div class="upload-zone" id="uploadZone1">
                <div class="upload-icon">📁</div>
                <p class="upload-text">클릭하거나 드래그앤드롭</p>
                <p class="upload-hint">Excel 파일 (.xlsx, .xls)</p>
            </div>
            <input type="file" id="fileInput1" accept=".xlsx,.xls" multiple>
            <div class="loading" id="loading1">
                <div class="spinner"></div>
                <p>데이터 가공 중...</p>
            </div>
            <div id="alert1"></div>
            <button class="btn btn-primary btn-full" id="downloadBtn" disabled>
                📥 1차 가공본 다운로드
            </button>
        </div>
    </div>

    <!-- 최종본 업로드 모달 -->
    <div class="modal" id="finalUploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>최종본 업로드</h2>
                <span class="close-btn" onclick="closeFinalUploadModal()">&times;</span>
            </div>
            <div class="upload-zone" id="uploadZone2">
                <div class="upload-icon">📂</div>
                <p class="upload-text">수정 완료한 파일 업로드</p>
                <p class="upload-hint">Excel 파일 (.xlsx, .xls)</p>
            </div>
            <input type="file" id="fileInput2" accept=".xlsx,.xls">
            <div class="loading" id="loading2">
                <div class="spinner"></div>
                <p>Google Sheets 업로드 중...</p>
            </div>
            <div id="alert2"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 설정
        // ============================================================

        const SHEETS_CONFIG = {
            apiKey: 'AQ.Ab8RN6KwmiUwl-nKqJB8CQwfZ3qeZ8BjPJPtxSY92uaviUVpow',
            spreadsheetId: '1JnLQVr3JGqZPyvQ6bf8TSl0dNN6_oI05YH7d9zSgsKI',
            range: '인허가데이터!A:P'
        };

        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxEXZ-22BYHC-98YhmjCOBS741-rGNKwk-IXj0Zoe6Gi1bmBCc74lf5z-zvOG5VQpOn/exec';

        // ============================================================
        // 전역 변수
        // ============================================================

        let processedData = [];
        let allData = [];
        let kakaoMap;
        let markers = [];
        let currentFilter = 'all';
        let currentRegion = null;
        let currentManager = null;

        // ============================================================
        // 초기화
        // ============================================================

        window.onload = function () {
            console.log('페이지 로드 완료');
            setupUploadZones();
            setupFilters();

            if (typeof kakao !== 'undefined' && kakao.maps) {
                kakao.maps.load(function () {
                    console.log('카카오 지도 SDK 로드 완료');
                    initKakaoMap();
                });
            } else {
                console.error('카카오 지도 SDK를 불러올 수 없습니다.');
            }

            loadDataFromSheets();
            initChart();
        };

        // ============================================================
        // 드롭다운
        // ============================================================


        function toggleDropdown(id) {
            document.getElementById(id).classList.toggle('open');
        }

        // ============================================================
        // 필터 관리
        // ============================================================

        function setFilter(filter) {
            currentFilter = filter;

            // 버튼 활성화 상태 변경
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-filter') === filter) {
                    btn.classList.add('active');
                }
            });

            // 대시보드 및 지도 업데이트
            updateDashboard();
            updateMap();
        }

        function setRegionFilter(region) {
            // 같은 지역 클릭 시 필터 해제
            if (currentRegion === region) {
                currentRegion = null;
            } else {
                currentRegion = region;
            }

            updateDashboard();
            updateMap();
        }

        function setManagerFilter(manager) {
            // 같은 담당자 클릭 시 필터 해제
            if (currentManager === manager) {
                currentManager = null;
            } else {
                currentManager = manager;
            }

            updateDashboard();
            updateMap();
        }

        function resetFilters() {
            currentFilter = 'all';
            currentRegion = null;
            currentManager = null;

            // 순위 필터 버튼 초기화

        function updateChart() {
            if (!weeklyChart) return;

            // 한국 표준시 기준 오늘 날짜
            const today = new Date();
            const kstOffset = 9 * 60; // KST = UTC+9
            const kstToday = new Date(today.getTime() + (kstOffset - today.getTimezoneOffset()) * 60000);

            // 이번 주 월요일 계산
            const dayOfWeek = kstToday.getDay(); // 0=일요일, 1=월요일, ...
            const daysFromMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // 일요일이면 6일 전, 아니면 (요일-1)
            const monday = new Date(kstToday);
            monday.setDate(kstToday.getDate() - daysFromMonday);
            monday.setHours(0, 0, 0, 0);

            // 주간 데이터 집계 (월~일)
            const weekData = [0, 0, 0, 0, 0, 0, 0];

            allData.forEach(item => {
                if (item['순위'] !== '1') return; // 1순위만

                const regDate = item['앱시트등록일'];
                if (!regDate) return;

                try {
                    const date = new Date(regDate);

                    // 이번 주 데이터인지 확인
                    if (date >= monday && date <= kstToday) {
                        const dayIndex = date.getDay(); // 0=일요일
                        const chartIndex = dayIndex === 0 ? 6 : dayIndex - 1; // 월=0, 화=1, ..., 일=6
                        weekData[chartIndex]++;
                    }
                } catch (e) {
                    // 날짜 파싱 실패 시 무시
                }
            });

            // 차트 업데이트
            weeklyChart.data.datasets[0].data = weekData;
            weeklyChart.update();

            console.log('주간 추이 업데이트:', weekData);
        }

        async function loadDataFromSheets() {
            try {
                // 공개 Google Sheets를 CSV로 가져오기 (API 키 불필요)
                const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEETS_CONFIG.spreadsheetId}/export?format=csv&gid=0`;

                const response = await fetch(csvUrl);
                if (!response.ok) {
                    console.warn('Google Sheets 로드 실패 - 대시보드는 업로드 후 표시됩니다');
                    return;
                }

                const csvText = await response.text();

                // CSV 파싱 (쉼표가 포함된 필드 처리)
                function parseCSV(text) {
                    const lines = [];
                    let currentLine = [];
                    let currentField = '';
                    let inQuotes = false;

                    for (let i = 0; i < text.length; i++) {
                        const char = text[i];
                        const nextChar = text[i + 1];

                        if (char === '"') {
                            if (inQuotes && nextChar === '"') {
                                currentField += '"';
                                i++; // Skip next quote
                            } else {
                                inQuotes = !inQuotes;
                            }
                        } else if (char === ',' && !inQuotes) {
                            currentLine.push(currentField.trim());
                            currentField = '';
                        } else if ((char === '\n' || char === '\r') && !inQuotes) {
                            if (currentField || currentLine.length > 0) {
                                currentLine.push(currentField.trim());
                                if (currentLine.some(f => f)) { // Skip empty lines
                                    lines.push(currentLine);
                                }
                                currentLine = [];
                                currentField = '';
                            }
                            if (char === '\r' && nextChar === '\n') {
                                i++; // Skip \n in \r\n
                            }
                        } else {
                            currentField += char;
                        }
                    }

                    // Add last field and line
                    if (currentField || currentLine.length > 0) {
                        currentLine.push(currentField.trim());
                        if (currentLine.some(f => f)) {
                            lines.push(currentLine);
                        }
                    }

                    return lines;
                }

                const lines = parseCSV(csvText);

                if (lines.length > 1) {
                    const headers = lines[0];
                    allData = lines.slice(1)
                        .map(values => {
                            const obj = {};
                            headers.forEach((h, i) => {
                                obj[h] = values[i] || '';
                            });
                            return obj;
                        })
                        .filter(row => {
                            // 유효한 데이터만 필터링
                            const manager = row['담당자'] || '';
                            const name = row['사업장명'] || '';

                            // 담당자가 날짜 형식이거나 헤더 텍스트인 경우 제외
                            if (manager.match(/^\d{4}-\d{2}-\d{2}$/)) return false;
                            if (manager.includes('업로드일')) return false;
                            if (manager.includes('등록일')) return false;

                            // 사업장명이 비어있으면 제외
                            if (!name || name.trim() === '') return false;

                            return true;
                        });

                    console.log(`Google Sheets 로드 완료: ${allData.length}건`);
                    updateDashboard();
                    updateMap();
                }
            } catch (error) {
                console.warn('Google Sheets 로드 실패:', error.message);
                console.log('대시보드는 최종본 업로드 후 표시됩니다');
            }
        }

            // 1. DB 데이터 검색 (우선순위)

                (item['도로명전체주소'] && item['도로명전체주소'].includes(keyword))
            );

                kakaoMap.setCenter(moveLatLon);
                kakaoMap.setLevel(1); // Zoom in (매우 가깝게)
                return;
            }

            // 2. 카카오 장소 검색 (DB에 없으면)
            // 장소 검색 객체를 생성합니다
            const ps = new kakao.maps.services.Places();

            // 키워드로 장소를 검색합니다
            ps.keywordSearch(keyword, (data, status, pagination) => {
                if (status === kakao.maps.services.Status.OK) {
                    // 검색된 장소 위치를 기준으로 지도 중심을 이동합니다
                    const place = data[0];
                    const moveLatLon = new kakao.maps.LatLng(place.y, place.x);
                    kakaoMap.setCenter(moveLatLon);
                    kakaoMap.setLevel(3);
                } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                    alert('검색 결과가 존재하지 않습니다.');
                    return;
                } else if (status === kakao.maps.services.Status.ERROR) {
                    alert('검색 결과 중 오류가 발생했습니다.');
                    return;
                }
            });
        }

        async function handleRawFile(files) {

                const fileArray = Array.from(files);
                const allRawData = [];

                for (const file of fileArray) {

                    const wb = XLSX.read(data, { type: 'array' });

        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(new Uint8Array(e.target.result));
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

                        // 고양시 특수처리
                        if (addr2.startsWith('고양시') && tokens.length > 2) {
                            addr2 = `${tokens[1]} ${tokens[2]}`;
                            addr3 = tokens[3] || '';
                        } else {
                            addr3 = tokens[2] || '';
                        }
                    } else {
                        addr1 = '확인필요';
                        addr2 = '확인필요';
                        addr3 = '확인필요';
                    }

                    // 담당자 매핑
                    const repMap = {
                        '남양주시': '이도현', '구리시': '이도현', '가평군': '이도현', '의정부시': '이도현', '포천시': '이도현',
                        '미추홀구': '김지훈', '동구': '김지훈', '서구': '김지훈', '남동구': '김지훈',
                        '부평구': '김지훈', '계양구': '김지훈', '연수구': '김지훈', '중구': '김지훈',
                        '부천시': '김지훈', '소사구': '김지훈', '원미구': '김지훈', '오정구': '김지훈',
                        '양주시': '부대석', '파주시': '부대석', '연천군': '부대석', '철원군': '부대석', '동두천시': '부대석',
                        '고양시 덕양구': '김재찬', '고양시 일산동구': '부대석', '고양시 일산서구': '부대석',
                        '강화군': '김재찬', '김포시': '김재찬'
                    };

                    const manager = repMap[addr2] || '미지정';

                    // 순위 계산
                    let rank = '3';
                    if (parseFloat(pyeong) >= 30 || parseFloat(pyeong) == 0) rank = '1';
                    else if (parseFloat(pyeong) >= 10) rank = '2';

                    // 좌표 변환 (EPSG:5174 -> WGS84)
                    const xCol = parseFloat(row['좌표정보X(EPSG5174)'] || row['좌표정보(X)'] || row['좌표정보X'] || 0);
                    const yCol = parseFloat(row['좌표정보Y(EPSG5174)'] || row['좌표정보(Y)'] || row['좌표정보Y'] || 0);

                    let lat = 0, lng = 0;

                    if (xCol > 0 && yCol > 0) {
                        try {
                            // EPSG:5174 (중부원점) 정의
                            // 보정값(towgs84)은 지역마다 다를 수 있으나 일반적인 값 사용
                            const epsg5174 = "+proj=tmerc +lat_0=38 +lon_0=127.0028902777778 +k=1 +x_0=200000 +y_0=500000 +ellps=bessel +units=m +no_defs +towgs84=-115.80,474.99,674.11,1.16,-2.31,-1.63,6.43";
                            const wgs84 = "+proj=longlat +ellps=WGS84 +datum=WGS84 +no_defs";

                            const converted = proj4(epsg5174, wgs84, [xCol, yCol]);
                            lng = converted[0];
                            lat = converted[1];
                        } catch (e) {
                            console.warn('좌표 변환 실패:', name, e);
                        }
                    }

                    // 앱시트등록일
                    const uploadDate = new Date().toISOString().split('T')[0];

                    return {
                        'NO': row['번호'] || '',
                        '영업 허가일': formattedDate,
                        '사업장명': name,
                        '거래여부(기입예정)': '인허가',
                        '업태구분명': category,
                        '평형': pyeong,
                        '도로명전체주소': roadAddr,
                        '주소1': addr1,
                        '주소2': addr2,
                        '주소3': addr3,
                        '순위': rank,
                        '담당자': manager,
                        '앱시트등록일': uploadDate,
                        '위도': lat, // 변환된 위도
                        '경도': lng, // 변환된 경도
                        '_pyeong_num': parseFloat(pyeong),
                        '_sort_score': 99
                    };
                });

                // 6. 한식 필터링 (100평 이상만)
                processedData = processedData.filter(row => {
                    if (row['업태구분명'] === '한식' && row['_pyeong_num'] < 100) {
                        return false;
                    }
                    return true;
                });
                console.log(`한식 필터링 후: ${processedData.length}건`);

                // 7. 담당자 미지정 제외
                processedData = processedData.filter(row => row['담당자'] !== '미지정');
                console.log(`담당자 미지정 제외 후: ${processedData.length}건`);

                // 8. F/C 키워드 처리
                const fcKeywords = [
                    '스타벅스', '메가커피', '메가엠지씨', '컴포즈', '빽다방', '이디야', '메가', '메가MGC', '우지커피',
                    '투썸플레이스', '투썸', '할리스', '파스쿠찌', '폴바셋', '풀바셋', '엔제리너스',
                    '카페베네', '탐앤탐스', '설빙', '공차', '아마스빈', '더벤티', '쥬씨', '감성커피', '백억커피', '김준호의', '만랩',
                    '파리바게뜨', '뚜레쥬르', '던킨', '베스킨라빈스', '매머드커피',
                    '브레댄코', '카페일리터', '하삼동', '텐퍼센트'
                ];

                processedData.forEach(row => {
                    const name = row['사업장명'];
                    if (fcKeywords.some(keyword => name.includes(keyword))) {
                        row['업태구분명'] = 'F/C';
                    }
                });

                // 9. 인천공항 처리
                processedData.forEach(row => {
                    const addr = row['도로명전체주소'];
                    const name = row['사업장명'];
                    if (addr.includes('인천공항') || name.includes('인천공항')) {
                        row['업태구분명'] = '인천공항';
                    }
                });

                // 10. 정렬 점수 계산
                processedData.forEach(row => {
                    if (row['업태구분명'] === 'F/C') {
                        row['_sort_score'] = 60;
                    } else if (row['업태구분명'] === '인천공항') {
                        row['_sort_score'] = 50;
                    } else if (row['순위'] === '1') {
                        row['_sort_score'] = 10;
                    } else if (row['순위'] === '2') {
                        row['_sort_score'] = 20;
                    } else if (row['순위'] === '3') {
                        row['_sort_score'] = 30;
                    }
                });

                // 11. 정렬 (점수 오름차순 -> 평형 내림차순)
                processedData.sort((a, b) => {
                    if (a['_sort_score'] !== b['_sort_score']) {
                        return a['_sort_score'] - b['_sort_score'];
                    }
                    return b['_pyeong_num'] - a['_pyeong_num'];
                });

                // 12. 임시 컬럼 제거
                processedData.forEach(row => {
                    delete row['_pyeong_num'];
                    delete row['_sort_score'];
                });

                console.log(`최종 처리 완료: ${processedData.length}건`);
                console.log('미리보기:', processedData.slice(0, 5));

                document.getElementById('loading1').classList.remove('active');
                document.getElementById('downloadBtn').disabled = false;
                showAlert('alert1', 'success', `✅ ${processedData.length}건 완료`);

            } catch (err) {
                console.error('전처리 오류:', err);
                document.getElementById('loading1').classList.remove('active');
                showAlert('alert1', 'error', '❌ 전처리 오류: ' + err.message);
            }
        }

        document.getElementById('downloadBtn').onclick = function () {
            const ws = XLSX.utils.json_to_sheet(processedData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "가공데이터");
            XLSX.writeFile(wb, '인허가_1차가공_' + new Date().toISOString().slice(0, 10) + '.xlsx');
        };

        function handleFinalFile(files) {
            document.getElementById('loading2').classList.add('active');

            // FileList에서 첫 번째 파일 추출
            const file = files[0];
            if (!file) {
                document.getElementById('loading2').classList.remove('active');
                showAlert('alert2', 'error', '❌ 파일을 선택해주세요');
                return;
            }

            const reader = new FileReader();
            reader.onload = async function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    // [수정] 데이터 읽기 (빈 셀은 빈 문자열로 처리)
                    const rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });

                    // 1. 데이터 정제 (헤더/값 공백 제거)
                    const cleanedData = rawData.map(row => {
                        const newRow = {};
                        Object.keys(row).forEach(key => {
                            const cleanKey = key.trim(); // 헤더 공백 제거
                            let value = row[key];
                            if (typeof value === 'string') value = value.trim(); // 값 공백 제거
                            newRow[cleanKey] = value;
                        });
                        return newRow;
                    });

                    // 2. 1순위 필터링
                    const finalData = cleanedData.filter(row => String(row['순위']) === '1');

                    console.log(`전체 ${cleanedData.length}건 중 1순위 ${finalData.length}건 추출`);

                    if (finalData.length === 0) {
                        document.getElementById('loading2').classList.remove('active');
                        showAlert('alert2', 'error', '❌ 업로드할 1순위 데이터가 없습니다.<br>(순위 컬럼을 확인해주세요)');
                        return;
                    }

                    await uploadToSheets(finalData);
                } catch (err) {
                    document.getElementById('loading2').classList.remove('active');
                    showAlert('alert2', 'error', '❌ 오류: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function uploadToSheets(data) {
            try {
                // 데이터 검증
                if (!data || data.length === 0) {
                    throw new Error('업로드할 데이터가 없습니다');
                }

                // Apps Script로 전송
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'upload', data: data })
                });

                // 성공 메시지
                document.getElementById('loading2').classList.remove('active');
                showAlert('alert2', 'success',
                    '✅ 업로드에 성공하였습니다!<br><br>' +
                    `<strong>${data.length}건</strong>의 데이터가 Google Sheets에 저장되었습니다.<br>` +
                    '<small>※ D+14 대상이 있으면 자동으로 이메일이 발송됩니다.</small>'
                );

                closeFinalUploadModal();

                // 2초 후 대시보드 새로고침
                setTimeout(loadDataFromSheets, 2000);

            } catch (err) {
                document.getElementById('loading2').classList.remove('active');

                // 상세한 오류 메시지
                let errorMsg = '❌ 업로드 오류<br><br>';

                if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                    errorMsg += '<strong>네트워크 오류</strong><br>' +
                        '1. 인터넷 연결 확인<br>' +
                        '2. Apps Script URL 확인<br>' +
                        '3. 잠시 후 다시 시도';
                } else if (err.message.includes('데이터가 없습니다')) {
                    errorMsg += '<strong>파일 오류</strong><br>' +
                        '엑셀 파일에 데이터가 없거나<br>' +
                        '형식이 올바르지 않습니다.';
                } else {
                    errorMsg += '<strong>파일 점검 필요</strong><br>' +
                        '1. 파일 보안 해제 확인<br>' +
                        '2. 엑셀 파일 형식 확인<br>' +
                        '3. 컬럼명 일치 여부 확인<br><br>' +
                        `<small>오류 내용: ${err.message}</small>`;
                }

                showAlert('alert2', 'error', errorMsg);
            }
        }

        function showAlert(id, type, msg) {
            document.getElementById(id).innerHTML = '<div class="alert alert-' + type + '">' + msg + '</div>';
            setTimeout(() => { document.getElementById(id).innerHTML = ''; }, 5000);
        }
    </script>
</body>
