<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin">
    <title>경기북부 FS 인허가 대시보드</title>

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <!-- 카카오 지도 API -->
    <script type="text/javascript"
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=bbf769db2dd1578ca35767b4c4090fcc&autoload=false"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Proj4js (좌표계 변환) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #1d1d1f;
            overflow: hidden;
            height: 100vh;
        }

        /* =============== 상단 네비게이션 =============== */
        .nav-bar {
            background: #1d1d1f;
            padding: 0 24px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
        }

        .nav-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 980px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #0071e3;
            color: white;
        }

        .btn-primary:hover {
            background: #0077ed;
        }

        .btn-secondary {
            background: #424245;
            color: white;
        }

        .btn-secondary:hover {
            background: #515154;
        }

        /* =============== 메인 레이아웃 =============== */
        .main-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            height: calc(100vh - 52px);
        }

        /* =============== 좌측 사이드바 =============== */
        .sidebar {
            background: #f5f5f7;
            overflow-y: auto;
            padding: 20px;
            border-right: 1px solid #d2d2d7;
        }

        .sidebar-title {
            font-size: 22px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-header {
            font-size: 12px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        /* =============== 방문 현황 카드 (5개 가로) =============== */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 6px;
        }

        .status-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 10px 6px;
            text-align: center;
            border: 1px solid #e8e8ed;
        }

        .status-card.deal {
            border-left: 3px solid #0071e3;
        }

        .status-card.no-deal {
            border-left: 3px solid #1d1d1f;
        }

        .status-card.licensed {
            border-left: 3px solid #34c759;
        }

        .status-card.drop {
            border-left: 3px solid #ff3b30;
        }

        .status-card.construction {
            border-left: 3px solid #ff9500;
        }

        .status-card .label {
            font-size: 10px;
            font-weight: 500;
            color: #86868b;
            margin-bottom: 2px;
        }

        .status-card .value {
            font-size: 20px;
            font-weight: 700;
            color: #1d1d1f;
        }

        /* =============== 순위별 현황 =============== */
        .priority-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .priority-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            border: 1px solid #e8e8ed;
            position: relative;
        }

        .priority-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            border-radius: 10px 0 0 10px;
        }

        .priority-card.rank1::before {
            background: #ff3b30;
        }

        .priority-card.rank2::before {
            background: #ff9500;
        }

        .priority-card.rank3::before {
            background: #86868b;
        }

        .priority-card .label {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .priority-card.rank1 .label {
            color: #ff3b30;
        }

        .priority-card.rank2 .label {
            color: #ff9500;
        }

        .priority-card.rank3 .label {
            color: #86868b;
        }

        .priority-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #1d1d1f;
        }

        /* =============== 드롭다운 섹션 =============== */
        .dropdown-card {
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e8e8ed;
            margin-bottom: 8px;
        }

        .dropdown-header {
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dropdown-header:hover {
            background: #f5f5f7;
        }

        .dropdown-header h4 {
            font-size: 14px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .dropdown-arrow {
            font-size: 12px;
            color: #86868b;
            transition: transform 0.2s;
        }

        .dropdown-card.open .dropdown-arrow {
            transform: rotate(180deg);
        }

        .dropdown-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .dropdown-card.open .dropdown-content {
            max-height: 300px;
        }

        .dropdown-list {
            padding: 0 14px 12px;
        }

        .dropdown-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            background: #f5f5f7;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .dropdown-item:last-child {
            margin-bottom: 0;
        }

        .dropdown-item-name {
            color: #1d1d1f;
            font-weight: 500;
        }

        .dropdown-item-count {
            color: #0071e3;
            font-weight: 600;
        }

        /* =============== 주간 추이 차트 =============== */
        .chart-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid #e8e8ed;
        }

        .chart-wrapper {
            height: 120px;
        }

        /* =============== 우측 지도 영역 =============== */
        .map-area {
            position: relative;
            background: #f5f5f7;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 14px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .filter-label {
            font-size: 11px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .filter-buttons {
            display: flex;
            gap: 6px;
        }

        .filter-btn {
            padding: 6px 14px;
            border: 1px solid #d2d2d7;
            background: white;
            border-radius: 980px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #f5f5f7;
        }

        .filter-btn.active {
            background: #0071e3;
            color: white;
            border-color: #0071e3;
        }

        /* =============== 모달 =============== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 28px;
            border-radius: 16px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .close-btn {
            font-size: 24px;
            cursor: pointer;
            color: #86868b;
            transition: color 0.2s;
            line-height: 1;
        }

        .close-btn:hover {
            color: #1d1d1f;
        }

        .upload-zone {
            border: 2px dashed #d2d2d7;
            border-radius: 12px;
            padding: 36px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: #0071e3;
            background: #f0f7ff;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 15px;
            font-weight: 500;
            color: #1d1d1f;
        }

        .upload-hint {
            font-size: 13px;
            color: #86868b;
            margin-top: 4px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f5f5f7;
            border-top: 3px solid #0071e3;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin: 14px 0;
            font-size: 13px;
            font-weight: 500;
        }

        .alert-success {
            background: #d1f2eb;
            color: #0a6847;
        }

        .alert-error {
            background: #fce4e4;
            color: #b91c1c;
        }

        .alert-info {
            background: #e0f2fe;
            color: #0369a1;
        }

        input[type="file"] {
            display: none;
        }

        .btn-full {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
        }

        /* =============== 스크롤바 스타일 =============== */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #d2d2d7;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <!-- 상단 네비게이션 -->
    <nav class="nav-bar">
        <div class="nav-logo">📊 경기북부 FS 인허가 대시보드</div>
        <div class="nav-actions">
            <button class="btn btn-secondary" onclick="openUploadModal()">📤 RAW 업로드</button>
            <button class="btn btn-primary" onclick="openFinalUploadModal()">최종본 업로드</button>
        </div>
    </nav>

    <!-- 메인 레이아웃 -->
    <div class="main-layout">
        <!-- 좌측 사이드바 -->
        <div class="sidebar">
            <h1 class="sidebar-title">인허가 현황</h1>

            <!-- 방문 현황 -->
            <div class="section">
                <div class="section-header">📍 방문 현황</div>
                <div class="status-grid">
                    <div class="status-card deal">
                        <div class="label">거래</div>
                        <div class="value" id="dealCount">0</div>
                    </div>
                    <div class="status-card no-deal">
                        <div class="label">미거래</div>
                        <div class="value" id="noDealCount">0</div>
                    </div>
                    <div class="status-card licensed">
                        <div class="label">인허가</div>
                        <div class="value" id="licensedCount">0</div>
                    </div>
                    <div class="status-card drop">
                        <div class="label">DROP</div>
                        <div class="value" id="dropCount">0</div>
                    </div>
                    <div class="status-card construction">
                        <div class="label">공사중</div>
                        <div class="value" id="constructionCount">0</div>
                    </div>
                </div>
            </div>

            <!-- 순위별 현황 -->
            <div class="section">
                <div class="section-header">🎯 순위별 현황</div>
                <div class="priority-grid">
                    <div class="priority-card rank1">
                        <div class="label">1순위</div>
                        <div class="value" id="rank1Count">0</div>
                    </div>
                    <div class="priority-card rank2">
                        <div class="label">2순위</div>
                        <div class="value" id="rank2Count">0</div>
                    </div>
                    <div class="priority-card rank3">
                        <div class="label">3순위</div>
                        <div class="value" id="rank3Count">0</div>
                    </div>
                </div>
            </div>

            <!-- 지역별 현황 -->
            <div class="section">
                <div class="dropdown-card" id="regionDropdown">
                    <div class="dropdown-header" onclick="toggleDropdown('regionDropdown')">
                        <h4>🗺️ 지역별 현황</h4>
                        <span class="dropdown-arrow">▼</span>
                    </div>
                    <div class="dropdown-content">
                        <div class="dropdown-list" id="regionList"></div>
                    </div>
                </div>

                <div class="dropdown-card" id="managerDropdown">
                    <div class="dropdown-header" onclick="toggleDropdown('managerDropdown')">
                        <h4>👥 담당자별 현황</h4>
                        <span class="dropdown-arrow">▼</span>
                    </div>
                    <div class="dropdown-content">
                        <div class="dropdown-list" id="managerList"></div>
                    </div>
                </div>
            </div>

            <!-- 주간 추이 -->
            <div class="section">
                <div class="section-header">📈 주간 추이</div>
                <div class="chart-card">
                    <div class="chart-wrapper">
                        <canvas id="weeklyChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 우측 지도 -->
        <div class="map-area">
            <div id="map"></div>
            <div class="map-controls">
                <div class="filter-label">순위 필터</div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">전체</button>
                    <button class="filter-btn" data-filter="1순위">1순위</button>
                    <button class="filter-btn" data-filter="2순위">2순위</button>
                    <button class="filter-btn" data-filter="3순위">3순위</button>
                </div>
            </div>
        </div>
    </div>

    <!-- RAW 파일 업로드 모달 -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>RAW 파일 업로드</h2>
                <span class="close-btn" onclick="closeUploadModal()">&times;</span>
            </div>
            <div class="upload-zone" id="uploadZone1">
                <div class="upload-icon">📁</div>
                <p class="upload-text">클릭하거나 드래그앤드롭</p>
                <p class="upload-hint">Excel 파일 (.xlsx, .xls)</p>
            </div>
            <input type="file" id="fileInput1" accept=".xlsx,.xls" multiple>
            <div class="loading" id="loading1">
                <div class="spinner"></div>
                <p>데이터 가공 중...</p>
            </div>
            <div id="alert1"></div>
            <button class="btn btn-primary btn-full" id="downloadBtn" disabled>
                📥 1차 가공본 다운로드
            </button>
        </div>
    </div>

    <!-- 최종본 업로드 모달 -->
    <div class="modal" id="finalUploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>최종본 업로드</h2>
                <span class="close-btn" onclick="closeFinalUploadModal()">&times;</span>
            </div>
            <div class="upload-zone" id="uploadZone2">
                <div class="upload-icon">📂</div>
                <p class="upload-text">수정 완료한 파일 업로드</p>
                <p class="upload-hint">Excel 파일 (.xlsx, .xls)</p>
            </div>
            <input type="file" id="fileInput2" accept=".xlsx,.xls">
            <div class="loading" id="loading2">
                <div class="spinner"></div>
                <p>Google Sheets 업로드 중...</p>
            </div>
            <div id="alert2"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 설정
        // ============================================================

        const SHEETS_CONFIG = {
            apiKey: 'AQ.Ab8RN6KwmiUwl-nKqJB8CQwfZ3qeZ8BjPJPtxSY92uaviUVpow',
            spreadsheetId: '1JnLQVr3JGqZPyvQ6bf8TSl0dNN6_oI05YH7d9zSgsKI',
            range: '인허가데이터!A:P'
        };

        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzj8ZBiJXop_w_ThnvW1bEAkpJvsV_8CGCILqwpKmRaa89h92-Ijf18des3pB0H_LH-/exec';

        // ============================================================
        // 전역 변수
        // ============================================================

        let processedData = [];
        let allData = [];
        let kakaoMap;
        let markers = [];
        let currentFilter = 'all';

        // ============================================================
        // 초기화
        // ============================================================

        window.onload = function () {
            console.log('페이지 로드 완료');
            setupUploadZones();
            setupFilters();

            if (typeof kakao !== 'undefined' && kakao.maps) {
                kakao.maps.load(function () {
                    console.log('카카오 지도 SDK 로드 완료');
                    initKakaoMap();
                });
            } else {
                console.error('카카오 지도 SDK를 불러올 수 없습니다.');
            }

            if (SHEETS_CONFIG.apiKey.startsWith('AIza') === false) {
                showAlert('alert1', 'info', 'ℹ️ Google Sheets API 키를 설정해주세요');
            } else {
                loadDataFromSheets();
            }

            initChart();
        };

        // ============================================================
        // 드롭다운
        // ============================================================

        function toggleDropdown(id) {
            document.getElementById(id).classList.toggle('open');
        }

        // ============================================================
        // 카카오 지도
        // ============================================================

        function initKakaoMap() {
            try {
                const container = document.getElementById('map');
                kakaoMap = new kakao.maps.Map(container, {
                    center: new kakao.maps.LatLng(37.5, 127.3),
                    level: 9
                });
            } catch (error) {
                console.error('지도 오류:', error);
            }
        }

        // ============================================================
        // 차트
        // ============================================================

        let weeklyChart;

        function initChart() {
            const ctx = document.getElementById('weeklyChart');
            weeklyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['월', '화', '수', '목', '금', '토', '일'],
                    datasets: [{
                        label: '신규',
                        data: [12, 19, 15, 25, 22, 8, 5],
                        borderColor: '#0071e3',
                        backgroundColor: 'rgba(0, 113, 227, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 2,
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { display: false },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        // ============================================================
        // 데이터 로드
        // ============================================================

        async function loadDataFromSheets() {
            try {
                const url = 'https://sheets.googleapis.com/v4/spreadsheets/' +
                    SHEETS_CONFIG.spreadsheetId + '/values/' +
                    SHEETS_CONFIG.range + '?key=' + SHEETS_CONFIG.apiKey;

                const response = await fetch(url);
                if (!response.ok) return;

                const data = await response.json();
                if (data.values && data.values.length > 1) {
                    const headers = data.values[0];
                    allData = data.values.slice(1).map(row => {
                        const obj = {};
                        headers.forEach((h, i) => { obj[h] = row[i] || ''; });
                        return obj;
                    });
                    updateDashboard();
                    updateMap();
                }
            } catch (error) {
                console.error('로드 오류:', error);
            }
        }

        // ============================================================
        // 대시보드 업데이트
        // ============================================================

        function updateDashboard() {
            document.getElementById('dealCount').textContent = allData.filter(d => d['상태'] === '거래').length || 0;
            document.getElementById('noDealCount').textContent = allData.filter(d => d['상태'] === '미거래').length || 0;
            document.getElementById('licensedCount').textContent = allData.length || 0;
            document.getElementById('dropCount').textContent = allData.filter(d => d['상태'] === 'DROP').length || 0;
            document.getElementById('constructionCount').textContent = allData.filter(d => d['상태'] === '공사중').length || 0;

            document.getElementById('rank1Count').textContent = allData.filter(d => d['순위'] === '1순위').length || 0;
            document.getElementById('rank2Count').textContent = allData.filter(d => d['순위'] === '2순위').length || 0;
            document.getElementById('rank3Count').textContent = allData.filter(d => d['순위'] === '3순위').length || 0;

            const regionCounts = {};
            allData.forEach(item => {
                const region = item['주소2'] || '기타';
                regionCounts[region] = (regionCounts[region] || 0) + 1;
            });

            document.getElementById('regionList').innerHTML = Object.entries(regionCounts)
                .sort((a, b) => b[1] - a[1]).slice(0, 6)
                .map(([r, c]) => '<div class="dropdown-item"><span class="dropdown-item-name">' + r + '</span><span class="dropdown-item-count">' + c + '건</span></div>').join('');

            const managerCounts = {};
            allData.forEach(item => {
                const m = item['담당자'] || '미지정';
                managerCounts[m] = (managerCounts[m] || 0) + 1;
            });

            document.getElementById('managerList').innerHTML = Object.entries(managerCounts)
                .sort((a, b) => b[1] - a[1])
                .map(([m, c]) => '<div class="dropdown-item"><span class="dropdown-item-name">' + m + '</span><span class="dropdown-item-count">' + c + '건</span></div>').join('');
        }

        // ============================================================
        // 지도 업데이트
        // ============================================================

        function updateMap() {
            if (!kakaoMap) return;

            markers.forEach(m => m.setMap(null));
            markers = [];

            let filtered = currentFilter === 'all' ? allData : allData.filter(d => d['순위'] === currentFilter);

            filtered.forEach(item => {
                if (!item['위도'] || !item['경도']) return;

                try {
                    const pos = new kakao.maps.LatLng(parseFloat(item['위도']), parseFloat(item['경도']));
                    const color = item['순위'] === '1순위' ? '#ff3b30' : item['순위'] === '2순위' ? '#ff9500' : '#86868b';

                    const overlay = new kakao.maps.CustomOverlay({
                        position: pos,
                        content: '<div style="background:' + color + ';color:#fff;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.2)">' + item['사업장명'] + '</div>',
                        yAnchor: 1
                    });
                    overlay.setMap(kakaoMap);
                    markers.push(overlay);
                } catch (e) { }
            });
        }

        // ============================================================
        // 필터
        // ============================================================

        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    updateMap();
                });
            });
        }

        // ============================================================
        // 모달
        // ============================================================

        function openUploadModal() { document.getElementById('uploadModal').classList.add('active'); }
        function closeUploadModal() { document.getElementById('uploadModal').classList.remove('active'); }
        function openFinalUploadModal() { document.getElementById('finalUploadModal').classList.add('active'); }
        function closeFinalUploadModal() { document.getElementById('finalUploadModal').classList.remove('active'); }

        // ============================================================
        // 업로드
        // ============================================================

        function setupUploadZones() {
            setupUploadZone('uploadZone1', 'fileInput1', handleRawFile);
            setupUploadZone('uploadZone2', 'fileInput2', handleFinalFile);
        }

        function setupUploadZone(zoneId, inputId, handler) {
            const zone = document.getElementById(zoneId);
            const input = document.getElementById(inputId);
            zone.onclick = () => input.click();
            zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('dragover'); };
            zone.ondragleave = () => zone.classList.remove('dragover');
            zone.ondrop = (e) => { e.preventDefault(); zone.classList.remove('dragover'); if (e.dataTransfer.files.length > 0) handler(e.dataTransfer.files); };
            input.onchange = (e) => { if (e.target.files.length > 0) handler(e.target.files); };
        }

        async function handleRawFile(files) {
            document.getElementById('loading1').classList.add('active');
            document.getElementById('downloadBtn').disabled = true;

            try {
                const fileArray = Array.from(files);
                const allRawData = [];

                for (const file of fileArray) {
                    const data = await readFileAsArrayBuffer(file);
                    const wb = XLSX.read(data, { type: 'array' });
                    const rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    allRawData.push(...rawData);
                }

                console.log(`총 ${allRawData.length}건의 데이터 로드 완료`);
                await processData(allRawData);
            } catch (err) {
                document.getElementById('loading1').classList.remove('active');
                showAlert('alert1', 'error', '❌ 오류: ' + err.message);
            }
        }

        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(new Uint8Array(e.target.result));
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        async function processData(rawData) {
            try {
                console.log(`전처리 시작: ${rawData.length}건`);

                // 1. 영업/정상만 필터링
                let data = rawData.filter(row => {
                    const status = (row['영업상태명'] || row['상세영업상태명'] || '').toString().trim();
                    return status === '영업/정상' || status === '영업' || status === '정상';
                });
                console.log(`영업/정상 필터링 후: ${data.length}건`);

                // 2. 업종 필터링 & 명칭 변경
                const targetCategories = ['한식', '기타 휴게음식점', '기타', '커피숍', '제과점영업', '레스토랑', '키즈카페', '경양식'];
                const categoryRenameMap = {
                    '커피숍': '카페',
                    '제과점영업': '베이커리',
                    '기타 휴게음식점': 'FS기타',
                    '기타': 'FS기타',
                    '경양식': '레스토랑'
                };

                data = data.filter(row => {
                    const category = (row['업태구분명'] || '').toString().trim();
                    return targetCategories.includes(category);
                });
                console.log(`업종 필터링 후: ${data.length}건`);

                // 3. 블랙리스트 필터링
                const excludeKeywords = [
                    '편의점', 'GS25', 'CU', '세븐일레븐', '이마트24', '찐빵', '육회', '고기', '홍어', '회', '씨유', '포차', '한끼',
                    'PC', '피시', '게임', '당구', '만화', '노래', '제육', '곰탕', '숯불', '베트남', '동남아', '쌀국수', '조건부', '펍',
                    '무인', '자판기', '아이스크림', '밀키트', '한시적', '피씨', '핫도그', '분식', '떡볶이', '치킨', '튀김', '어묵', '오뎅', '브뤼셀프라이', '피자', '7080라이브',
                    '구내식당', '급식', '장례', '매점', '휴게소', '반점', '고로케', '초밥', '써브웨이', '홍콩반점', '삼겹', '갈비', '찜', '밥상', '롯데리아', '맥도날드', '버거킹', '맘스터치'
                ];

                data = data.filter(row => {
                    const name = (row['사업장명'] || '').toString();
                    return !excludeKeywords.some(keyword => name.includes(keyword));
                });
                console.log(`블랙리스트 필터링 후: ${data.length}건`);

                // 4. 날짜 필터링 (최근 1년)
                const oneYearAgo = new Date();
                oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);

                data = data.filter(row => {
                    const dateStr = (row['인허가일자'] || row['영업허가일'] || '').toString().replace(/\D/g, '');
                    if (dateStr.length < 8) return false;
                    const year = parseInt(dateStr.substring(0, 4));
                    const month = parseInt(dateStr.substring(4, 6)) - 1;
                    const day = parseInt(dateStr.substring(6, 8));
                    const date = new Date(year, month, day);
                    return date >= oneYearAgo;
                });
                console.log(`날짜 필터링 후 (최근 1년): ${data.length}건`);

                // 5. 데이터 가공
                processedData = data.map(row => {
                    // 기본 정보
                    const name = (row['사업장명'] || '').toString().trim();
                    let category = (row['업태구분명'] || '').toString().trim();
                    category = categoryRenameMap[category] || category;

                    // 날짜 포맷
                    const dateStr = (row['인허가일자'] || row['영업허가일'] || '').toString().replace(/\D/g, '');
                    let formattedDate = '';
                    if (dateStr.length >= 8) {
                        formattedDate = `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-${dateStr.substring(6, 8)}`;
                    }

                    // 평형 계산
                    const area = parseFloat(row['소재지면적'] || row['시설총규모'] || 0);
                    const pyeong = (area / 3.3).toFixed(1);

                    // 주소 처리
                    const jibunAddr = (row['소재지전체주소'] || '').toString().trim();
                    const roadAddr = (row['도로명전체주소'] || jibunAddr).toString().trim();

                    // 주소 3단계 분리 (고양시 특수처리)
                    const tokens = jibunAddr.split(' ');
                    let addr1 = '', addr2 = '', addr3 = '';

                    if (tokens.length >= 2) {
                        addr1 = tokens[0];
                        addr2 = tokens[1];

                        // 고양시 특수처리
                        if (addr2.startsWith('고양시') && tokens.length > 2) {
                            addr2 = `${tokens[1]} ${tokens[2]}`;
                            addr3 = tokens[3] || '';
                        } else {
                            addr3 = tokens[2] || '';
                        }
                    } else {
                        addr1 = '확인필요';
                        addr2 = '확인필요';
                        addr3 = '확인필요';
                    }

                    // 담당자 매핑
                    const repMap = {
                        '남양주시': '이도현', '구리시': '이도현', '가평군': '이도현', '의정부시': '이도현', '포천시': '이도현',
                        '미추홀구': '김지훈', '동구': '김지훈', '서구': '김지훈', '남동구': '김지훈',
                        '부평구': '김지훈', '계양구': '김지훈', '연수구': '김지훈', '중구': '김지훈',
                        '부천시': '김지훈', '소사구': '김지훈', '원미구': '김지훈', '오정구': '김지훈',
                        '양주시': '부대석', '파주시': '부대석', '연천군': '부대석', '철원군': '부대석', '동두천시': '부대석',
                        '고양시 덕양구': '김재찬', '고양시 일산동구': '부대석', '고양시 일산서구': '부대석',
                        '강화군': '김재찬', '김포시': '김재찬'
                    };

                    const manager = repMap[addr2] || '미지정';

                    // 순위 계산
                    let rank = '3순위';
                    if (parseFloat(pyeong) >= 30 || parseFloat(pyeong) == 0) rank = '1순위';
                    else if (parseFloat(pyeong) >= 10) rank = '2순위';

                    // 좌표 (원본 그대로)
                    const xCol = row['좌표정보X(EPSG5174)'] || row['좌표정보(X)'] || row['좌표정보X'] || '';
                    const yCol = row['좌표정보Y(EPSG5174)'] || row['좌표정보(Y)'] || row['좌표정보Y'] || '';

                    // 앱시트등록일
                    const uploadDate = new Date().toISOString().split('T')[0];

                    return {
                        '번호': row['번호'] || '',
                        '인허가일자': formattedDate,
                        '사업장명': name,
                        '영업상태명': '인허가',
                        '업태구분명': category,
                        '시설총규모 : 평형': pyeong,
                        '도로명전체주소': roadAddr,
                        '주소1': addr1,
                        '주소2': addr2,
                        '주소3': addr3,
                        '순위': rank,
                        '담당자': manager,
                        '앱시트등록일': uploadDate,
                        '위도': yCol,
                        '경도': xCol,
                        '_pyeong_num': parseFloat(pyeong),
                        '_sort_score': 99
                    };
                });

                // 6. 한식 필터링 (100평 이상만)
                processedData = processedData.filter(row => {
                    if (row['업태구분명'] === '한식' && row['_pyeong_num'] < 100) {
                        return false;
                    }
                    return true;
                });
                console.log(`한식 필터링 후: ${processedData.length}건`);

                // 7. 담당자 미지정 제외
                processedData = processedData.filter(row => row['담당자'] !== '미지정');
                console.log(`담당자 미지정 제외 후: ${processedData.length}건`);

                // 8. F/C 키워드 처리
                const fcKeywords = [
                    '스타벅스', '메가커피', '메가엠지씨', '컴포즈', '빽다방', '이디야', '메가', '메가MGC', '우지커피',
                    '투썸플레이스', '투썸', '할리스', '파스쿠찌', '폴바셋', '풀바셋', '엔제리너스',
                    '카페베네', '탐앤탐스', '설빙', '공차', '아마스빈', '더벤티', '쥬씨', '감성커피', '백억커피', '김준호의', '만랩',
                    '파리바게뜨', '뚜레쥬르', '던킨', '베스킨라빈스', '매머드커피',
                    '브레댄코', '카페일리터', '하삼동', '텐퍼센트'
                ];

                processedData.forEach(row => {
                    const name = row['사업장명'];
                    if (fcKeywords.some(keyword => name.includes(keyword))) {
                        row['업태구분명'] = 'F/C';
                    }
                });

                // 9. 인천공항 처리
                processedData.forEach(row => {
                    const addr = row['도로명전체주소'];
                    const name = row['사업장명'];
                    if (addr.includes('인천공항') || name.includes('인천공항')) {
                        row['업태구분명'] = '인천공항';
                    }
                });

                // 10. 정렬 점수 계산
                processedData.forEach(row => {
                    if (row['업태구분명'] === 'F/C') {
                        row['_sort_score'] = 60;
                    } else if (row['업태구분명'] === '인천공항') {
                        row['_sort_score'] = 50;
                    } else if (row['순위'] === '1순위') {
                        row['_sort_score'] = 10;
                    } else if (row['순위'] === '2순위') {
                        row['_sort_score'] = 20;
                    } else if (row['순위'] === '3순위') {
                        row['_sort_score'] = 30;
                    }
                });

                // 11. 정렬 (점수 오름차순 -> 평형 내림차순)
                processedData.sort((a, b) => {
                    if (a['_sort_score'] !== b['_sort_score']) {
                        return a['_sort_score'] - b['_sort_score'];
                    }
                    return b['_pyeong_num'] - a['_pyeong_num'];
                });

                // 12. 임시 컬럼 제거
                processedData.forEach(row => {
                    delete row['_pyeong_num'];
                    delete row['_sort_score'];
                });

                console.log(`최종 처리 완료: ${processedData.length}건`);
                console.log('미리보기:', processedData.slice(0, 5));

                document.getElementById('loading1').classList.remove('active');
                document.getElementById('downloadBtn').disabled = false;
                showAlert('alert1', 'success', `✅ ${processedData.length}건 완료`);

            } catch (err) {
                console.error('전처리 오류:', err);
                document.getElementById('loading1').classList.remove('active');
                showAlert('alert1', 'error', '❌ 전처리 오류: ' + err.message);
            }
        }

        document.getElementById('downloadBtn').onclick = function () {
            const ws = XLSX.utils.json_to_sheet(processedData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "가공데이터");
            XLSX.writeFile(wb, '인허가_1차가공_' + new Date().toISOString().slice(0, 10) + '.xlsx');
        };

        function handleFinalFile(file) {
            document.getElementById('loading2').classList.add('active');
            const reader = new FileReader();
            reader.onload = async function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const finalData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    await uploadToSheets(finalData);
                } catch (err) {
                    document.getElementById('loading2').classList.remove('active');
                    showAlert('alert2', 'error', '❌ 오류: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function uploadToSheets(data) {
            try {
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'upload', data: data }) });
                document.getElementById('loading2').classList.remove('active');
                showAlert('alert2', 'success', '✅ 업로드 완료');
                closeFinalUploadModal();
                setTimeout(loadDataFromSheets, 2000);
            } catch (err) {
                document.getElementById('loading2').classList.remove('active');
                showAlert('alert2', 'error', '❌ 실패: ' + err.message);
            }
        }

        function showAlert(id, type, msg) {
            document.getElementById(id).innerHTML = '<div class="alert alert-' + type + '">' + msg + '</div>';
            setTimeout(() => { document.getElementById(id).innerHTML = ''; }, 5000);
        }
    </script>
