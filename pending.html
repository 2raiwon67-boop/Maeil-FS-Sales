<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승인 대기 중 - FS AIOD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; }

        @keyframes pulse-ring {
            0%   { transform: scale(0.9); opacity: 0.8; }
            50%  { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }

        .pulse-icon { animation: pulse-ring 2.5s ease-in-out infinite; }
    </style>
</head>

<body class="min-h-screen bg-gray-50 flex items-center justify-center px-4">

    <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-10 text-center">

        <!-- 아이콘 -->
        <div class="pulse-icon inline-flex items-center justify-center w-20 h-20 bg-blue-50 rounded-full mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-blue-500" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-800 mb-2">승인 대기 중</h1>
        <p class="text-gray-500 text-sm mb-4 leading-relaxed">
            이메일 인증이 완료되었습니다.<br>
            관리자 승인 후 서비스를 이용하실 수 있습니다.
        </p>

        <!-- 단계 진행 표시 -->
        <div class="flex items-center justify-center gap-3 mb-6 text-sm">
            <div class="flex items-center gap-1.5">
                <span class="w-5 h-5 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-xs font-bold">✓</span>
                <span class="text-green-600 font-medium">이메일 인증</span>
            </div>
            <span class="text-gray-300">→</span>
            <div class="flex items-center gap-1.5">
                <span class="w-5 h-5 rounded-full bg-blue-100 text-blue-500 flex items-center justify-center text-xs font-bold">2</span>
                <span class="text-blue-500 font-medium">관리자 승인</span>
            </div>
        </div>

        <!-- 사용자 정보 -->
        <div class="bg-gray-50 rounded-xl p-4 mb-6 text-left">
            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">신청 정보</div>
            <div class="space-y-2 text-sm text-gray-700">
                <div class="flex justify-between">
                    <span class="text-gray-400">이름</span>
                    <span id="userName" class="font-medium">—</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">이메일</span>
                    <span id="userEmail" class="font-medium">—</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">신청일</span>
                    <span id="userCreated" class="font-medium">—</span>
                </div>
            </div>
        </div>

        <!-- 안내 -->
        <p class="text-xs text-gray-400 mb-8">
            승인이 완료되면 동일한 계정으로 로그인하시면 됩니다.<br>
            문의: 관리자
        </p>

        <button onclick="doSignOut()"
            class="w-full py-2.5 px-4 border border-gray-200 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">
            로그아웃
        </button>
    </div>

    <script src="auth.js"></script>
    <script>
        window.onload = async function () {
            if (!client) return;
            const { data: { user } } = await client.auth.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // 이미 승인됐으면 메인으로
            if (user.user_metadata?.approved !== false) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('userName').textContent =
                user.user_metadata?.full_name || '—';
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userCreated').textContent =
                new Date(user.created_at).toLocaleDateString('ko-KR');
        };

        async function doSignOut() {
            if (!client) return;
            await client.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
