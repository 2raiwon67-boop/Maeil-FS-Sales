<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 패널 - FS MISO</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    <link rel="stylesheet" href="common.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0071e3; }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .nav-sub  { font-size: 13px; color: #a1a1a6; margin-left: 12px; }

        .back-link {
            color: #a1a1a6;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover { color: #f5f5f7; }

        .container {
            max-width: 880px;
            margin: 0 auto;
            padding: 36px 24px 80px;
        }

        .page-title  { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
        .page-sub    { font-size: 14px; color: #86868b; margin: 0 0 28px; }

        /* 탭 */
        .tabs {
            display: flex;
            gap: 4px;
            background: #e5e5ea;
            border-radius: 10px;
            padding: 4px;
            width: fit-content;
            margin-bottom: 24px;
        }

        .tab {
            padding: 7px 18px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #86868b;
            transition: all 0.15s;
        }

        .tab.active {
            background: white;
            color: #1d1d1f;
            font-weight: 600;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        /* 카드 */
        .card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 14px;
        }

        .card-row {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f5f5f7;
            gap: 14px;
        }

        .card-row:last-child { border-bottom: none; }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0071e3, #34aadc);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 15px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .user-info { flex: 1; min-width: 0; }
        .user-name { font-size: 14px; font-weight: 600; }
        .user-meta { font-size: 12px; color: #86868b; margin-top: 2px; }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-pending  { background: #fff3cd; color: #856404; }
        .badge-approved { background: #d1e7dd; color: #0a5c36; }
        .badge-legacy   { background: #e2d9f3; color: #432874; }

        .actions { display: flex; gap: 8px; flex-shrink: 0; }

        .btn-approve {
            padding: 7px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-approve:hover { background: #0077ed; }
        .btn-approve:disabled { background: #c7c7cc; cursor: default; }

        .btn-reject {
            padding: 7px 16px;
            background: white;
            color: #ff3b30;
            border: 1px solid #ffc7c5;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reject:hover { background: #fff0ef; }
        .btn-reject:disabled { opacity: 0.4; cursor: default; }

        .btn-delete {
            width: 34px;
            height: 34px;
            padding: 0;
            background: white;
            color: #ff3b30;
            border: 1px solid #ffc7c5;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-delete:hover { background: #fff0ef; }
        .btn-delete:disabled { opacity: 0.4; cursor: default; }

        /* 빈 상태 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #86868b;
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        /* 로딩 */
        .spinner {
            width: 28px; height: 28px;
            border: 3px solid #e5e5ea;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* 알림 토스트 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1d1d1f;
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.3s ease;
            z-index: 999;
            white-space: nowrap;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ── 업로드 탭 ───────────────────────────────────────── */
        .upload-section { display: flex; flex-direction: column; gap: 14px; }

        .upload-card-header {
            padding: 14px 20px;
            border-bottom: 1px solid #f5f5f7;
            font-size: 13px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .upload-card-body { padding: 20px; }

        .type-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .type-btn {
            padding: 12px 8px;
            border: 2px solid #e5e5ea;
            background: white;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            color: #1d1d1f;
        }

        .type-btn.active {
            border-color: var(--primary);
            background: #e8f2fd;
            color: var(--primary);
            font-weight: 600;
        }

        .type-btn:hover:not(.active) { border-color: #c7c7cc; }

        .btn-template {
            padding: 8px 18px;
            background: #f5f5f7;
            color: #1d1d1f;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-template:hover { background: #e5e5ea; }

        .dropzone {
            border: 2px dashed #c7c7cc;
            border-radius: 10px;
            padding: 36px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #86868b;
            font-size: 14px;
            margin-top: 12px;
        }

        .dropzone:hover, .dropzone.drag { border-color: var(--primary); color: var(--primary); background: #f5f8ff; }
        .dropzone.has-file { border-color: #34c759; color: #1d1d1f; background: #f5fff8; border-style: solid; }

        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            display: block;
            overflow-x: auto;
        }

        .preview-table th {
            background: #f5f5f7;
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
            border-bottom: 1px solid #e5e5ea;
        }

        .preview-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #f5f5f7;
            white-space: nowrap;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .upload-warn {
            background: #fff8e1;
            border: 1px solid #ffd54f;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #5d4037;
        }

        .upload-success {
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #1b5e20;
        }

        .btn-upload {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-upload:hover { background: #0077ed; }
        .btn-upload:disabled { background: #c7c7cc; cursor: default; }
    </style>
</head>

<body>
    <nav class="nav-bar">
        <div style="display:flex; align-items:center;">
            <span class="nav-logo">FS MISO</span>
            <span class="nav-sub">관리자 패널</span>
        </div>
        <a href="index.html" class="back-link">← 대시보드로</a>
    </nav>

    <div class="container">
        <h1 class="page-title">사용자 관리</h1>
        <p class="page-sub">가입 신청 승인 및 전체 사용자 현황을 관리합니다.</p>

        <div class="tabs">
            <button class="tab active" data-tab="pending" onclick="switchTab('pending')">
                승인 대기 <span id="pendingCount"></span>
            </button>
            <button class="tab" data-tab="all" onclick="switchTab('all')">전체 사용자</button>
            <button class="tab" data-tab="upload" onclick="switchTab('upload')">데이터 업로드</button>
        </div>

        <div id="listArea">
            <div class="spinner"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="auth.js"></script>
    <script>
        let allUsers = [];
        let currentTab = 'pending';

        // BUSINESS_UNITS 상수는 auth.js에 정의되어 있습니다.

        // ── 관리자 권한 확인 ──────────────────────────────────
        window.addEventListener('load', () => document.body.classList.add('loaded'));

        window.onload = async function () {
            if (sessionStorage.getItem('fs_admin_access') !== 'true') {
                alert('관리자만 접근 가능한 페이지입니다.');
                window.location.href = 'index.html';
                return;
            }
            await loadUsers();
        };

        // ── 사용자 목록 로드 ──────────────────────────────────
        async function loadUsers() {
            document.getElementById('listArea').innerHTML = '<div class="spinner"></div>';
            try {
                const res = await fetch('/api/admin-users', {
                    headers: { 'X-Admin-Code': getAdminCode() }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '로드 실패');

                allUsers = data.users;
                const pendingCount = allUsers.filter(u => u.approved === false).length;
                document.getElementById('pendingCount').textContent =
                    pendingCount > 0 ? `(${pendingCount})` : '';

                renderList();
            } catch (e) {
                document.getElementById('listArea').innerHTML =
                    `<div class="empty-state"><p style="color:#ff3b30">${e.message}</p></div>`;
            }
        }

        // ── 탭 전환 ──────────────────────────────────────────
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tab);
            });
            if (tab === 'upload') {
                renderUpload();
            } else {
                renderList();
            }
        }

        // ── 목록 렌더링 ───────────────────────────────────────
        function renderList() {
            const users = currentTab === 'pending'
                ? allUsers.filter(u => u.approved === false)
                : allUsers;

            if (users.length === 0) {
                document.getElementById('listArea').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">${currentTab === 'pending' ? '✅' : '👥'}</div>
                        <p>${currentTab === 'pending' ? '승인 대기 중인 사용자가 없습니다.' : '등록된 사용자가 없습니다.'}</p>
                    </div>`;
                return;
            }

            document.getElementById('listArea').innerHTML = `
                <div class="card">
                    ${users.map(u => renderUserRow(u)).join('')}
                </div>`;
        }

        function renderUserRow(u) {
            const initial = (u.full_name || u.email).charAt(0).toUpperCase();
            const createdAt = new Date(u.created_at).toLocaleDateString('ko-KR');
            const isPending  = u.approved === false;
            const isApproved = u.approved === true;

            let badge = '';
            if (isPending)       badge = '<span class="badge badge-pending">승인 대기</span>';
            else if (isApproved) badge = '<span class="badge badge-approved">승인됨</span>';
            else                 badge = '<span class="badge badge-legacy">기존 계정</span>';

            const safeName = (u.full_name || u.email).replace(/'/g, "\\'");
            const actions = isPending ? `
                <div class="actions">
                    <button class="btn-approve" onclick="approveUser('${u.id}', this)" data-meta='${JSON.stringify({full_name: u.full_name, phone: u.phone})}'>승인</button>
                    <button class="btn-reject" onclick="rejectUser('${u.id}', '${safeName}', this)">거절</button>
                </div>` : `
                <div class="actions">
                    <button class="btn-delete" title="계정 삭제 (퇴사 처리)" onclick="deleteUser('${u.id}', '${safeName}', this)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
                        </svg>
                    </button>
                </div>`;

            return `
                <div class="card-row" id="row-${u.id}">
                    <div class="avatar">${initial}</div>
                    <div class="user-info">
                        <div class="user-name">${u.full_name || '(이름 없음)'} ${badge}</div>
                        <div class="user-meta">${u.email} · ${u.phone ? u.phone + ' · ' : ''}${u.business_unit ? u.business_unit + ' · ' : ''}가입 ${createdAt}</div>
                    </div>
                    ${actions}
                </div>`;
        }

        // ── 승인 (1단계: business_unit 입력 UI 표시) ──────────
        function approveUser(userId, btn) {
            const options = BUSINESS_UNITS.map(u =>
                `<option value="${u}">${u}</option>`
            ).join('');
            const wrapper = btn.closest('.actions');
            wrapper.innerHTML = `
                <select id="bu-${userId}" style="width:170px;padding:6px 8px;font-size:13px;border:1px solid #d2d2d7;border-radius:8px;outline:none;">
                    <option value="">소속 선택</option>
                    ${options}
                </select>
                <button onclick="confirmApprove('${userId}')" class="btn-approve">확인</button>
            `;
            document.getElementById(`bu-${userId}`).focus();
        }

        // ── 승인 (2단계: API 호출) ────────────────────────────
        async function confirmApprove(userId) {
            const buInput = document.getElementById(`bu-${userId}`);
            const businessUnit = buInput.value.trim();
            if (!businessUnit) { alert('소속을 선택해주세요.'); return; }

            const confirmBtn = buInput.nextElementSibling;
            confirmBtn.disabled = true;
            confirmBtn.textContent = '처리 중...';

            const user = allUsers.find(u => u.id === userId);
            const meta = { full_name: user?.full_name || '', phone: user?.phone || '' };

            try {
                const res = await fetch('/api/admin-users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Code': getAdminCode() },
                    body: JSON.stringify({ action: 'approve', userId, existingMetadata: meta, businessUnit, adminCode: getAdminCode() })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                showToast('✅ 승인 완료됐습니다.');
                await loadUsers();
            } catch (e) {
                showToast('❌ ' + e.message, true);
                confirmBtn.disabled = false;
                confirmBtn.textContent = '확인';
            }
        }

        // ── 거절 ─────────────────────────────────────────────
        async function rejectUser(userId, name, btn) {
            if (!confirm(`'${name}' 계정을 거절하고 삭제하시겠습니까?`)) return;

            btn.disabled = true;
            btn.previousElementSibling && (btn.previousElementSibling.disabled = true);
            btn.textContent = '처리 중...';

            try {
                const res = await fetch('/api/admin-users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Code': getAdminCode() },
                    body: JSON.stringify({ action: 'reject', userId, adminCode: getAdminCode() })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                showToast('🗑️ 거절 처리됐습니다.');
                await loadUsers();
            } catch (e) {
                showToast('❌ ' + e.message, true);
                btn.disabled = false;
                btn.textContent = '거절';
            }
        }

        // ── 계정 삭제 (퇴사 처리) ────────────────────────────
        async function deleteUser(userId, name, btn) {
            if (!confirm(`'${name}' 계정을 삭제하시겠습니까?\n\n퇴사 처리 시 해당 계정으로 더 이상 로그인할 수 없습니다.`)) return;

            btn.disabled = true;
            btn.innerHTML = '<div style="width:14px;height:14px;border:2px solid #ffc7c5;border-top-color:#ff3b30;border-radius:50%;animation:spin 0.8s linear infinite"></div>';

            try {
                const res = await fetch('/api/admin-users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Code': getAdminCode() },
                    body: JSON.stringify({ action: 'delete', userId, adminCode: getAdminCode() })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                showToast('🗑️ 계정이 삭제되었습니다.');
                await loadUsers();
            } catch (e) {
                showToast('❌ ' + e.message, true);
                btn.disabled = false;
                btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;
            }
        }

        // ── 헬퍼 ─────────────────────────────────────────────
        function getAdminCode() {
            // 환경변수 기반 검증은 서버에서 처리
            // 클라이언트는 sessionStorage에 임시 저장된 코드 전달
            return sessionStorage.getItem('admin_code') || '';
        }

        let toastTimer;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        // ══════════════════════════════════════════════════════
        // 데이터 업로드 탭
        // ══════════════════════════════════════════════════════

        const UPLOAD_TYPES = {
            licenses: {
                label: '인허가 데이터', table: 'licenses',
                templateHeaders: ['영업허가일','사업장명','거래여부','업태구분명','평형','도로명전체주소','주소1','주소2','주소3','순위','담당자','앱시트등록일','위도','경도','사용우유','AI핵심태그'],
                sampleRow:       ['2024-01-15','테스트카페','인허가','커피','30','경기도 포천시 테스트로 1','경기','포천시','신북면','1','홍길동','2024-01-20','37.89','127.20','서울우유',''],
                columnMap: { '영업허가일':'permit_date','사업장명':'business_name','거래여부':'trade_status','업태구분명':'business_type','평형':'area','도로명전체주소':'road_address','주소1':'address1','주소2':'address2','주소3':'address3','순위':'priority','담당자':'manager','앱시트등록일':'appsheet_date','위도':'lat','경도':'lng','사용우유':'milk_type','AI핵심태그':'ai_tags' },
                requiredCol: 'business_name', dateFields: ['permit_date','appsheet_date'], numericFields: ['lat','lng']
            },
            accounts: {
                label: '주요거래처', table: 'accounts',
                templateHeaders: ['거래처명','거래상태','주소'],
                sampleRow:       ['홍길동마트','거래','경기도 포천시 테스트로 2'],
                columnMap: { '거래처명':'business_name','거래상태':'trade_status','주소':'address' },
                requiredCol: 'business_name', dateFields: [], numericFields: []
            },
            visit_logs: {
                label: '방문일지', table: 'visit_logs',
                templateHeaders: ['작성일','방문처(거래처)','작성자','주요이슈','내용','거래상태'],
                sampleRow:       ['2024-03-01','테스트카페','홍길동','가격 문제','방문 후 가격 협의','미거래'],
                columnMap: { '작성일':'visit_date','방문처(거래처)':'business_name','작성자':'manager','주요이슈':'key_issue','내용':'content','거래상태':'trade_status' },
                requiredCol: 'business_name', dateFields: ['visit_date'], numericFields: []
            },
            managers: {
                label: '담당자관리', table: 'managers',
                templateHeaders: ['지역','담당자명','이메일','지점장여부(Y/N)'],
                sampleRow:       ['포천','홍길동','hong@example.com','N'],
                columnMap: { '지역':'region','담당자명':'manager_name','이메일':'email','지점장여부(Y/N)':'is_branch_manager' },
                requiredCol: 'manager_name', dateFields: [], numericFields: []
            }
        };

        let selectedUploadType = 'licenses';
        let parsedUploadData   = null;

        function renderUpload() {
            const cfg = UPLOAD_TYPES[selectedUploadType];
            document.getElementById('listArea').innerHTML = `
                <div class="upload-section">
                    <div class="card">
                        <div class="upload-card-header">1 — 업로드할 데이터 유형</div>
                        <div class="upload-card-body">
                            <div class="type-grid">
                                ${Object.entries(UPLOAD_TYPES).map(([key, c]) => `
                                    <button class="type-btn ${key === selectedUploadType ? 'active' : ''}"
                                            onclick="selectUploadType('${key}')">${c.label}</button>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="upload-card-header">2 — 템플릿 다운로드 후 파일 업로드</div>
                        <div class="upload-card-body">
                            <button class="btn-template" onclick="downloadTemplate()">
                                템플릿 다운로드 (.xlsx)
                            </button>
                            <div class="dropzone" id="dropzone"
                                 onclick="document.getElementById('fileInput').click()"
                                 ondragover="event.preventDefault(); this.classList.add('drag')"
                                 ondragleave="this.classList.remove('drag')"
                                 ondrop="handleDrop(event)">
                                <div id="dropzoneText">파일을 여기에 드롭하거나 클릭 (.xlsx, .xls)</div>
                            </div>
                            <input type="file" id="fileInput" accept=".xlsx,.xls"
                                   style="display:none" onchange="handleFile(event)">
                        </div>
                    </div>

                    <div id="previewCard" style="display:none;">
                        <div class="card" style="margin-bottom:10px;">
                            <div class="upload-card-header">3 — 데이터 미리보기 (상위 5행)</div>
                            <div class="upload-card-body" style="overflow-x:auto;">
                                <div id="previewContent"></div>
                            </div>
                        </div>
                        <div id="uploadWarn" class="upload-warn" style="margin-bottom:10px;"></div>
                        <button class="btn-upload" id="btnUpload" onclick="confirmUpload()">
                            업로드 확인 (기존 데이터 교체)
                        </button>
                    </div>
                </div>`;
        }

        function selectUploadType(type) {
            selectedUploadType = type;
            parsedUploadData   = null;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim() === UPLOAD_TYPES[type].label);
            });
            const fi = document.getElementById('fileInput');
            if (fi) fi.value = '';
            const dz = document.getElementById('dropzone');
            if (dz) {
                dz.classList.remove('has-file');
                document.getElementById('dropzoneText').textContent = '파일을 여기에 드롭하거나 클릭 (.xlsx, .xls)';
            }
            const pc = document.getElementById('previewCard');
            if (pc) pc.style.display = 'none';
        }

        function downloadTemplate() {
            const cfg = UPLOAD_TYPES[selectedUploadType];
            const wb  = XLSX.utils.book_new();
            const ws  = XLSX.utils.aoa_to_sheet([cfg.templateHeaders, cfg.sampleRow]);
            // 헤더 열 너비 자동 설정
            ws['!cols'] = cfg.templateHeaders.map(h => ({ wch: Math.max(h.length + 2, 12) }));
            XLSX.utils.book_append_sheet(wb, ws, cfg.label);
            XLSX.writeFile(wb, `FS_MISO_템플릿_${cfg.label}.xlsx`);
        }

        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('dropzone').classList.remove('drag');
            if (e.dataTransfer.files.length > 0) processUploadFile(e.dataTransfer.files[0]);
        }

        function handleFile(e) {
            if (e.target.files.length > 0) processUploadFile(e.target.files[0]);
        }

        function processUploadFile(file) {
            const cfg    = UPLOAD_TYPES[selectedUploadType];
            const reader = new FileReader();

            reader.onload = function(ev) {
                try {
                    const wb  = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
                    const ws  = wb.Sheets[wb.SheetNames[0]];
                    const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, dateNF: 'YYYY-MM-DD' });

                    if (raw.length < 2) {
                        showToast('데이터가 없습니다. 헤더 외 1행 이상 필요합니다.');
                        return;
                    }

                    const fileHeaders = raw[0].map(h => String(h || '').trim());
                    const rows = raw.slice(1).filter(row => row.some(c => c !== '' && c != null));

                    // 헤더 → DB 컬럼 매핑
                    parsedUploadData = rows.map(row => {
                        const obj = {};
                        fileHeaders.forEach((header, i) => {
                            const dbCol = cfg.columnMap[header];
                            if (!dbCol) return;
                            let val = row[i] != null ? String(row[i]).trim() : '';

                            if (dbCol === 'is_branch_manager') {
                                val = ['Y','y','TRUE','true','1','예','지점장'].includes(val);
                            } else if (cfg.numericFields.includes(dbCol)) {
                                val = val ? parseFloat(val) : null;
                            } else if (val === '') {
                                val = null;
                            }
                            obj[dbCol] = val;
                        });
                        return obj;
                    }).filter(row => row[cfg.requiredCol]);

                    if (parsedUploadData.length === 0) {
                        showToast('유효한 데이터가 없습니다. 필수 컬럼을 확인해주세요.');
                        return;
                    }

                    // 드롭존 업데이트
                    const dz = document.getElementById('dropzone');
                    dz.classList.add('has-file');
                    document.getElementById('dropzoneText').innerHTML =
                        `<strong>${file.name}</strong> — ${parsedUploadData.length}건 인식`;

                    // 미리보기 렌더링
                    const previewRows = parsedUploadData.slice(0, 5);
                    const dbCols      = Object.keys(previewRows[0]);

                    document.getElementById('previewContent').innerHTML = `
                        <div style="margin-bottom:8px;font-size:13px;color:#86868b;">
                            총 <strong style="color:#1d1d1f">${parsedUploadData.length}건</strong> 인식. 상위 5행 미리보기:
                        </div>
                        <table class="preview-table">
                            <thead><tr>${dbCols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
                            <tbody>
                                ${previewRows.map(row =>
                                    `<tr>${dbCols.map(c =>
                                        `<td title="${row[c] ?? ''}">${row[c] ?? ''}</td>`
                                    ).join('')}</tr>`
                                ).join('')}
                            </tbody>
                        </table>`;

                    document.getElementById('uploadWarn').innerHTML =
                        `기존 <strong>${cfg.label}</strong> 데이터가 모두 삭제되고 새 데이터 <strong>${parsedUploadData.length}건</strong>으로 교체됩니다.`;
                    document.getElementById('btnUpload').textContent =
                        `업로드 확인 (${parsedUploadData.length}건 교체)`;
                    document.getElementById('previewCard').style.display = 'block';

                } catch(err) {
                    showToast('파일 파싱 오류: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function confirmUpload() {
            if (!parsedUploadData || parsedUploadData.length === 0) return;
            const cfg = UPLOAD_TYPES[selectedUploadType];

            if (!confirm(`${cfg.label} 기존 데이터를 삭제하고 ${parsedUploadData.length}건을 새로 업로드합니다.\n계속하시겠습니까?`)) return;

            const btn = document.getElementById('btnUpload');
            btn.disabled = true;
            btn.textContent = '업로드 중...';

            try {
                const { data: userData, error: authError } = await client.auth.getUser();
                if (authError || !userData?.user) throw new Error('로그인 정보를 가져올 수 없습니다.');

                const user         = userData.user;
                const businessUnit = user.user_metadata?.business_unit;
                if (!businessUnit) throw new Error('사용자의 소속(business_unit)이 설정되지 않았습니다.');

                // 1. 기존 데이터 삭제 (RLS: 자신이 업로드한 + 같은 지점)
                const { error: delErr } = await client.from(cfg.table)
                    .delete()
                    .eq('business_unit', businessUnit);
                if (delErr) throw new Error('기존 데이터 삭제 실패: ' + delErr.message);

                // 2. 500건씩 분할 INSERT
                const BATCH = 500;
                const now   = new Date().toISOString();
                let inserted = 0;

                for (let i = 0; i < parsedUploadData.length; i += BATCH) {
                    const batch = parsedUploadData.slice(i, i + BATCH).map(row => {
                        const base = { ...row, business_unit: businessUnit };
                        if (cfg.table === 'visit_logs') {
                            base.created_by = user.id;
                            base.created_at = now;
                        } else {
                            base.uploaded_by = user.id;
                            base.uploaded_at = now;
                        }
                        return base;
                    });

                    const { error: insErr } = await client.from(cfg.table).insert(batch);
                    if (insErr) throw new Error(`INSERT 실패 (${i + 1}~${i + batch.length}번째): ` + insErr.message);

                    inserted += batch.length;
                    btn.textContent = `업로드 중... ${inserted}/${parsedUploadData.length}건`;
                }

                // 성공 처리
                document.getElementById('uploadWarn').outerHTML =
                    `<div class="upload-success" style="margin-bottom:10px;">✅ ${cfg.label} ${inserted}건 업로드 완료!</div>`;
                btn.textContent   = '업로드 완료';
                parsedUploadData  = null;
                showToast(`✅ ${cfg.label} ${inserted}건 업로드 완료!`);

            } catch(e) {
                btn.disabled    = false;
                btn.textContent = `업로드 확인 (${parsedUploadData?.length ?? 0}건 교체)`;
                showToast('❌ ' + e.message);
            }
        }

        // ── 관리자 코드 요청 (첫 진입 시) ────────────────────
        (function askAdminCode() {
            if (!sessionStorage.getItem('admin_code')) {
                const code = prompt('관리자 코드를 입력하세요:');
                if (!code) { window.location.href = 'index.html'; return; }
                sessionStorage.setItem('admin_code', code);
            }
        })();
    </script>
</body>

</html>
